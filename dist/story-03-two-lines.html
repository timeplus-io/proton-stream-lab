<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Two Lines Meet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A candy factory shows how two streams are joined: a chart on the wall, two lines with racks that fill up, a rule about time, and keeping only the newest.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Stream Stories: the same ideas as the Stream Lab, told as a small factory for readers who are not engineers.
   Layout: one sheet of cream paper lies on the page and holds the title, the clock time and the drawing; the buttons and the caption sit under it. */
:root {
  /* the page around the sheet follows the reader's theme */
  --page: #E8DFCE; --text: #2B2826; --muted: #6A6257; --rule: #8C8377; --panel: #FBF7EE; --accent: #C4604F; --on-accent: #FFFDF7; --pressed: #2B2826; --on-pressed: #FAF5EA;
  /* the sheet is paper: it looks the same in light and dark */
  --paper: #FAF5EA; --ink: #2B2826; --pencil: #6F675C; --lead: #8C8377; --sheet-accent: #C4604F;
  --font-title: "Young Serif", Georgia, "Times New Roman", serif;
  --font-hand: "Patrick Hand", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #1F1C19; --text: #F3ECDF; --muted: #B5AC9D; --rule: #8C8377; --panel: #2A2622; --accent: #E0806E; --on-accent: #1F1C19; --pressed: #F3ECDF; --on-pressed: #1F1C19; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #1F1C19; --text: #F3ECDF; --muted: #B5AC9D; --rule: #8C8377; --panel: #2A2622; --accent: #E0806E; --on-accent: #1F1C19; --pressed: #F3ECDF; --on-pressed: #1F1C19; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--page); color: var(--text); font-family: var(--font-hand); font-size: 19px; line-height: 1.35; }
.page {
  max-width: 1240px; margin: 0 auto; padding-block: 22px 34px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 12px;
}
.sheet { background: var(--paper); color: var(--ink); box-shadow: 3px 4px 0 rgba(60, 48, 36, 0.16); display: grid; gap: 0; padding: clamp(14px, 3vw, 34px) clamp(14px, 3vw, 38px) 12px; min-width: 0; }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 10px 28px; }
.eyebrow { font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--sheet-accent); }
h1 { font: 400 clamp(34px, 6vw, 60px)/1 var(--font-title); margin: 2px 0 6px; letter-spacing: -0.02em; text-wrap: balance; }
.sub { margin: 0; font-size: 21px; letter-spacing: .06em; }
.now { text-align: right; display: grid; gap: 0; justify-items: end; margin-left: auto; }
.now .time { font-size: 34px; letter-spacing: .08em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.now .status { font-size: 19px; letter-spacing: .05em; }
.note { font-size: 16px; letter-spacing: .04em; color: var(--pencil); margin: 0; }

.stage { position: relative; aspect-ratio: 1400 / 800; margin-inline: clamp(-38px, -3vw, -14px); }
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage .ink { fill: none; stroke: #3a3531; stroke-linecap: round; stroke-linejoin: round; }
.stage .ink-f { stroke: #3a3531; }
.stage .ink.thin { vector-effect: non-scaling-stroke; stroke-width: 1px; }
.stage line.ink.thin { stroke-width: inherit; }
.stage .lab-t { font: 400 23px var(--font-hand); letter-spacing: .13em; fill: var(--ink); }
.stage .lab-n { font: 400 18.5px var(--font-hand); letter-spacing: .05em; fill: var(--pencil); }
.stage .sign { font: 400 21px var(--font-hand); letter-spacing: .16em; fill: var(--ink); }
.stage .lead { fill: none; stroke: var(--lead); stroke-width: 1; }
.stage .ring { fill: var(--paper); stroke: var(--lead); stroke-width: 1; }
.stage .air .cs { display: none; }
.stage .spark { display: none; }
.stage .busy .spark { display: inline; }
.stage .flag-t { font: 400 14px var(--font-hand); letter-spacing: .03em; fill: var(--ink); }
.stage .flag-t.warn { fill: #b14a3a; }
.stage .card-n { font: 400 18px var(--font-hand); fill: var(--ink); }
.stage .card-h { font: 400 13.5px var(--font-hand); letter-spacing: .04em; fill: var(--pencil); }
.stage .board-t { font: 400 19px var(--font-hand); letter-spacing: .14em; fill: var(--pencil); }
.stage .board-r { font: 400 21px var(--font-hand); letter-spacing: .05em; fill: var(--ink); }
.stage .board-n { font: 400 27px var(--font-hand); fill: var(--ink); }
.stage .board-n.hot, .stage .hot .board-r { fill: #c4604f; }
.stage .halo { fill: none; stroke: #c4604f; stroke-width: 2.4; }
.stage .banner { font: 400 30px var(--font-hand); letter-spacing: .12em; fill: #b14a3a; }
.stage .plus { font: 400 22px var(--font-hand); fill: #c4604f; }
.stage.compact .labels { display: none; }

.steps { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.steps .seg { display: flex; flex-wrap: wrap; gap: 8px; }
.steps button {
  font: inherit; font-size: 19px; letter-spacing: .05em; cursor: pointer; color: var(--text);
  background: var(--panel); border: 1.5px solid var(--rule); border-radius: 999px; padding: 5px 16px 6px;
}
.steps button i { font-style: normal; color: var(--muted); margin-right: 6px; }
.steps button[aria-pressed="true"] { background: var(--pressed); color: var(--on-pressed); border-color: var(--pressed); }
.steps button[aria-pressed="true"] i { color: inherit; opacity: .6; }
.steps button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.steps .spacer { flex: 1; }
.steps #play { background: var(--accent); color: var(--on-accent); border-color: var(--accent); min-width: 92px; }
.story { margin: 0; font-size: 23px; line-height: 1.35; max-width: 62ch; text-wrap: pretty; }
.foot { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px 20px; font-size: 17px; letter-spacing: .04em; color: var(--muted); }
.foot .links { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px 22px; }
.foot a { color: inherit; }

</style>
</head>
<body>
<div class="page">
  <div class="sheet">
    <div class="head">
      <header>
        <div class="eyebrow">Stream stories · 03</div>
        <h1>Two lines meet</h1>
        <p class="sub">candies and cups · one pair at a time · racks that must not fill</p>
      </header>
      <div class="now" aria-live="off">
        <div class="time" id="time">12:00:00</div>
        <div class="status" id="status"></div>
      </div>
    </div>
    <div class="stage" id="stage"></div>
    <p class="note">Illustrative: a made-up factory.</p>
  </div>
  <div class="steps">
    <div class="seg" id="scenes" role="group" aria-label="Story steps"></div>
    <span class="spacer"></span>
    <button id="play" type="button">Pause</button>
  </div>
  <p class="story" id="story"></p>
  <div class="foot"><span class="links"><a href="story-02-tally-board.html">← 02 The tally board</a><a href="03-join.html">For engineers: Streaming join</a></span></div>
</div>
<script>
/* Stream Stories, shared kit: one hand-drawn sheet in plain SVG, no libraries.
   Everything is drawn twice, the way a marker sketch is made: a soft wash of colour with paper tooth in it,
   then a thin ink line that bows a little and runs past its corners. The scene is isometric but flat:
   P(x, y, z) turns a place in the room into a point on the sheet. People are small paper dolls that face the reader.
   An episode supplies scenes, init(kit, scene) and tick(dt, now); the story runs until the reader presses Pause. */
const Story = (() => {
  const NS = "http://www.w3.org/2000/svg";
  const W = 1400, H = 800;
  const INK = "#3a3531";
  const PAL = {
    paper: "#faf5ea", floor: "#f1e7d2", wall: "#f6eedd", wood: "#dcbd90", woodDark: "#c19f72", base: "#c9aa7f",
    steel: "#c3c8c9", belt: "#8f8881", dark: "#4f4944", glass: "#bfd6d8", white: "#fefbf3",
    a: "#e59a62", b: "#72bbb0", c: "#ac92d6", red: "#d67c6c", yellow: "#ecc96e", blue: "#86a3c6", green: "#9dbb88", pink: "#efb9b3",
    skin: ["#f3ceac", "#dca97f", "#b07a57"], hair: ["#3f332d", "#7d4d2e", "#a59e95"],
  };
  const BASE = 12 * 3600;
  const hms = (t) => {
    const d = Math.floor(BASE + t + 1e-6);
    return [Math.floor(d / 3600), Math.floor((d % 3600) / 60), d % 60].map((n) => String(n).padStart(2, "0")).join(":");
  };
  function rng(seed) {
    let a = seed >>> 0;
    return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  let rand = rng(1);
  const f = (n) => Math.round(n * 10) / 10;
  function mix(a, b, t) {
    const p = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16)), A = p(a), B = p(b);
    return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, "0")).join("");
  }
  const lighter = (c, t = 0.4) => mix(c, "#fffaf0", t), darker = (c, t = 0.2) => mix(c, "#7a6753", t);

  /* ----- the isometric room: x runs down and right, y down and left, z up ----- */
  const CS = Math.cos(Math.PI / 6), SN = 0.5, U = 52, OX = 551, OY = 236;
  const P = (x, y, z = 0) => [OX + (x - y) * CS * U, OY + (x + y) * SN * U - z * U];

  /* ----- ink: every straight edge is ruled by hand, so it bows a little and overshoots ----- */
  function stroke(a, b, o = {}) {
    const over = o.over ?? 2.4, amp = o.amp ?? 0.9, dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
    const o1 = over * rand(), o2 = over * rand(), bow = (rand() - 0.5) * 2 * amp * Math.min(1, L / 70);
    const A = [a[0] - ux * o1, a[1] - uy * o1], B = [b[0] + ux * o2, b[1] + uy * o2];
    return `M${f(A[0])} ${f(A[1])}Q${f((A[0] + B[0]) / 2 - uy * bow)} ${f((A[1] + B[1]) / 2 + ux * bow)} ${f(B[0])} ${f(B[1])}`;
  }
  const attr = (o) => ` stroke-width="${o.w ?? 1.25}"${o.col ? ` style="stroke:${o.col}"` : ""}${o.op ? ` opacity="${o.op}"` : ""}`;
  const edges = (pairs, o = {}) => `<path class="ink" d="${pairs.map(([a, b]) => stroke(a, b, o)).join("")}"${attr(o)}/>`;
  const loop = (pts, o) => edges(pts.map((p, i) => [p, pts[(i + 1) % pts.length]]), o);
  /* a smooth line through points, for round things and leader lines */
  function curve(pts, closed = false) {
    const n = pts.length, g = (i) => (closed ? pts[(i + n) % n] : pts[Math.max(0, Math.min(n - 1, i))]);
    let d = `M${f(pts[0][0])} ${f(pts[0][1])}`;
    for (let i = 0; i < (closed ? n : n - 1); i++) {
      const p0 = g(i - 1), p1 = g(i), p2 = g(i + 1), p3 = g(i + 2);
      d += `C${f(p1[0] + (p2[0] - p0[0]) / 6)} ${f(p1[1] + (p2[1] - p0[1]) / 6)} ${f(p2[0] - (p3[0] - p1[0]) / 6)} ${f(p2[1] - (p3[1] - p1[1]) / 6)} ${f(p2[0])} ${f(p2[1])}`;
    }
    return d + (closed ? "Z" : "");
  }
  /* ----- wash: flat colour laid a touch off the line, with the paper showing through ----- */
  const tooth = (d) => `<path d="${d}" fill="url(#tooth)"/>`;
  function wash(pts, col, o = {}) {
    const j = o.j ?? 0.9, dx = (rand() - 0.5) * 1.4, dy = (rand() - 0.5) * 1.4;
    const d = "M" + pts.map((p) => f(p[0] + dx + (rand() - 0.5) * j) + " " + f(p[1] + dy + (rand() - 0.5) * j)).join("L") + "Z";
    return `<path d="${d}" fill="${col}"/>` + tooth(d);
  }
  /* a shape given as path data: washed, then inked */
  const shape = (d, col, w = 1.4) => `<path d="${d}" fill="${col}"/>${tooth(d)}<path class="ink" d="${d}" stroke-width="${w}"/>`;
  const dot = (x, y, r, col, w = 1.2) => `<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="${col}"${w ? ` class="ink-f" stroke-width="${w}"` : ""}/>`;
  const shadow = (pts, op = 0.13) => `<path d="M${pts.map((p) => f(p[0]) + " " + f(p[1])).join("L")}Z" fill="#5c5247" opacity="${op}"/>`;

  /* ----- solids ----- */
  /* A box standing at (x, y, z), w along x, d along y, h high. col is the face that looks down and right. */
  function box(x, y, z, w, d, h, col, o = {}) {
    const t = [P(x, y, z + h), P(x + w, y, z + h), P(x + w, y + d, z + h), P(x, y + d, z + h)], b1 = P(x + w, y, z), b2 = P(x + w, y + d, z), b3 = P(x, y + d, z);
    return wash(t, o.top ?? lighter(col)) + wash([t[1], t[2], b2, b1], col) + wash([t[3], t[2], b2, b3], o.side ?? darker(col))
      + edges([[t[0], t[1]], [t[1], t[2]], [t[2], t[3]], [t[3], t[0]], [t[1], b1], [t[2], b2], [t[3], b3], [b1, b2], [b2, b3]], { w: o.w });
  }
  /* An open box you can drop things into. under goes behind what falls in, over goes in front of it. */
  function crate(x, y, z, w, d, h, col) {
    const T = (px, py) => P(px, py, z + h), B = (px, py) => P(px, py, z), in1 = darker(col, 0.45), in2 = darker(col, 0.6);
    const under = wash([B(x, y), B(x + w, y), B(x + w, y + d), B(x, y + d)], darker(col, 0.75)) + wash([T(x, y), T(x, y + d), B(x, y + d), B(x, y)], in1) + wash([T(x, y), T(x + w, y), B(x + w, y), B(x, y)], in2)
      + edges([[T(x, y), T(x + w, y)], [T(x, y), T(x, y + d)], [T(x, y), B(x, y)]], { w: 1.1 });
    const over = wash([T(x + w, y), T(x + w, y + d), B(x + w, y + d), B(x + w, y)], col) + wash([T(x, y + d), T(x + w, y + d), B(x + w, y + d), B(x, y + d)], darker(col))
      + edges([[T(x + w, y), T(x + w, y + d)], [T(x + w, y + d), T(x, y + d)], [T(x + w, y), B(x + w, y)], [T(x + w, y + d), B(x + w, y + d)], [T(x, y + d), B(x, y + d)], [B(x + w, y), B(x + w, y + d)], [B(x + w, y + d), B(x, y + d)]]);
    return { under, over };
  }
  /* An upright cylinder: a can, a jar, a roll. */
  function cyl(x, y, z, r, h, col, o = {}) {
    const c0 = P(x, y, z), c1 = P(x, y, z + h), rx = f(Math.SQRT2 * CS * r * U), ry = f(Math.SQRT2 * SN * r * U);
    const body = `M${f(c1[0] - rx)} ${f(c1[1])}L${f(c0[0] - rx)} ${f(c0[1])}A${rx} ${ry} 0 0 0 ${f(c0[0] + rx)} ${f(c0[1])}L${f(c1[0] + rx)} ${f(c1[1])}A${rx} ${ry} 0 0 1 ${f(c1[0] - rx)} ${f(c1[1])}Z`;
    const top = `M${f(c1[0] - rx)} ${f(c1[1])}A${rx} ${ry} 0 1 0 ${f(c1[0] + rx)} ${f(c1[1])}A${rx} ${ry} 0 1 0 ${f(c1[0] - rx)} ${f(c1[1])}Z`;
    return shape(body, col, o.w ?? 1.2) + shape(top, o.top ?? lighter(col), o.w ?? 1.2);
  }

  /* ----- people: flat paper dolls, feet at (0, 0), about 86 tall with the hat ----- */
  function doll(o = {}) {
    const look = o.look ?? 0, skin = PAL.skin[look], hair = PAL.hair[look], coat = o.coat ?? PAL.blue;
    let h = `<ellipse cx="0" cy="1.5" rx="20" ry="6.5" fill="#8097b8" opacity=".5"/>`;
    [-1, 1].forEach((s) => {
      h += shape(`M${s * 6 - 3.2} -13L${s * 6 - 3.2} -3L${s * 6 + 3.2} -3L${s * 6 + 3.2} -13Z`, "#66738c", 1.2);
      h += shape(`M${s * 6 - 4.4} -3.4Q${s * 6 - 5} 0.8 ${s * 6} 0.8Q${s * 6 + 5} 0.8 ${s * 6 + 4.4} -3.4Z`, "#9a6b4c", 1.2);
    });
    h += shape("M-8.5 -45C-13.5 -45 -15 -40 -16 -34L-20 -15C-21.5 -9 -17 -8.5 -12 -8.5L12 -8.5C17 -8.5 21.5 -9 20 -15L16 -34C15 -40 13.5 -45 8.5 -45Z", coat, 1.5);
    if (o.apron !== false) h += shape("M-6.5 -39L6.5 -39L10.5 -11.5L-10.5 -11.5Z", PAL.white, 1.1);
    h += shape("M-13.6 -57A13.6 13.6 0 1 0 13.6 -57A13.6 13.6 0 1 0 -13.6 -57Z", skin, 1.5);
    h += `<path d="M-13.4 -59C-14 -66 -8 -70.5 0 -70.5C8 -70.5 14 -66 13.4 -59C9 -62.5 4 -63.5 0 -63.5C-4 -63.5 -9 -62.5 -13.4 -59Z" fill="${hair}"/>`;
    h += dot(-5, -55.5, 1.7, INK, 0) + dot(5, -55.5, 1.7, INK, 0);
    h += `<circle cx="-8.6" cy="-51.4" r="3.1" fill="#ee9f97" opacity=".6"/><circle cx="8.6" cy="-51.4" r="3.1" fill="#ee9f97" opacity=".6"/>`;
    h += `<path class="ink" d="M-3 -50.2Q0 -47.6 3 -50.2" stroke-width="1.2"/>`;
    if (o.hat !== false) {
      h += shape("M-10.5 -67C-17.5 -70 -16 -82.5 -6.5 -80.5C-4 -87 6 -87 8 -80.5C16.5 -82.5 17.5 -70 10.5 -67Z", PAL.white, 1.4);
      h += shape("M-11 -70L11 -70L11 -64.5L-11 -64.5Z", PAL.white, 1.2);
    }
    return h;
  }
  /* One arm, hanging from (0, 0). The episode turns it about the shoulder. tool: "paddle" for a small wooden pusher. */
  function arm(o = {}) {
    let h = "";
    if (o.tool === "paddle") h += `<path class="ink" d="M0 22L0 41" stroke-width="2.2" style="stroke:#8a6a48"/>` + shape("M-6.5 38L6.5 38L6.5 48L-6.5 48Z", PAL.wood, 1.2);
    h += shape("M-3.8 0L-3.8 20A3.8 3.8 0 0 0 3.8 20L3.8 0A3.8 3.8 0 0 0 -3.8 0Z", o.coat ?? PAL.blue, 1.3);
    return h + dot(0, 23, 4.1, PAL.skin[o.look ?? 0], 1.2);
  }
  const SHOULDER = [[-13, -39], [13, -39]];   // where the arms hang from, before the doll is scaled

  /* ----- the sheet ----- */
  let stageEl, back, live, labelLayer = null, labels = [], tight = null;
  /* Paper tooth: a small tile of soft noise, made once. Some patches dry lighter and some pool darker, as marker does on paper. */
  function toothTile() {
    const n = 256, c = document.createElement("canvas"); c.width = c.height = n;
    const g = c.getContext("2d"), img = g.createImageData(n, n), r = rng(11);
    const lattice = (m) => {
      const a = new Float32Array(m * m).map(() => r()), v = (i, j) => a[(((j % m) + m) % m) * m + (((i % m) + m) % m)];
      return (x, y) => { const fx = (x / n) * m, fy = (y / n) * m, x0 = Math.floor(fx), y0 = Math.floor(fy), tx = fx - x0, ty = fy - y0, sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty); return (v(x0, y0) * (1 - sx) + v(x0 + 1, y0) * sx) * (1 - sy) + (v(x0, y0 + 1) * (1 - sx) + v(x0 + 1, y0 + 1) * sx) * sy; };
    };
    const n1 = lattice(5), n2 = lattice(12), n3 = lattice(40);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const v = 0.5 * n1(x, y) + 0.3 * n2(x, y) + 0.2 * n3(x, y), grain = r(), i = (y * n + x) * 4, pale = v < 0.44;
      const a = pale ? (0.44 - v) * 0.75 : (v - 0.52) * 0.42;
      img.data[i] = pale ? 255 : 96; img.data[i + 1] = pale ? 250 : 76; img.data[i + 2] = pale ? 238 : 60;
      img.data[i + 3] = Math.max(0, Math.min(1, a + (grain > 0.92 ? 0.035 : 0))) * 255;
    }
    g.putImageData(img, 0, 0);
    return c.toDataURL("image/png");
  }
  function setup(el) {
    stageEl = el;
    const mk = (cls) => { const s = document.createElementNS(NS, "svg"); s.setAttribute("class", cls); s.setAttribute("viewBox", `0 0 ${W} ${H}`); el.appendChild(s); return s; };
    back = mk("back"); live = mk("live");
    back.setAttribute("role", "img"); back.setAttribute("aria-label", "Hand-drawn factory scene");
    window.addEventListener("resize", layout);
  }
  /* On a wide page the whole sheet shows, labels in the margins. On a phone the sheet closes in on the room and the labels step aside. */
  function layout() {
    const compact = stageEl.clientWidth < 720 && tight, v = compact ? tight : [0, 0, W, H];
    stageEl.classList.toggle("compact", !!compact);
    [back, live].forEach((s) => s.setAttribute("viewBox", v.join(" ")));
    stageEl.style.aspectRatio = `${v[2]} / ${v[3]}`;
  }
  const g = (parent, html = "", attrs = "") => { parent.insertAdjacentHTML("beforeend", `<g ${attrs}>${html}</g>`); return parent.lastElementChild; };
  /* the paper: a faint isometric grid and a few pencil crosses */
  function paper() {
    let d = "";
    for (let k = -30; k <= 60; k++) { const a = P(k * 2, -40), b = P(k * 2, 60), c = P(-40, k * 2), e = P(60, k * 2); d += `M${f(a[0])} ${f(a[1])}L${f(b[0])} ${f(b[1])}M${f(c[0])} ${f(c[1])}L${f(e[0])} ${f(e[1])}`; }
    let h = `<path d="${d}" stroke="${INK}" stroke-width=".7" opacity=".055" fill="none"/>`;
    [[120, 560], [1296, 500], [236, 742], [1160, 70], [1040, 770], [300, 84]].forEach(([x, y]) => { h += `<path class="ink" d="M${x - 6} ${y}L${x + 6} ${y}M${x} ${y - 6}L${x} ${y + 6}" stroke-width=".9" opacity=".55"/>`; });
    return h;
  }
  /* Margin notes. list = [{ title, note, x, y, side: "start" | "end", to: [sheet x, sheet y] }] */
  function setLabels(list) {
    labels = list; if (!labelLayer) return;
    labelLayer.innerHTML = list.map((l, i) => `<text class="lab-t" data-i="${i}" x="${l.x}" y="${l.y}" text-anchor="${l.side}">${l.title}</text><text class="lab-n" x="${l.x}" y="${l.y + 22}" text-anchor="${l.side}">${l.note}</text>`).join("");
    let h = ""; rand = rng(5);
    labelLayer.querySelectorAll(".lab-t").forEach((t) => {
      const l = list[+t.dataset.i], w = t.getComputedTextLength(), wn = t.nextElementSibling.getComputedTextLength(), s = l.side === "start" ? 1 : -1;
      const a = [l.x + s * (w + 13), l.y - 7], b = [a[0] + s * Math.max(30, wn - w + 8), a[1] + (rand() - 0.5) * 2], m = [(b[0] + l.to[0]) / 2 + (rand() - 0.5) * 5, (b[1] + l.to[1]) / 2 + (rand() - 0.5) * 5];
      h += `<path class="lead" d="M${f(a[0])} ${f(a[1])}L${f(b[0])} ${f(b[1])}Q${f(m[0])} ${f(m[1])} ${f(l.to[0])} ${f(l.to[1])}"/>`;
      h += `<circle class="ring" cx="${f(a[0])}" cy="${f(a[1])}" r="3"/><circle class="ring" cx="${f(l.to[0])}" cy="${f(l.to[1])}" r="2.6"/>`;
    });
    labelLayer.insertAdjacentHTML("afterbegin", h);
  }

  function start(ep) {
    setup(document.querySelector("#stage"));
    let sceneDef = ep.scenes[0], paused = false, now = 0, last = null;
    const playBtn = document.querySelector("#play"), timeEl = document.querySelector("#time"), statusEl = document.querySelector("#status");
    const tile = toothTile();
    const kit = {
      PAL, INK, P, U, CS, SN, rng, mix, lighter, darker, f,
      edges, loop, curve, wash, shape, dot, shadow, box, crate, cyl, doll, arm, SHOULDER, setLabels,
      /* draw into the still part of the sheet, behind everything that moves */
      still: (html) => back.insertAdjacentHTML("beforeend", html),
      /* a new layer in the moving part of the sheet; layers stack in the order they are made */
      layer: (html = "", attrs = "") => g(live, html, attrs),
      node: g,
      labelLayer: () => { labelLayer = g(live, "", 'class="labels"'); setLabels(labels); return labelLayer; },
      seed: (s) => { rand = rng(s); },
      /* the part of the sheet a phone shows: [x, y, w, h] */
      focus: (v) => { tight = v; layout(); },
      /* start the scene again from 12:00:00 */
      restart: () => load(sceneDef),
    };
    function load(s) {
      sceneDef = s; now = 0; labelLayer = null; labels = []; rand = rng(3);
      document.querySelectorAll("#scenes button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.id === s.id ? "true" : "false"));
      document.querySelector("#story").innerHTML = s.story;
      back.innerHTML = `<defs><pattern id="tooth" patternUnits="userSpaceOnUse" width="256" height="256"><image href="${tile}" width="256" height="256"/></pattern></defs>` + paper();
      live.innerHTML = "";
      ep.init(kit, s);
      layout(); draw();
    }
    function draw() {
      timeEl.textContent = hms(now);
      if (ep.status) statusEl.textContent = ep.status();
    }
    const seg = document.querySelector("#scenes");
    ep.scenes.forEach((s, i) => {
      const b = document.createElement("button");
      b.type = "button"; b.dataset.id = s.id; b.innerHTML = `<i>${i + 1}</i>${s.label}`;
      b.addEventListener("click", () => load(s)); seg.appendChild(b);
    });
    const setPaused = (p) => { paused = p; playBtn.textContent = p ? "Play" : "Pause"; };
    playBtn.addEventListener("click", () => setPaused(!paused));
    document.addEventListener("keydown", (e) => { if (e.code === "Space" && !e.target.closest("button,input,select")) { e.preventDefault(); setPaused(!paused); } });
    document.addEventListener("visibilitychange", () => { last = null; });
    load(sceneDef);
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) setPaused(true);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => setLabels(labels));
    function frame(t) {
      requestAnimationFrame(frame);
      if (last == null) { last = t; return; }
      const dt = Math.min(0.05, (t - last) / 1000); last = t;
      if (paused) return;
      now += dt; ep.tick(dt, now); draw();
    }
    requestAnimationFrame(frame);
  }

  return { start, PAL, hms, rng };
})();

/* Stream Stories: the candy factory that every story is set in.
   Factory(kit) gives an episode the room, the lines, the workers and the things that travel: candies, cups and report cards.
   Places are in room units: x runs along the lines (down and right on the sheet), y across the room, z up. */
const Factory = (k) => {
  const { PAL, P, U, f, CS, SN } = k;
  const FX = 13, FY = 6.4, WH = 3.7;               // floor size and wall height
  const TOP = 0.9, BW = 1.0, V = 1.3, SLAT = 0.6;  // a line: height of its top, its width, its speed
  const MAN = 1.15, R = 0.3, R_SMALL = 0.18;       // size of a worker, of a candy, of a small candy
  const FLAVORS = ["a", "b", "c"];
  const NAMES = { a: "ORANGE", b: "MINT", c: "GRAPE" };
  const path = (pts) => "M" + pts.map((p) => f(p[0]) + " " + f(p[1])).join("L") + "Z";
  let uid = 0, tweens = [];

  /* text that lies on a wall: the left wall is the one the lines come through, the back wall is the long one behind */
  const onLeft = (y, z) => { const p = P(0, y, z); return `matrix(${CS} ${-SN} 0 1 ${f(p[0])} ${f(p[1])})`; };
  const onBack = (x, z) => { const p = P(x, 0, z); return `matrix(${CS} ${SN} 0 1 ${f(p[0])} ${f(p[1])})`; };
  /* a flat panel on the back wall, from x0 to x1 and z0 to z1 */
  const panel = (x0, x1, z0, z1, col, w = 1.4) => { const q = [P(x0, 0, z0), P(x1, 0, z0), P(x1, 0, z1), P(x0, 0, z1)]; return k.wash(q, col) + k.loop(q, { w }); };

  /* ----- the room, drawn once into the still part of the sheet -----
     o.hatches: [{ y, sign }] openings in the left wall; o.window: [x0, x1]; o.clock: [x, z, r]; o.door: x of its left edge */
  function room(o = {}) {
    const hatches = o.hatches ?? [{ y: 3.9, sign: "KITCHEN" }], L = (y, z) => P(0, y, z), B = (x, z) => P(x, 0, z);
    let h = k.box(-0.3, -0.3, -0.55, FX + 0.3, FY + 0.3, 0.37, PAL.base)
      + k.box(-0.3, -0.3, -0.18, FX + 0.3, FY + 0.3, 0.18, k.darker(PAL.floor, 0.12), { top: PAL.floor });
    const joints = [];
    for (let x = 1; x < FX; x++) joints.push([P(x, 0), P(x, FY)]);
    for (let y = 1; y < FY; y++) joints.push([P(0, y), P(FX, y)]);
    h += k.edges(joints, { w: 0.7, op: 0.2, over: 0, amp: 0.5 });
    h += k.box(-0.3, -0.3, 0, 0.3, FY + 0.3, WH, PAL.wall) + k.box(0, -0.3, 0, FX, 0.3, WH, PAL.wall, { side: k.darker(PAL.wall, 0.09) });
    hatches.forEach(({ y, sign }) => {
      const y0 = y - 0.72, y1 = y + 0.72, z0 = 0.5, z1 = 1.95, q = [L(y0, z0), L(y1, z0), L(y1, z1), L(y0, z1)];
      h += k.wash(q, PAL.dark);
      h += k.wash([P(0, y0, z0), P(0, y1, z0), P(-0.3, y1, z0), P(-0.3, y0, z0)], k.darker(PAL.wall, 0.3));     // the sill
      h += k.wash([P(0, y0, z0), P(0, y0, z1), P(-0.3, y0, z1), P(-0.3, y0, z0)], k.darker(PAL.wall, 0.45));    // the far jamb
      h += k.loop(q, { w: 1.4 });
      if (sign) {
        const w = (sign.length * 17 + 26) / U;
        h += k.shape(path([L(y + w / 2, 2.2), L(y - w / 2, 2.2), L(y - w / 2, 2.8), L(y + w / 2, 2.8)]), PAL.white, 1.2);
        h += `<text class="sign" transform="${onLeft(y + w / 2 - 14 / U, 2.34)}">${sign}</text>`;
      }
    });
    if (o.window) {
      const [x0, x1] = o.window, xm = (x0 + x1) / 2;
      h += panel(x0, x1, 1.6, 3.0, PAL.glass, 1.5) + k.edges([[B(xm, 1.6), B(xm, 3.0)], [B(x0, 2.4), B(x1, 2.4)]], { w: 1.1 });
      h += k.edges([[B(x0 + 0.3, 1.85), B(x0 + 0.7, 2.2)], [B(xm + 0.35, 2.6), B(xm + 0.75, 2.85)]], { w: 0.8, op: 0.5, over: 0 });
    }
    if (o.clock) {
      const [cx, cz, r] = o.clock, c0 = P(cx, 0, cz); let ticks = "";
      for (let i = 0; i < 12; i++) { const a = (i / 12) * Math.PI * 2, r0 = r * (i % 3 ? 0.84 : 0.74), r1 = r * 0.92; ticks += `M${(Math.sin(a) * r0).toFixed(3)} ${(Math.cos(a) * r0).toFixed(3)}L${(Math.sin(a) * r1).toFixed(3)} ${(Math.cos(a) * r1).toFixed(3)}`; }
      h += `<g transform="matrix(${f(CS * U)} ${f(SN * U)} 0 ${-U} ${f(c0[0])} ${f(c0[1])})"><circle r="${r + 0.07}" fill="${PAL.dark}"/><circle r="${r}" fill="${PAL.white}"/><path class="ink thin" d="${ticks}"/></g>`;
    }
    if (o.door != null) {
      const x = o.door;
      h += panel(x, x + 1.2, 0, 2.5, PAL.blue) + k.loop([B(x + 0.2, 1.4), B(x + 1.0, 1.4), B(x + 1.0, 2.3), B(x + 0.2, 2.3)], { w: 0.9, op: 0.7, over: 0.5 }) + k.dot(...B(x + 1.0, 1.15), 2.6, PAL.yellow, 1.1);
    }
    k.still(h);
  }
  /* the hands of the wall clock; returns a function to call every frame */
  function clockHands(layer, [cx, cz, r]) {
    const c0 = P(cx, 0, cz);
    const hands = k.node(layer, `<line class="ink thin" x1="0" y1="0" stroke-width="2.2"/><line class="ink thin" x1="0" y1="0" stroke-width="1.4" style="stroke:#c4604f"/><circle r=".05" fill="${k.INK}"/>`, `transform="matrix(${f(CS * U)} ${f(SN * U)} 0 ${-U} ${f(c0[0])} ${f(c0[1])})"`).querySelectorAll("line");
    const set = (el, turn, len) => { const a = turn * Math.PI * 2; el.setAttribute("x2", (Math.sin(a) * len).toFixed(3)); el.setAttribute("y2", (Math.cos(a) * len).toFixed(3)); };
    return (now) => { set(hands[0], now / 3600, r * 0.5); set(hands[1], now / 60, r * 0.8); };
  }

  /* ----- a line (conveyor) from x0 to x1, centred on y. Its slats move, so the line visibly runs. ----- */
  function belt(layer, x0, x1, y) {
    const y0 = y - BW / 2, y1 = y + BW / 2, id = "belt" + ++uid;
    const top = [P(x0, y0 + 0.08, TOP), P(x1, y0 + 0.08, TOP), P(x1, y1 - 0.08, TOP), P(x0, y1 - 0.08, TOP)];
    const legs = []; for (let x = x0 + (x0 === 0 ? 1.2 : 0.3); x < x1 - 1.2; x += 2.4) legs.push(x); legs.push(x1 - 0.3);
    let h = k.shadow([P(x0, y1), P(x1, y1), P(x1, y1 + 0.45), P(x0, y1 + 0.45)], 0.12);
    h += legs.map((x) => k.box(x, y0 + 0.06, 0, 0.12, 0.12, 0.62, PAL.steel)).join("");
    h += k.box(x0, y0, 0.62, x1 - x0, BW, TOP - 0.62, PAL.steel) + k.wash(top, PAL.belt) + k.loop(top, { w: 1 });
    h += legs.map((x) => k.box(x, y1 - 0.18, 0, 0.12, 0.12, 0.62, PAL.steel)).join("");
    let lines = "";
    for (let x = x0 - SLAT; x < x1; x += SLAT) { const a = P(x, y0 + 0.12, TOP), b = P(x, y1 - 0.12, TOP); lines += `M${f(a[0])} ${f(a[1])}L${f(b[0])} ${f(b[1])}`; }
    h += `<defs><clipPath id="${id}"><path d="${path(top)}"/></clipPath></defs><g clip-path="url(#${id})"><g class="slats"><path d="${lines}" stroke="#c9c2b8" stroke-width="1.3" opacity=".75" fill="none"/></g></g>`;
    const slats = k.node(layer, h).querySelector(".slats");
    return { x0, x1, y, at: (x, z = TOP) => P(x, y, z), update(t) { const ph = (V * t) % SLAT; slats.setAttribute("transform", `translate(${f(ph * CS * U)} ${f(ph * SN * U)})`); } };
  }
  /* a low table with a wooden top, the same height as a line: somewhere to keep things */
  function rack(layer, x0, x1, y) {
    const y0 = y - BW / 2;
    const legs = [x0 + 0.15, x1 - 0.27];
    return k.node(layer, k.shadow([P(x0, y0 + BW), P(x1, y0 + BW), P(x1, y0 + BW + 0.45), P(x0, y0 + BW + 0.45)], 0.12)
      + legs.map((x) => k.box(x, y0 + 0.06, 0, 0.12, 0.12, 0.72, PAL.woodDark)).join("")
      + k.box(x0, y0, 0.72, x1 - x0, BW, TOP - 0.72, PAL.wood)
      + legs.map((x) => k.box(x, y0 + BW - 0.18, 0, 0.12, 0.12, 0.72, PAL.woodDark)).join(""));
  }
  /* an open box on the floor; things dropped in go behind its front. Returns its middle. */
  function bin(L, x, y, w, d, h, col) {
    const c = k.crate(x, y, 0, w, d, h, col);
    k.node(L.under, k.shadow([P(x, y + d), P(x + w, y + d), P(x + w, y + d + 0.35), P(x, y + d + 0.35)]) + c.under);
    k.node(L.over, c.over);
    return { x: x + w / 2, y: y + d / 2, h, mouth: P(x + w / 2, y + d / 2, h - 0.05), floor: P(x + w / 2, y + d / 2, 0.1) };
  }

  /* ----- a worker: a paper doll whose hands go where the work is ----- */
  function worker(L, o) {
    const foot = P(o.x, o.y, 0), look = o.look ?? 0, coat = o.coat ?? PAL.blue;
    const body = k.node(L.dolls, `<g transform="scale(${MAN})">${k.doll({ look, coat })}</g>`);
    const arms = k.SHOULDER.map(() => k.node(L.arms, `<g transform="scale(${MAN})">${k.arm({ look, coat })}</g>`));
    const rest = [8, -8], cur = [{ a: 8, s: 1 }, { a: -8, s: 1 }];
    let tilt = 0;
    return {
      foot, x: o.x, y: o.y, phase: o.phase ?? 0,
      /* where the worker holds something up to look at it: beside the face, on the side of the line */
      held: P(o.x - 0.3, o.y + 0.55, 1.1),
      /* hands: a sheet point for each hand, or null to let that arm hang */
      pose(now, dt, hands = [null, null]) {
        const q = 1 - Math.exp(-dt * 16), aim = hands[0] || hands[1], [fx, fy] = foot;
        tilt += ((aim ? Math.max(-5, Math.min(5, (aim[0] - fx) / 9)) : 0) - tilt) * q;
        const lean = tilt + Math.sin(now * 1.7 + this.phase) * 0.8, bob = Math.sin(now * 2.2 + this.phase) * 0.6, a = (lean * Math.PI) / 180;
        body.setAttribute("transform", `translate(${f(fx)} ${f(fy + bob)}) rotate(${lean.toFixed(2)})`);
        k.SHOULDER.forEach(([sx, sy], i) => {
          const x = fx + MAN * (sx * Math.cos(a) - sy * Math.sin(a)), y = fy + bob + MAN * (sx * Math.sin(a) + sy * Math.cos(a));
          let ta = rest[i], ts = 1;
          if (hands[i]) { const dx = hands[i][0] - x, dy = hands[i][1] - y; ta = (Math.atan2(-dx, dy) * 180) / Math.PI; ts = Math.max(0.7, Math.min(1.9, Math.hypot(dx, dy) / (24 * MAN))); }
          let da = ta - cur[i].a; da -= Math.round(da / 360) * 360;
          cur[i].a += da * q; cur[i].s += (ts - cur[i].s) * q;
          arms[i].setAttribute("transform", `translate(${f(x)} ${f(y)}) rotate(${cur[i].a.toFixed(1)}) scale(1 ${cur[i].s.toFixed(3)})`);
        });
      },
    };
  }
  /* both hands on a thing at sheet point p */
  const grip = (p, r = 10) => (p ? [[p[0] - r, p[1] - r], [p[0] + r, p[1] - r]] : [null, null]);

  /* ----- things that travel ----- */
  const spark = (r) => `<path class="ink spark" d="M${f(-r * 1.25)} ${f(-r * 0.9)}L${f(-r * 1.75)} ${f(-r * 1.3)}M0 ${f(-r * 1.5)}L0 ${f(-r * 2.1)}M${f(r * 1.25)} ${f(-r * 0.9)}L${f(r * 1.75)} ${f(-r * 1.3)}" stroke-width="1.5"/>`;
  /* a small paper tag on a pin above a thing r tall-ish: a time stamp or a name */
  function flagArt(text, top, warn) {
    const w = text.length * 8.6 + 12;
    return `<path class="ink" d="M0 ${f(top)}L0 ${f(top - 9)}" stroke-width="1.1"/>`
      + `<path d="M${f(-w / 2)} ${f(top - 27)}L${f(w / 2)} ${f(top - 27)}L${f(w / 2)} ${f(top - 9)}L${f(-w / 2)} ${f(top - 9)}Z" fill="${warn ? "#fbe1da" : PAL.white}" class="ink-f" stroke-width="1.1"${warn ? ' style="stroke:#c4604f"' : ""}/>`
      + `<text class="flag-t${warn ? " warn" : ""}" x="0" y="${f(top - 13.2)}" text-anchor="middle">${text}</text>`;
  }
  function candyArt(it) {
    const r = it.r * U, col = it.grey ? "#cfc8bd" : PAL[it.flavor], pts = [];
    for (let i = 0; i < 14; i++) { const a = (i / 14) * Math.PI * 2, q = r * (1 + 0.03 * Math.sin(i * 2.4 + it.id)); pts.push([Math.cos(a) * q, Math.sin(a) * q]); }
    const ball = k.curve(pts, true);
    let h = `<ellipse class="cs" cx="${f(r * 0.25)}" cy="${f(r * 1.02)}" rx="${f(r * 1.05)}" ry="${f(r * 0.42)}" fill="#3d3631" opacity=".28"/>`;
    if (it.wrapped) {
      const tw = (s) => k.shape(`M${f(s * r * 0.8)} 0L${f(s * r * 1.85)} ${f(-r * 0.68)}L${f(s * r * 1.6)} 0L${f(s * r * 1.85)} ${f(r * 0.68)}Z`, k.lighter(col, 0.3), 1.2);
      const band = `M${f(-r * 0.34)} ${f(-r * 0.93)}Q${f(-r * 0.05)} 0 ${f(-r * 0.34)} ${f(r * 0.93)}`, band2 = `${f(r * 0.34)} ${f(r * 0.93)}Q${f(r * 0.63)} 0 ${f(r * 0.34)} ${f(-r * 0.93)}`;
      h += `<g transform="rotate(30)">${tw(-1)}${tw(1)}${k.shape(ball, col, 1.4)}<path d="${band}L${band2}Z" fill="${PAL.white}" opacity=".9"/><path class="ink" d="${band}M${band2}" stroke-width="1"/></g>`;
    } else {
      h += k.shape(ball, col, 1.4);
      h += `<path d="M${f(-r * 0.55)} ${f(-r * 0.25)}Q${f(-r * 0.5)} ${f(-r * 0.62)} ${f(-r * 0.12)} ${f(-r * 0.66)}" stroke="#fffaf0" stroke-width="${f(r * 0.2)}" stroke-linecap="round" fill="none" opacity=".75"/>`;
    }
    return `<g transform="translate(0 ${f(-r)})">${h}${spark(r)}</g>` + (it.flag ? flagArt(it.flag, -2 * r - 1, it.warn) : "");
  }
  /* a paper cup, about as big as a candy */
  function cupArt(it) {
    const col = it.grey ? "#cfc8bd" : PAL[it.flavor], t = 14.5, b = 9.5, hgt = 21;
    let h = `<ellipse class="cs" cx="3" cy="1" rx="13" ry="5" fill="#3d3631" opacity=".28"/>`;
    h += k.shape(`M${-t} ${-hgt}L${-b} -2Q0 3 ${b} -2L${t} ${-hgt}Z`, col, 1.4);
    h += `<path class="ink" d="M-5.5 ${-hgt + 4}L-3.6 -1M5.5 ${-hgt + 4}L3.6 -1M0 ${-hgt + 5}L0 0" stroke-width=".9" opacity=".6"/>`;
    h += k.shape(`M${-t} ${-hgt}A${t} 5 0 1 0 ${t} ${-hgt}A${t} 5 0 1 0 ${-t} ${-hgt}Z`, k.darker(col, 0.35), 1.3);
    return h + `<g transform="translate(0 -10)">${spark(13)}</g>` + (it.flag ? flagArt(it.flag, -hgt - 6, it.warn) : "");
  }
  const artOf = (it) => (it.kind === "cup" ? cupArt(it) : candyArt(it));
  /* make a candy or a cup. o: { kind, flavor, small, flag: text on a tag, warn: a red tag, grey: no longer of use } */
  function thing(layer, o) {
    const it = { id: ++uid, kind: "candy", wrapped: false, ...o }; it.r = it.small ? R_SMALL : R;
    it.el = k.node(layer, artOf(it));
    return it;
  }
  const redraw = (it) => { it.el.innerHTML = artOf(it); };
  /* put a thing at a sheet point. o: { s: scale, rot: degrees, air: off the line, busy: being worked on } */
  function put(it, p, o = {}) {
    it.pos = p;
    it.el.setAttribute("transform", `translate(${f(p[0])} ${f(p[1])})${o.rot ? ` rotate(${o.rot.toFixed(1)})` : ""}${o.s != null && o.s !== 1 ? ` scale(${o.s.toFixed(3)})` : ""}`);
    if (!!o.air !== !!it.air) { it.air = !!o.air; it.el.classList.toggle("air", it.air); }
    if (!!o.busy !== !!it.busy) { it.busy = !!o.busy; it.el.classList.toggle("busy", it.busy); }
  }
  /* A report card: a piece of paper that stands up and faces the reader.
     o.head: a first line of small text; o.parts: [{ flavor, n }]; o.pair: a flavor, drawn as a candy in its cup */
  function cardArt(o) {
    const parts = o.parts ?? [], w = Math.max(o.head ? o.head.length * 7.6 + 16 : 0, parts.length * 35 + 9, o.pair ? 40 : 0), h = (o.head ? 17 : 0) + (o.pair ? 36 : 27);
    let s = `<ellipse class="cs" cx="3" cy="1.5" rx="${f(w * 0.46)}" ry="4.5" fill="#3d3631" opacity=".22"/><path class="ink" d="M${f(-w * 0.28)} -4L${f(-w * 0.28 - 3)} 1.5M${f(w * 0.28)} -4L${f(w * 0.28 + 3)} 1.5" stroke-width="1.5"/>`;
    s += k.shape(`M${f(-w / 2)} ${-h - 4}L${f(w / 2)} ${-h - 4}L${f(w / 2)} -4L${f(-w / 2)} -4Z`, PAL.white, 1.3);
    if (o.head) s += `<text class="card-h" x="0" y="${-h + 9.5}" text-anchor="middle">${o.head}</text>`;
    parts.forEach((c, i) => { const x = -((parts.length - 1) * 35) / 2 + i * 35; s += k.dot(x - 8, -17.5, 6.5, PAL[c.flavor], 1.1) + `<text class="card-n" x="${f(x + 1.5)}" y="-12">${c.n}</text>`; });
    if (o.pair) { const col = PAL[o.pair]; s += k.shape("M-11 -26L-7 -9Q0 -6 7 -9L11 -26Z", k.lighter(col, 0.15), 1.2) + k.shape("M-8.5 -27A8.5 8.5 0 1 1 8.5 -27Z", col, 1.2); }
    return s;
  }
  const card = (layer, o) => { const c = { id: ++uid, ...o }; c.el = k.node(layer, cardArt(o)); return c; };

  /* ----- small moves: an element travels from one sheet point to another, on an arc if wanted ----- */
  function fly(el, a, b, t0, dur, o = {}) { const t = { el, a, b, t0, dur, ...o }; tweens.push(t); return t; }
  function run(now) {
    const cur = tweens; tweens = [];          // a move that ends may start the next one, so new moves collect in a fresh list
    const keep = cur.filter((t) => {
      const u = (now - t.t0) / t.dur; if (u < 0) return true;
      const e = u >= 1 ? 1 : u * u * (3 - 2 * u), x = t.a[0] + (t.b[0] - t.a[0]) * e, y = t.a[1] + (t.b[1] - t.a[1]) * e - (t.arc ?? 0) * Math.sin(Math.PI * e);
      t.el.style.display = "";
      t.el.setAttribute("transform", `translate(${f(x)} ${f(y)})${t.scale ? ` scale(${(t.scale[0] + (t.scale[1] - t.scale[0]) * e).toFixed(3)})` : ""}`);
      if (t.it) t.it.pos = [x, y];
      if (u >= 1) { if (t.done) t.done(); return false; }
      return true;
    });
    tweens = keep.concat(tweens);
  }
  const reset = () => { tweens = []; };
  /* fall into a bin: over its edge, then down out of sight, then gone */
  function drop(it, from, b, now, done) {
    it.el.classList.add("air");
    fly(it.el, from, b.mouth, now, 0.42, { arc: 26, it, done: () => fly(it.el, b.mouth, b.floor, now + 0.42, 0.22, { it, done: () => { it.el.remove(); if (done) done(); } }) });
  }

  return { FX, FY, WH, TOP, BW, V, MAN, R, R_SMALL, FLAVORS, NAMES, path, onLeft, onBack, panel, room, clockHands, belt, rack, bin, worker, grip,
    thing, redraw, put, card, cardArt, flagArt, fly, run, reset, drop };
};

</script>
<script>
/* Story 03, Two lines meet.
   Bringing two things together. First a candy and a chart on the wall, which never changes.
   Then two lines that both move: candies and cups. A candy and a cup of the same flavor make a pair,
   the racks are what the worker has to remember, and the three scenes are three ways to keep the racks from filling up. */
(() => {
  const CLOCK = [2.2, 2.85, 0.6];
  /* scene 1: one line and a chart on the wall */
  const BY = 3.9, WY = 2.95, SX = 5.2, X1 = 10.6, HOLD = 1.0, LIFT = 0.42;
  const CH = { x: 6.9, w: 2.7, z: 3.35, h: 2.15 };
  /* scenes 2 to 4: cups come in at the back, candies at the front, the worker stands between them */
  const YB = 1.4, YF = 5.1, YM = 3.25, XE = 3.0;                // the two lines end at XE; the cards leave along y = YM
  const WX = 3.6, WYM = 2.9;                                    // where the worker stands
  const S0 = 5.4, DS = 0.68, SIZE = 6;                           // places on a rack
  const OUT0 = 9.4, LAND = 9.8, OUT1 = 11.0;                    // the line the pair cards leave on
  const FRESH = 5;                                              // seconds a thing stays fresh

  const SCENES = [
    { id: "lookup", label: "Look it up",
      story: "Sometimes a candy needs something it does not carry itself. Here it is a name. The worker holds up each candy, finds its flavor on the chart and pins the name on. The chart just hangs on the wall and never changes. Engineers call this a join with a table." },
    { id: "keep", label: "Keep everything", two: true,
      story: "Now both sides move. Candies come on one line and cups on the other, and a candy and a cup of the same flavor make a pair. A partner may still be on its way, so the worker keeps everything on the racks and writes a card for every pair. But the lines never end, so the racks fill up, and then the work has to stop. Engineers call this a join of two streams, and the racks its state." },
    { id: "fresh", label: "Only fresh ones", two: true, fresh: true,
      story: "The cure is a rule about time. A candy and a cup only make a pair if they arrived within five seconds of each other. So anything older than five seconds can never find a partner again, and it is cleared away. The racks stay small and the work can go on forever." },
    { id: "newest", label: "Keep the newest", two: true, latest: true,
      story: "Often only the newest counts. The rack holds one cup of each flavor. A new cup takes the place of the old one, and no card is written for it. Each candy gets one card, with the newest cup of its flavor, and moves on. The candy itself is not kept." },
  ];

  let k, F, P, U, PAL, rnd, sc, L, who, hands, ship, belts, items, cards, todo, counts, cur, nextBorn;
  let racks, lanes, hopper, oldBin, banner, halt, lastLand, ahead, seq, deck, hot;

  const later = (t, fn) => todo.push({ t, fn });
  const due = (now) => { const d = todo.filter((j) => j.t <= now); todo = todo.filter((j) => j.t > now); d.sort((a, b) => a.t - b.t).forEach((j) => j.fn(now)); };
  const fadeIn = (it, x) => { it.el.style.opacity = Math.max(0, Math.min(1, (x - 0.05) / 0.3)); };
  const top = (it) => (it.kind === "cup" ? 10 : it.r * U);       // half the height of a thing, in sheet units
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  /* ================= scene 1: look it up ================= */
  const chartRow = (i, px = 0) => P(CH.x + (14 + px) / U, 0, CH.z - (50 + i * 27) / U);
  function drawChart() {
    L.board.innerHTML = F.FLAVORS.map((fl, i) => {
      const p = chartRow(i);
      return `<g transform="matrix(${k.CS} ${k.SN} 0 1 ${k.f(p[0])} ${k.f(p[1])})"${hot === fl ? ' class="hot"' : ""}>${k.dot(8, -7, 7.5, PAL[fl], 1.1)}<text class="board-r" x="25" y="0">${F.NAMES[fl]}</text></g>`;
    }).join("");
  }
  function initLookup() {
    F.room({ clock: CLOCK, door: 11.2 });
    k.still(F.panel(CH.x, CH.x + CH.w, CH.z - CH.h, CH.z, "#fdfaf1", 1.7) + `<text class="board-t" transform="${F.onBack(CH.x + 14 / U, CH.z - 22 / U)}">FLAVORS</text>`);
    L = { clock: k.layer(), board: k.layer(), dolls: k.layer(), belt: k.layer(), under: k.layer(), candy: k.layer(), air: k.layer(), arms: k.layer(), over: k.layer() };
    belts = [F.belt(L.belt, 0, X1, BY)];
    who = F.worker(L, { x: SX, y: WY, look: 2, coat: PAL.yellow });
    ship = F.bin(L, X1 + 0.4, BY - 0.7, 1.5, 1.4, 0.75, PAL.wood);
    drawChart();
    k.labelLayer();
    k.setLabels([
      { title: "KITCHEN", note: "candies come out one by one", x: 56, y: 150, side: "start", to: P(0, BY + 0.3, 1.7) },
      { title: "CHART", note: "always the same, it never moves", x: 1344, y: 150, side: "end", to: P(CH.x + CH.w - 0.3, 0, CH.z - 0.3) },
      { title: "WORKER", note: "looks up every candy on the chart", x: 56, y: 520, side: "start", to: [who.foot[0] + 15 * F.MAN, who.foot[1] - 58 * F.MAN] },
      { title: "SHIPPING", note: "every candy leaves with its name", x: 1344, y: 650, side: "end", to: P(X1 + 1.9, BY + 0.2, 0.55) },
    ]);
    // the line is already running when the story opens
    nextBorn = -X1 / F.V + 0.5;
    while (nextBorn <= 0) { const it = candy(nextBorn); if (-F.V * it.born >= SX) { it.done = true; it.flag = F.NAMES[it.flavor]; F.redraw(it); } nextBorn += 1.3 + rnd() * 1.6; }
  }
  function candy(born) {
    const it = F.thing(L.candy, { flavor: F.FLAVORS[Math.floor(rnd() * 3)] }); it.born = born; it.state = "line";
    items.push(it); return it;
  }
  /* the worker has a candy in hand: the row on the chart lights up and its name comes over */
  function lookUp(it, now) {
    const i = F.FLAVORS.indexOf(it.flavor), name = F.NAMES[it.flavor];
    later(now + 0.12, () => { hot = it.flavor; drawChart(); });
    later(now + 0.18, (t) => {
      const tag = k.node(L.air, F.flagArt(name, -2 * it.r * U - 1));
      F.fly(tag, chartRow(i, 60, 0), P(SX, BY, F.TOP + LIFT), t, HOLD / 2 - 0.18, { arc: 12, scale: [0.7, 1], done: () => { tag.remove(); it.flag = name; F.redraw(it); counts.named++; } });
    });
    later(now + 0.8, () => { if (hot === it.flavor) { hot = null; drawChart(); } });
  }
  function tickLookup(dt, now) {
    while (nextBorn <= now) { candy(nextBorn); nextBorn += 1.3 + rnd() * 1.6; }
    items.forEach((it) => {
      const x = F.V * (now - it.born);
      if (!it.done && x >= SX - (F.V * HOLD) / 2) { it.done = true; it.act = now; cur.it = it; lookUp(it, now); }
      let z = F.TOP, o = {};
      if (it.act != null) {
        const u = (now - it.act) / HOLD;
        if (u >= 1) { it.act = null; if (cur.it === it) cur.it = null; } else { z += LIFT * Math.sin(Math.PI * u); o = { air: true, busy: u > 0.2 && u < 0.85 }; }
      }
      if (x >= X1) { it.state = "out"; F.drop(it, P(X1, BY, F.TOP), ship, now); return; }
      F.put(it, P(x, BY, z), o); fadeIn(it, x);
    });
    items = items.filter((it) => it.state === "line");
  }

  /* ================= scenes 2 to 4: two lines ================= */
  const laneY = (side) => (side === "cup" ? YB : YF);
  const place = (side, i) => P(S0 + DS * i, laneY(side), F.TOP);
  const other = (side) => (side === "cup" ? "candy" : "cup");

  function initTwo() {
    F.room({ hatches: [{ y: YB, sign: "CUPS" }, { y: YF, sign: "CANDY" }], clock: CLOCK });
    L = { clock: k.layer(), board: k.layer(), beltBack: k.layer(), cup: k.layer(), dolls: k.layer(), beltMid: k.layer(), under: k.layer(),
      beltFront: k.layer(), candy: k.layer(), air: k.layer(), arms: k.layer(), over: k.layer() };
    belts = [F.belt(L.beltBack, 0, XE, YB), F.belt(L.beltFront, 0, XE, YF), F.belt(L.beltMid, OUT0, OUT1, YM)];
    who = F.worker(L, { x: WX, y: WYM, look: 2, coat: PAL.yellow });
    ship = F.bin(L, OUT1 + 0.4, YM - 0.7, 1.4, 1.4, 0.75, PAL.wood);
    racks = { cup: Array(sc.latest ? 3 : SIZE).fill(null), candy: Array(SIZE).fill(null) };
    const rackEnd = S0 + DS * (racks.cup.length - 1) + 0.3;
    F.rack(L.beltBack, S0 - 0.3, rackEnd, YB);
    if (sc.latest) {
      oldBin = F.bin(L, 7.3, YB - 0.55, 1.1, 1.1, 0.7, PAL.red);
      hopper = F.bin(L, 4.2, YF - 0.6, 1.2, 1.2, 0.75, PAL.wood);
      F.FLAVORS.forEach((fl, i) => { const it = F.thing(L.cup, { kind: "cup", flavor: fl }); it.side = "cup"; it.state = "rack"; F.put(it, place("cup", i)); racks.cup[i] = it; });   // one cup of each flavor is there already
    } else {
      F.rack(L.beltFront, S0 - 0.3, rackEnd, YF);
      banner = k.node(L.board, F.panel(5.6, 10.4, 1.25, 2.05, "#fbe1da", 1.6) + `<text class="banner" transform="${F.onBack(5.85, 1.47)}">NO ROOM LEFT</text>`, 'style="display:none"');
    }
    const cupEnd = P(rackEnd, YB - 0.5, F.TOP);
    const list = [
      { title: "WORKER", note: "takes every candy and cup in hand", x: 56, y: 560, side: "start", to: [who.foot[0] - 4, who.foot[1] - 30 * F.MAN] },
      { title: "PAIRS", note: "one card for every pair", x: 1344, y: 660, side: "end", to: P(OUT1 + 1.8, YM + 0.2, 0.5) },
    ];
    if (sc.latest) list.push(
      { title: "NEWEST CUPS", note: "one of each flavor", x: 1344, y: 440, side: "end", to: cupEnd },
      { title: "OLD CUPS", note: "replaced, so thrown out", x: 1344, y: 545, side: "end", to: P(8.4, YB, 0.35) },
      { title: "CANDY", note: "gets its card and is not kept", x: 56, y: 690, side: "start", to: P(4.2, YF + 0.2, 0.4) });
    else list.push(
      { title: "CUP RACK", note: sc.fresh ? "each tag shows the age in seconds" : "every cup is kept", x: 1344, y: 470, side: "end", to: cupEnd },
      { title: "CANDY RACK", note: sc.fresh ? "older than 5 seconds: cleared away" : "every candy is kept", x: 56, y: 690, side: "start", to: P(S0, YF + 0.5, 0.45) });
    k.labelLayer(); k.setLabels(list);
    deck = { candy: shuffle(["a", "a", "b", "b", "c", "c"]), cup: shuffle(["a", "a", "b", "b", "c", "c"]) };
    seq = 0; ahead = null; lastLand = -9; halt = null;
  }

  /* what comes next, and when it reaches the end of its line. The two lines take turns, so the worker has one thing in hand at a time. */
  function nextUp() {
    const n = seq++;
    if (sc.latest) {
      const side = n % 3 === 2 ? "cup" : "candy";
      return { t: 0.9 + 1.4 * n, side, flavor: side === "cup" ? F.FLAVORS[Math.floor(n / 3) % 3] : F.FLAVORS[Math.floor(rnd() * 3)] };
    }
    const side = n % 2 ? "cup" : "candy";
    if (!sc.fresh) return { t: 0.9 + 1.5 * n, side, flavor: deck[side][Math.floor(n / 2) % SIZE] };
    const there = racks[other(side)].filter((p) => p && !p.grey);            // likely partners, so that pairs do happen
    return { t: 0.9 + 1.3 * n, side, flavor: there.length && rnd() < 0.62 ? there[Math.floor(rnd() * there.length)].flavor : F.FLAVORS[Math.floor(rnd() * 3)] };
  }
  function spawn(now) {
    for (;;) {
      if (!ahead) ahead = nextUp();
      if (ahead.t - XE / F.V > now) return;
      const it = F.thing(L[ahead.side], { kind: ahead.side, flavor: ahead.flavor });
      it.side = ahead.side; it.born = ahead.t - XE / F.V; it.state = "line"; items.push(it); ahead = null;
    }
  }

  /* a ring around a partner that was found */
  function ring(p, now) {
    const el = k.node(L.air, `<circle class="halo" r="22" cy="${k.f(-top(p))}"/>`, `transform="translate(${k.f(p.pos[0])} ${k.f(p.pos[1])})"`);
    later(now + 0.75, () => el.remove());
  }
  /* a pair card leaves from the partner on the rack and lands on the card line; cards land one after another */
  function pair(p, flavor, t) {
    const start = Math.max(t, lastLand + 0.7 - 0.6); lastLand = start + 0.6;
    const from = [p.pos[0], p.pos[1] - 2 * top(p)];
    later(start, (now) => {
      const c = F.card(L.air, { pair: flavor }); c.el.style.display = "none"; counts.pairs++;
      F.fly(c.el, from, P(LAND, YM, F.TOP), now, 0.6, { arc: 40, scale: [0.5, 1], it: c, done: () => { c.t0 = now + 0.6; cards.push(c); } });
    });
  }
  /* the worker has a thing in hand: find its partners */
  function match(it, now) {
    if (sc.latest && it.side === "cup") {            // a new cup only takes the place of the old one
      const i = F.FLAVORS.indexOf(it.flavor), old = racks.cup[i];
      if (old) { racks.cup[i] = null; L.air.appendChild(old.el); F.drop(old, old.pos, oldBin, now); counts.replaced++; }
      return;
    }
    const found = sc.latest ? [racks.cup[F.FLAVORS.indexOf(it.flavor)]].filter(Boolean)
      : racks[other(it.side)].filter((p) => p && p.state === "rack" && p.flavor === it.flavor && !p.grey);
    found.forEach((p, j) => { ring(p, now); pair(p, it.flavor, now + 0.12 + j * 0.1); });
  }
  /* then put it where it belongs */
  function store(it, now) {
    it.el.classList.remove("busy");
    if (sc.latest && it.side === "candy") { F.drop(it, who.held, hopper, now); return; }
    const i = sc.latest ? F.FLAVORS.indexOf(it.flavor) : racks[it.side].indexOf(null);
    racks[it.side][i] = it; it.t0 = now;
    F.fly(it.el, who.held, place(it.side, i), now, 0.36, { arc: 16, it, done: () => {
      it.el.classList.remove("air"); it.state = "rack";
      racks[it.side].forEach((p) => { if (p && p.state === "rack") L[it.side].appendChild(p.el); });     // nearer places are drawn over farther ones
    } });
  }
  function take(it, now) {
    it.state = "hand"; cur.it = it; it.el.style.opacity = 1; it.el.classList.add("air"); L.air.appendChild(it.el);
    F.fly(it.el, P(XE, laneY(it.side), F.TOP), who.held, now, 0.28, { arc: 8, it });
    if (!sc.latest && !racks[it.side].includes(null)) { later(now + 0.32, (t) => { halt = t; banner.style.display = ""; }); return; }     // nowhere to put it
    later(now + 0.3, () => it.el.classList.add("busy"));
    later(now + 0.44, (t) => match(it, t));
    later(now + 0.84, (t) => store(it, t));
    later(now + 1.04, () => { if (cur.it === it) cur.it = null; });
  }
  /* things on the racks grow older; past five seconds they turn grey and are cleared away */
  function age(now) {
    ["cup", "candy"].forEach((side) => racks[side].forEach((p, i) => {
      if (!p || p.state !== "rack") return;
      const a = now - p.t0, text = Math.min(FRESH, Math.floor(a)) + "s", grey = a >= FRESH;
      if (text !== p.flag || grey !== !!p.grey) { p.flag = text; p.grey = p.warn = grey; F.redraw(p); }
      if (a >= FRESH + 0.5) p.el.style.opacity = Math.max(0, (FRESH + 0.9 - a) / 0.4);
      if (a >= FRESH + 0.9) { p.el.remove(); racks[side][i] = null; counts.cleared++; }
    }));
  }
  function tickTwo(dt, now) {
    spawn(now);
    items.forEach((it) => {
      const x = F.V * (now - it.born);
      if (x >= XE) { take(it, now); return; }
      F.put(it, P(x, laneY(it.side), F.TOP)); fadeIn(it, x);
    });
    items = items.filter((it) => it.state === "line");
    if (sc.fresh) age(now);
    cards = cards.filter((c) => {
      const x = LAND + F.V * (now - c.t0);
      if (x >= OUT1) { F.drop(c, P(OUT1, YM, F.TOP), ship, now); return false; }
      F.put(c, P(x, YM, F.TOP)); return true;
    });
  }

  function init(kit, scene) {
    k = kit; F = Factory(kit); P = kit.P; U = kit.U; PAL = kit.PAL; sc = scene; rnd = kit.rng(31); F.reset();
    items = []; cards = []; todo = []; cur = { it: null }; hot = null; halt = null; banner = null;
    counts = { named: 0, pairs: 0, cleared: 0, replaced: 0 };
    if (sc.two) initTwo(); else initLookup();
    hands = F.clockHands(L.clock, CLOCK);
    k.focus([246, 24, 908, 760]);
    tick(0, 0);
  }

  function tick(dt, now) {
    if (halt != null) {                              // the racks are full: everything stands still, then the story starts again
      if (now - halt > 3.6) { k.restart(); return; }
      who.pose(now, dt, cur.it && cur.it.pos ? F.grip([cur.it.pos[0], cur.it.pos[1] - top(cur.it)], 9) : [null, null]); hands(now);
      return;
    }
    if (sc.two) tickTwo(dt, now); else tickLookup(dt, now);
    due(now);
    F.run(now);
    who.pose(now, dt, cur.it && cur.it.pos ? F.grip([cur.it.pos[0], cur.it.pos[1] - top(cur.it)], 9) : [null, null]);
    belts.forEach((b) => b.update(now)); hands(now);
  }

  function status() {
    const n = (v, one, many) => `${v} ${v === 1 ? one : many}`;
    if (!sc.two) return `${n(counts.named, "candy", "candies")} named`;
    const pairs = n(counts.pairs, "pair", "pairs");
    if (sc.latest) return `${pairs} · ${n(counts.replaced, "cup", "cups")} replaced`;
    if (sc.fresh) return `${pairs} · ${counts.cleared} cleared away`;
    const kept = racks.cup.filter(Boolean).length + racks.candy.filter(Boolean).length;
    return halt != null ? `${pairs} · the racks are full` : `${pairs} · ${kept} of ${2 * SIZE} places taken`;
  }

  Story.start({ scenes: SCENES, init, tick, status });
})();

</script>
