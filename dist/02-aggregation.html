<style>
/* Proton Stream Lab, simple layout: one stage, input left, operator middle, output right. */
/* Timeplus look: Inter, purple-tinted greys, Timeplus pink as the accent (from timeplus-io/docs custom.css). */
:root {
  --bg: #F7F6F6; --panel: #FFFFFF; --panel-2: #ECECED; --line: #DAD9DB;
  --fg: #120F1A; --muted: #514E58; --accent: #D53C97; --on-accent: #FFFFFF;
  --wm: #97732D; --late: #8E8C94; --glow: rgba(213, 60, 151, 0.22); --ok: #1E7A63; --danger: #D12D50; --on-key: #FFFFFF;
  --k-a: #BF5815; --k-b: #077D95; --k-c: #8934D9; --k-d: #0B66BC;
  --font-display: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #110F14; --panel: #19171D; --panel-2: #231F2B; --line: #3A3741; --fg: #F7F6F6; --muted: #AEACB0;
    --accent: #ED64A6; --on-accent: #110F14; --wm: #D9B25C; --late: #5C5964; --glow: rgba(237, 100, 166, 0.28); --ok: #4EC9B0; --danger: #FF6780;
    --k-a: #C8641F; --k-b: #0B8AA3; --k-c: #9147E0; --k-d: #2A7AD0; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #110F14; --panel: #19171D; --panel-2: #231F2B; --line: #3A3741; --fg: #F7F6F6; --muted: #AEACB0;
  --accent: #ED64A6; --on-accent: #110F14; --wm: #D9B25C; --late: #5C5964; --glow: rgba(237, 100, 166, 0.28); --ok: #4EC9B0; --danger: #FF6780;
  --k-a: #C8641F; --k-b: #0B8AA3; --k-c: #9147E0; --k-d: #2A7AD0; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.page {
  max-width: 1240px; margin: 0 auto; padding-block: 28px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 18px;
}
header { display: grid; gap: 6px; }
.eyebrow { font: 600 12px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
h1 { font: 700 clamp(26px, 4vw, 36px)/1.1 var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.lede { margin: 0; color: var(--muted); max-width: 70ch; }

.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
.seg button { all: unset; cursor: pointer; font: 600 14px var(--font-body); padding: 8px 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.seg button:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn { font: 600 14px var(--font-body); color: var(--on-accent); background: var(--accent); border: 0; border-radius: 10px; padding: 8px 16px; cursor: pointer; min-width: 90px; }
.btn.ghost { background: var(--panel); color: var(--fg); border: 1px solid var(--line); min-width: 0; }
.spacer { flex: 1; }

.stage { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.stage-scroll { overflow-x: auto; }
#stage { display: block; width: 100%; min-width: 760px; height: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; font-size: 13px; color: var(--muted); }
.legend:empty { display: none; }
.lg-item { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); }
.lg-sw { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
.caption { display: grid; gap: 8px; }
.sql { margin: 0; font: 14px/1.5 var(--font-mono); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; overflow-x: auto; white-space: pre; }
.sql .kw { color: var(--accent); font-weight: 600; }
.note { margin: 0; color: var(--muted); max-width: 80ch; }
footer { color: var(--muted); font-size: 13px; display: flex; justify-content: space-between; gap: 16px; }
footer a { color: var(--fg); }
footer .here { font-weight: 700; color: var(--fg); }

/* stage drawing */
.sl .fade-stop-0 { stop-color: var(--panel); stop-opacity: 1; }
.sl .fade-stop-1 { stop-color: var(--panel); stop-opacity: 0; }
.sl .op { fill: var(--panel-2); stroke: var(--line); stroke-width: 1.5; transition: stroke .25s; }
.sl .op.busy { stroke: var(--accent); }
.sl .op.failed { stroke: var(--danger); }
.sl .op-rule.failed { fill: var(--danger); }
.sl .op-rule { font: 600 13px var(--font-mono); fill: var(--fg); text-anchor: middle; }
.sl .clock { font: 600 15px var(--font-mono); fill: var(--accent); text-anchor: middle; font-variant-numeric: tabular-nums; }
.sl .card text { fill: var(--on-key); font-variant-numeric: tabular-nums; }
.sl .card .c-id { font: 600 11px var(--font-body); opacity: .92; }
.sl .card .c-val { font: 700 19px var(--font-body); letter-spacing: -0.01em; }
.sl .card .c-time { font: 11px var(--font-mono); opacity: .92; }
.sl .card .c-note { font: 600 11px var(--font-body); fill: var(--wm); }
.sl .card.dropped .body { fill: var(--late) !important; }
.sl .card .c-flash { fill: none; stroke: var(--accent); stroke-width: 2.5; opacity: 0; }
.sl .axis-line { stroke: var(--line); stroke-width: 1; }
.sl .axis .tk line { stroke: var(--line); stroke-width: 1; }
.sl .axis .tk text { font: 10.5px var(--font-mono); fill: var(--muted); text-anchor: middle; font-variant-numeric: tabular-nums; }
.sl .now-mark { fill: var(--accent); }
.note code { font: 13px var(--font-mono); background: var(--panel-2); padding: 1px 5px; border-radius: 4px; color: var(--fg); }
.lg-sw.state { background: none; border: 2px solid var(--muted); }
.lg-sw.round { background: var(--muted); border-radius: 5px; }
.lg-sw.square { background: var(--muted); border-radius: 1px; }
.sl .state rect.body { fill: var(--panel); stroke-width: 2; }
.sl .tbox rect.body { fill: var(--panel); stroke: var(--muted); stroke-width: 2; }
.sl .lane { font: 600 11px var(--font-body); fill: var(--muted); }
.sl .tbox .t-title { font: 600 11px var(--font-body); fill: var(--muted); }
.sl .chip rect { stroke-width: 0; }
.sl .chip text.age { font-weight: 700; }
.sl .chip text { font: 600 10px var(--font-mono); fill: var(--on-key); text-anchor: middle; font-variant-numeric: tabular-nums; }
.sl .state .c-flash { fill: none; stroke: var(--accent); stroke-width: 2.5; opacity: 0; }
.sl .state .s-title { font: 600 11px var(--font-body); }
.sl .state .s-l { font: 11px var(--font-mono); fill: var(--muted); font-variant-numeric: tabular-nums; }
.sl .state .s-r { font: 700 15px var(--font-body); fill: var(--fg); font-variant-numeric: tabular-nums; }
.sl .axis .tk .wline { stroke: var(--line); stroke-width: 1; }
.sl .wm line { stroke: var(--wm); stroke-width: 2; stroke-dasharray: 6 4; }
.sl .wm text { font: 600 11px var(--font-mono); fill: var(--wm); text-anchor: middle; font-variant-numeric: tabular-nums; }

</style>

<body>
<div class="page">
  <header>
    <div class="eyebrow">Proton Stream Lab · 02</div>
    <h1>Streaming aggregation</h1>
  </header>
  <div class="bar">
    <div class="seg" id="modes" role="group" aria-label="Operation"></div>
    <div class="legend" id="legend"></div>
    <span class="spacer"></span>
    <button class="btn" id="play" type="button">Pause</button>
  </div>
  <div class="stage">
    <div class="stage-scroll"><svg id="stage" class="sl" viewBox="0 0 1200 262" role="img" aria-label="Animated stream"></svg></div>
  </div>
  <div class="caption">
    <pre class="sql" id="sql"></pre>
    <p class="note" id="note"></p>
  </div>
  <footer><a href="01-transform.html">← 01 Stateless transform</a><a href="03-join.html">03 Streaming join →</a></footer>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
/* Proton Stream Lab, simple runtime (needs d3 v7).
   A continuous simulation: an episode supplies modes, init(mode) and tick(dt, now).
   The loop runs until the viewer presses Pause. */
const Lab = (() => {
  const CARD = { w: 122, h: 74 };
  const BASE = 12 * 3600; // processing clock starts at 12:00:00
  const keyColor = (k) => `var(--k-${String(k).toLowerCase()})`;
  const hms = (t) => {   // truncated to tenths, so 59.97 s never prints as 60.0
    const d = Math.floor((BASE + t) * 10 + 1e-6);
    const h = Math.floor(d / 36000), m = Math.floor((d % 36000) / 600), sec = (d % 600) / 10;
    return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${sec.toFixed(1).padStart(4, "0")}`;
  };

  /* A data card: three lines, all of the event's data. Color = key.
     Rounded = main/left stream, square corners = right stream of a join,
     rounded left + square right = a joined record. */
  function card(layer, ev) {
    const { w, h } = CARD, x0 = -w / 2, y0 = -h / 2;
    const g = layer.append("g").attr("class", "card");
    const rx = ev.side === "R" ? 3 : 12;
    if (ev.side === "J") {
      const r = 12, q = 3;
      g.append("path").attr("class", "body").style("fill", keyColor(ev.key))
        .attr("d", `M${x0 + r},${y0} H${x0 + w - q} a${q},${q} 0 0 1 ${q},${q} V${y0 + h - q} a${q},${q} 0 0 1 ${-q},${q} H${x0 + r} a${r},${r} 0 0 1 ${-r},${-r} V${y0 + r} a${r},${r} 0 0 1 ${r},${-r} Z`);
    } else g.append("rect").attr("class", "body").attr("x", x0).attr("y", y0).attr("width", w).attr("height", h).attr("rx", rx).style("fill", keyColor(ev.key));
    g.append("rect").attr("class", "c-flash").attr("x", x0 - 3).attr("y", y0 - 3).attr("width", w + 6).attr("height", h + 6).attr("rx", rx + 2);
    g.append("text").attr("class", "c-id").attr("x", x0 + 12).attr("y", y0 + 20);
    g.append("text").attr("class", "c-val").attr("x", x0 + 12).attr("y", 9);
    g.append("text").attr("class", "c-time").attr("x", x0 + 12).attr("y", h / 2 - 10);
    if (ev.noteText) g.append("text").attr("class", "c-note").attr("x", x0 + 12).attr("y", h / 2 + 15).text(ev.noteText);   // a remark about the card, not part of its data
    fill(g, ev);
    return g;
  }
  function fill(g, ev) {
    const label = ev.keyLabel || ev.key;
    const title = ev.title ?? `#${ev.id} · ${label}`;
    const time = ev.timeText ?? hms(ev.et).slice(0, 8);
    g.select(".c-id").text(title);
    g.select(".c-val").text(ev.valText);
    g.select(".c-time").text(time);
    g.select("title").remove();
    g.append("title").text(`${title}, ${ev.valText}, ${time}`);
  }

  /* A state card: what an operator keeps in memory for one key. Same size as a data card, but hollow.
     rows = [{ l: label, r: number }], at most two. */
  function stateCard(layer, key, title) {
    const { w, h } = CARD, x0 = -w / 2, y0 = -h / 2;
    const g = layer.append("g").attr("class", "state");
    g.append("rect").attr("class", "body").attr("x", x0).attr("y", y0).attr("width", w).attr("height", h).attr("rx", 12).style("stroke", keyColor(key));
    g.append("rect").attr("class", "c-flash").attr("x", x0 - 3).attr("y", y0 - 3).attr("width", w + 6).attr("height", h + 6).attr("rx", 14);
    g.append("text").attr("class", "s-title").attr("x", x0 + 12).attr("y", y0 + 20).style("fill", keyColor(key)).text(title);
    [0, 1].forEach((i) => {
      g.append("text").attr("class", `s-l s-l${i}`).attr("x", x0 + 12);
      g.append("text").attr("class", `s-r s-r${i}`).attr("x", w / 2 - 12).attr("text-anchor", "end");
    });
    return g;
  }
  function setState(g, rows) {
    const ys = rows.length > 1 ? [5, 25] : [14];
    [0, 1].forEach((i) => {
      const r = rows[i];
      g.select(`.s-l${i}`).attr("y", ys[i] ?? 0).text(r ? r.l : "");
      g.select(`.s-r${i}`).attr("y", ys[i] ?? 0).text(r ? r.r : "");
    });
  }
  /* Flash a card's outline. On a state card, row = index of the number that just changed: it lights up briefly. */
  function flash(g, row) {
    g.select(".c-flash").interrupt().style("opacity", 1).transition().duration(700).style("opacity", 0);
    if (row != null) g.select(`.s-r${row}`).interrupt().style("fill", "var(--accent)").transition().delay(500).duration(0).style("fill", null);
  }

  /* Tint one number of a state card for a moment, e.g. gold when the watermark removed rows. */
  function mark(g, row, color) {
    g.select(`.s-r${row}`).interrupt().style("fill", color).transition().delay(600).duration(0).style("fill", null);
  }

  function sqlHtml(sql) {
    const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    return esc(sql).replace(/\b(SELECT|FROM|WHERE|GROUP BY|AS|EMIT|PERIODIC|ON UPDATE|AFTER WINDOW CLOSE|WITH DELAY|LATEST JOIN|JOIN|ON|AND)\b/g, '<span class="kw">$1</span>');
  }

  function start(ep) {
    const svg = d3.select("#stage");
    let mode = ep.modes[0], speed = 1, paused = false, now = 0, last = null;
    const playBtn = document.querySelector("#play");

    const lg = document.querySelector("#legend");
    if (lg && ep.legend) {
      lg.innerHTML = ep.legend.map((it) => `<span class="lg-item"><i class="lg-sw${it.cls ? " " + it.cls : ""}"${it.key ? ` style="background:${keyColor(it.key)}"` : ""}></i>${it.label}</span>`).join("")
        + (ep.legendNote ? `<span class="lg-note">${ep.legendNote}</span>` : "");
    }
    function load(m) {
      mode = m;
      document.querySelectorAll("#modes button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.id === m.id ? "true" : "false"));
      document.querySelector("#sql").innerHTML = sqlHtml(m.sql);
      document.querySelector("#note").innerHTML = m.note;
      svg.selectAll("*").interrupt().remove();
      now = 0;
      ep.init(svg, m);
    }
    const modes = document.querySelector("#modes");
    ep.modes.forEach((m) => {
      const b = document.createElement("button");
      b.type = "button"; b.dataset.id = m.id; b.textContent = m.label;
      b.addEventListener("click", () => load(m));
      modes.appendChild(b);
    });
    const setPaused = (p) => { paused = p; playBtn.textContent = p ? "Play" : "Pause"; };
    playBtn.addEventListener("click", () => setPaused(!paused));
    document.querySelectorAll("#speed button").forEach((b) => b.addEventListener("click", () => {
      speed = +b.dataset.s;
      document.querySelectorAll("#speed button").forEach((x) => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
    }));
    document.addEventListener("keydown", (e) => {
      if (e.code === "Space" && !e.target.closest("button,input,select")) { e.preventDefault(); setPaused(!paused); }
    });
    document.addEventListener("visibilitychange", () => { last = null; });

    load(ep.modes[0]);
    const sc = document.querySelector(".stage-scroll");
    if (sc) sc.scrollLeft = sc.scrollWidth * (ep.focus ?? 0.5) - sc.clientWidth / 2;   // on narrow screens, start centered on the operator
    d3.timer((t) => {
      if (last == null) { last = t; return; }
      const dt = Math.min(0.05, (t - last) / 1000) * speed;
      last = t;
      if (paused) return;
      now += dt;
      ep.tick(dt, now);
    });
    return { get now() { return now; } };
  }

  function rng(seed) {
    let a = seed >>> 0;
    return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  return { CARD, card, fill, flash, mark, stateCard, setState, hms, keyColor, start, rng };
})();

</script>
<script>
/* Episode 2: streaming aggregation. Same stage as episode 1, but the operator now keeps state.
   Input cards are routed to their key's row and absorbed into a hollow state card.
   Each output record comes out of its key's state card and stays on that key's row. */
(() => {
  const W = 1300, H = 404, V = 96;
  const { w: CW } = Lab.CARD;
  const KEYS = ["A", "B", "C"];
  const ROW = { A: 118, B: 202, C: 286 }, IN_Y = ROW.B;
  const OP = { x: 288, y: 50, w: 264, h: 286, cx: 420 };   // left of center: the output side needs room for the watermark
  const AXIS_Y = 358;
  const MIN_GAP = (CW + 14) / V;
  const AHEAD = (OP.cx + CW) / V;
  const TURN = 2.0;       // seconds before arrival when a card leaves the input line for its key's row
  const LAND = 1.0;       // seconds before arrival when it is on that row and starts to sink into the state card
  const REFUSED = 0.75;   // size of a late card when it is refused at the state card
  const SLOT = (CW + 8) / V;   // two records of one key emitted together leave one card apart
  const PERIOD = 2;       // EMIT PERIODIC interval in seconds
  const GROW = 1.0;       // seconds an output takes to grow out of its state card
  const WIN = 5;          // window size in seconds
  const t8 = (t) => Lab.hms(t).slice(0, 8);
  const span = (ws) => `${t8(ws)}–:${t8(ws + WIN).slice(6)}`;   // a window, as printed on state and output cards

  const TUMBLE = "SELECT window_start, device, count() FROM tumble(temps, 5s) GROUP BY window_start, device";
  const modes = [
    {
      id: "global", label: "Global", agg: "global", emit: "periodic", rule: "count() by device",
      sql: "SELECT device, count() FROM temps GROUP BY device EMIT PERIODIC 2s",
      note: "Counting needs memory. The operator keeps one number per device in a hollow card: that is its <b>state</b>. Each event sinks into its device's card and adds 1. A stream never ends, so the count is never final. The operator reports it on a timer instead: every 2 seconds it emits the current count of every device, changed or not. This is the default for an aggregation without a window.",
    },
    {
      id: "update", label: "On update", agg: "global", emit: "update", rule: "count() by device",
      sql: "SELECT device, count() FROM temps GROUP BY device EMIT ON UPDATE",
      note: "The same state, a different trigger. There is no timer: a result is emitted the moment an event changes it, and only for the device that changed. One event in, one record out.",
    },
    {
      id: "tumble", label: "Tumble window", agg: "tumble", delay: 0, rule: "count() by device, 5s windows",
      sql: TUMBLE,
      note: "A window gives the count an end. Time is cut into 5-second windows (the thin vertical lines) and each window is counted on its own. The <b>watermark</b> (gold dashed line) shows how far the stream's time has advanced: it jumps to the start of a window when that window's first event arrives. The window before it is then complete: its counts are emitted once, one record per device, and its state is freed.",
    },
    {
      id: "late", label: "Late events", agg: "tumble", delay: 0, disorder: true, rule: "count() by device, 5s windows",
      sql: TUMBLE,
      note: "Events do not always arrive on time. Here some cards are late, and the label under the card says by how much: the time printed on it is older than the clock. A late event still counts if its time is not behind the watermark (gold dashed line). If it is behind the watermark, its window has already been emitted, so the event turns grey and is dropped.",
    },
    {
      id: "delay", label: "With delay", agg: "tumble", delay: 2, disorder: true, rule: "5s windows, delay 2s",
      sql: TUMBLE + " EMIT AFTER WINDOW CLOSE WITH DELAY 2s",
      note: "The same stream as the previous tab, with more patience. The watermark now stays 2 seconds behind the newest event, so a window stays open a little longer and fewer late events are dropped. The price: every result comes out 2 seconds later.",
    },
  ];

  let L, mode, rnd, seq, nextAt, nextTick, gen, wm, lastArrive, outFree, recent;
  let inputs, outs, drops, state, clockTxt, opBox, wmG;
  const windowed = () => mode.agg === "tumble";

  function newEvent(at) {
    const key = KEYS[Math.floor(rnd() * 3)];
    let c = 26 + Math.floor(rnd() * 13);
    while (recent.includes(c)) c = 26 + ((c - 26 + 3) % 13);   // cards on screen together never share a value
    recent.push(c); if (recent.length > 6) recent.shift();
    let et = at;
    if (mode.disorder) {                 // some events take a while to arrive: most of those 1 to 2 seconds, a few much longer
      const a = rnd(), b = rnd();
      if (a < 0.33) et = at - (1 + b * 1.2); else if (a < 0.39) et = at - (4 + b * 1.5);
    }
    const ev = { id: ++seq, key, keyLabel: `device ${key}`, val: c, valText: `${c} °C`, at, et };
    const behind = Math.floor(at) - Math.floor(et);   // the clock at arrival minus the time printed on the card
    if (behind > 0) ev.noteText = `${behind}s late`;
    if (windowed()) {
      // Watermark rule from WatermarkStamper::calculateWatermark: start of the window holding (max event time - delay).
      ev.late = gen.wm != null && et < gen.wm;
      if (!ev.late) {
        gen.maxEt = Math.max(gen.maxEt, et);
        const w = Math.floor((gen.maxEt - mode.delay) / WIN) * WIN;
        if (gen.wm == null || w > gen.wm) gen.wm = w;
      }
      ev.wm = gen.wm;
    }
    return ev;
  }

  function init(svg, m) {
    mode = m; rnd = Lab.rng(m.disorder ? 123 : 42); seq = 0; recent = [];
    inputs = []; outs = []; drops = []; state = new Map();
    gen = { maxEt: -Infinity, wm: null }; wm = null; lastArrive = -9; outFree = {};
    svg.attr("viewBox", `0 0 ${W} ${H}`);
    L = {
      bg: svg.append("g"), axis: svg.append("g").attr("class", "axis"), box: svg.append("g"), wm: svg.append("g"),
      out: svg.append("g"), state: svg.append("g"), in: svg.append("g"), top: svg.append("g"),
    };
    clockTxt = L.bg.append("text").attr("class", "clock").attr("x", OP.cx).attr("y", 34);

    const defs = svg.append("defs");
    [["fadeL", 0, 1], ["fadeR", 1, 0]].forEach(([id, a, b]) => {
      const gr = defs.append("linearGradient").attr("id", id);
      gr.append("stop").attr("offset", 0).attr("class", `fade-stop-${a}`);
      gr.append("stop").attr("offset", 1).attr("class", `fade-stop-${b}`);
    });
    L.top.append("rect").attr("x", 0).attr("y", OP.y).attr("width", 70).attr("height", H - OP.y).attr("fill", "url(#fadeL)");
    L.top.append("rect").attr("x", W - 70).attr("y", OP.y).attr("width", 70).attr("height", H - OP.y).attr("fill", "url(#fadeR)");

    L.bg.append("line").attr("class", "axis-line").attr("x1", 0).attr("x2", W).attr("y1", AXIS_Y).attr("y2", AXIS_Y);
    L.top.append("path").attr("class", "now-mark").attr("d", `M${OP.cx},${AXIS_Y - 1} l-6,-9 h12 z`);

    opBox = L.box.append("rect").attr("class", "op").attr("x", OP.x).attr("y", OP.y).attr("width", OP.w).attr("height", OP.h).attr("rx", 16);
    L.box.append("text").attr("class", "op-rule").attr("x", OP.cx).attr("y", OP.y + 22).text(m.rule);

    wmG = L.wm.append("g").attr("class", "wm").style("display", "none");
    wmG.append("line").attr("y1", OP.y).attr("y2", AXIS_Y);
    wmG.append("text").attr("y", AXIS_Y + 36);

    // warm up, so the first frame already shows state and output
    nextAt = -16; nextTick = -16;
    for (let t = -16; t < 0; t += 0.1) step(t);
    step(0); render(0);
  }

  /* ----- operator logic ----- */
  function ensureState(key) {
    if (!state.has(key)) {
      const g = Lab.stateCard(L.state, key, `device ${key}`).attr("transform", `translate(${OP.cx},${ROW[key]})`);
      g.style("opacity", 0).transition().duration(250).style("opacity", 1);
      state.set(key, { g, count: 0, wins: new Map() });
    }
    return state.get(key);
  }
  function showState(s) {
    if (windowed()) Lab.setState(s.g, [...s.wins.keys()].sort((a, b) => a - b).map((ws) => ({ l: span(ws), r: s.wins.get(ws) })));
    else Lab.setState(s.g, [{ l: "count", r: s.count }]);
  }
  /* Output: one card per record, like the rows of the SQL result. A record grows out of its key's state card
     and stays on that row, so the output shows three lines, one per device, each card at its emit time.
     Only if two records of the same key are emitted at the same moment does the second wait a card's width.
     rows = [{ key, count, timeText }], all emitted at processing time T. */
  function emit(rows, T) {
    rows.forEach((r) => {
      const at = Math.max(T, outFree[r.key] ?? -Infinity);
      outFree[r.key] = at + SLOT;
      const g = Lab.card(L.out, { key: r.key, title: `device ${r.key}`, valText: `count ${r.count}`, timeText: r.timeText }).style("display", "none");
      outs.push({ g, T: at, y: ROW[r.key] });
    });
  }

  function arrive(c) {
    const ev = c.ev;
    lastArrive = ev.at;
    if (ev.late) {                       // behind the watermark: its window is gone, so it is refused and never changes the state
      L.top.node().appendChild(c.g.node());
      c.g.classed("dropped", true);
      drops.push({ g: c.g, at: ev.at, y: ROW[ev.key] });
      return;
    }
    c.g.remove();
    const s = ensureState(ev.key);
    if (!windowed()) {
      s.count++;
      showState(s); Lab.flash(s.g, 0);
      if (mode.emit === "update") emit([{ key: ev.key, count: s.count, timeText: t8(ev.at) }], ev.at);
      return;
    }
    const ws = Math.floor(ev.et / WIN) * WIN;
    s.wins.set(ws, (s.wins.get(ws) || 0) + 1);
    showState(s); Lab.flash(s.g, [...s.wins.keys()].sort((a, b) => a - b).indexOf(ws));
    if (wm == null || ev.wm > wm) { wm = ev.wm; closeWindows(ev.at); }
  }

  /* A window is final once its end is at or before the watermark: emit it once, then free its state. */
  function closeWindows(T) {
    const closed = new Map();   // window start -> rows
    KEYS.forEach((key) => {
      const s = state.get(key);
      if (!s) return;
      [...s.wins.keys()].forEach((ws) => {
        if (ws + WIN > wm) return;
        if (!closed.has(ws)) closed.set(ws, []);
        closed.get(ws).push({ key, count: s.wins.get(ws) });
        s.wins.delete(ws);
      });
      if (s.wins.size) showState(s); else { s.g.remove(); state.delete(key); }
    });
    const rows = [...closed.keys()].sort((a, b) => a - b)
      .flatMap((ws) => closed.get(ws).map((r) => ({ ...r, timeText: span(ws) })));
    if (rows.length) emit(rows, T);
  }

  function step(now) {
    while (nextAt < now + AHEAD) {
      const ev = newEvent(nextAt);
      inputs.push({ ev, g: Lab.card(L.in, ev) });
      // uneven arrivals; the disorder tabs keep the gaps shorter so the watermark has events to move on
      if (mode.disorder) nextAt += rnd() < 0.6 ? MIN_GAP + rnd() * 0.3 : 1.8 + rnd() * 1.0;
      else nextAt += rnd() < 0.55 ? MIN_GAP + rnd() * 0.25 : 1.7 + rnd() * 2.0;
    }
    for (;;) {   // everything due by now, in time order
      const te = inputs.length && inputs[0].ev.at <= now ? inputs[0].ev.at : Infinity;
      const tt = mode.emit === "periodic" && nextTick <= now ? nextTick : Infinity;
      if (te === Infinity && tt === Infinity) break;
      if (tt <= te) {
        const rows = KEYS.filter((k) => state.has(k)).map((k) => ({ key: k, count: state.get(k).count, timeText: t8(tt) }));
        if (rows.length) emit(rows, tt);
        nextTick += PERIOD;
      } else arrive(inputs.shift());
    }
    outs = outs.filter((o) => { const gone = OP.cx + V * (now - o.T) > W + CW; if (gone) o.g.remove(); return !gone; });
    drops = drops.filter((d) => { const gone = now - d.at > 1.3; if (gone) d.g.remove(); return !gone; });
  }

  function tick(dt, now) { step(now); render(now); }

  function render(now) {
    clockTxt.text(t8(now));
    opBox.classed("busy", now - lastArrive < 0.35);
    // Input: ride the input line, turn onto the key's row at the operator's edge, then land on the state card and sink into it.
    inputs.forEach((c) => {
      const dt = c.ev.at - now;
      let y = IN_Y, op = 1, sc = 1;
      if (dt < TURN) { const u = Math.min(1, (TURN - dt) / (TURN - LAND)); y = IN_Y + (ROW[c.ev.key] - IN_Y) * u * u * (3 - 2 * u); }
      if (dt < LAND) {
        const u = 1 - dt / LAND;
        if (c.ev.late) sc = 1 - (1 - REFUSED) * u * u;                       // a late card stays solid: it will be refused
        else { sc = 1 - 0.6 * u * u; op = Math.min(1, dt / 0.5); }
      }
      c.g.attr("transform", `translate(${OP.cx - V * dt},${y}) scale(${sc})`).style("opacity", op);
    });
    // Output, the mirror image: grow out of the key's state card and ride that key's row.
    outs.forEach((o) => {
      const a = now - o.T, u = Math.min(1, Math.max(0, a / GROW));
      o.g.attr("transform", `translate(${OP.cx + V * a},${o.y}) scale(${0.4 + 0.6 * u * (2 - u)})`).style("display", a < 0 ? "none" : null).style("opacity", Math.min(1, a / 0.3));
    });
    drops.forEach((d) => {
      const t = Math.max(0, now - d.at - 0.3);   // turn grey where it landed, then fall away
      d.g.attr("transform", `translate(${OP.cx},${d.y + 50 * t + 100 * t * t}) scale(${REFUSED})`).style("opacity", Math.max(0, 1 - t / 0.8));
    });
    // time axis; in windowed modes the window boundaries are drawn up through the stage
    const every = windowed() ? WIN : 2;
    const t0 = Math.ceil(now - (W - OP.cx) / V), t1 = Math.floor(now + OP.cx / V);
    const sel = L.axis.selectAll("g.tk").data(d3.range(t0, t1 + 1), (d) => d);
    const en = sel.enter().append("g").attr("class", "tk");
    en.append("line").attr("y1", 0).attr("y2", 6);
    en.each(function (d) {
      if (((d % every) + every) % every !== 0) return;
      const g = d3.select(this);
      g.append("text").attr("y", 19).text(t8(d));
      if (windowed()) g.append("line").attr("class", "wline").attr("y1", OP.y - AXIS_Y).attr("y2", 0);
    });
    sel.exit().remove();
    sel.merge(en).attr("transform", (d) => `translate(${OP.cx + V * (now - d)},${AXIS_Y})`);
    // watermark
    if (wm != null) {
      // the label stays readable near the right edge; past the edge the line is gone and the label points to it
      const x = OP.cx + V * (now - wm), off = x > W - 40;
      wmG.style("display", null);
      wmG.select("line").attr("x1", x).attr("x2", x).style("display", off ? "none" : null);
      wmG.select("text").attr("x", Math.min(x, W - 130)).text(`watermark ${t8(wm)}${off ? " →" : ""}`);
    }
  }

  const legend = [
    { key: "A", label: "device A" }, { key: "B", label: "device B" }, { key: "C", label: "device C" },
    { cls: "state", label: "hollow card = state" },
  ];
  window.addEventListener("DOMContentLoaded", () => Lab.start({ modes, init, tick, legend, focus: OP.cx / W }));
})();

</script>
</body>
</html>
