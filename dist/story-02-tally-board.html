<title>The Tally Board</title>

<meta name="description" content="A candy factory shows how a stream is counted: a tally board as memory, a card on a timer or on every change, time slots, late candies and waiting.">

<style>
/* Stream Stories: the same ideas as the Stream Lab, told as a small factory for readers who are not engineers.
   Layout: one sheet of cream paper lies on the page and holds the title, the clock time and the drawing; the buttons and the caption sit under it. */
:root {
  /* the page around the sheet follows the reader's theme */
  --page: #E8DFCE; --text: #2B2826; --muted: #6A6257; --rule: #8C8377; --panel: #FBF7EE; --accent: #C4604F; --on-accent: #FFFDF7; --pressed: #2B2826; --on-pressed: #FAF5EA;
  /* the sheet is paper: it looks the same in light and dark */
  --paper: #FAF5EA; --ink: #2B2826; --pencil: #6F675C; --lead: #8C8377; --sheet-accent: #C4604F;
  --font-title: "Young Serif", Georgia, "Times New Roman", serif;
  --font-hand: "Patrick Hand", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #1F1C19; --text: #F3ECDF; --muted: #B5AC9D; --rule: #8C8377; --panel: #2A2622; --accent: #E0806E; --on-accent: #1F1C19; --pressed: #F3ECDF; --on-pressed: #1F1C19; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #1F1C19; --text: #F3ECDF; --muted: #B5AC9D; --rule: #8C8377; --panel: #2A2622; --accent: #E0806E; --on-accent: #1F1C19; --pressed: #F3ECDF; --on-pressed: #1F1C19; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--page); color: var(--text); font-family: var(--font-hand); font-size: 19px; line-height: 1.35; }
.page {
  max-width: 1240px; margin: 0 auto; padding-block: 22px 34px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 12px;
}
.sheet { background: var(--paper); color: var(--ink); box-shadow: 3px 4px 0 rgba(60, 48, 36, 0.16); display: grid; gap: 0; padding: clamp(14px, 3vw, 34px) clamp(14px, 3vw, 38px) 12px; min-width: 0; }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 10px 28px; }

.sub { margin: 0; font-size: 21px; letter-spacing: .06em; }
.now { text-align: right; display: grid; gap: 0; justify-items: end; margin-left: auto; }
.now .time { font-size: 34px; letter-spacing: .08em; line-height: 1.05; font-variant-numeric: tabular-nums; }

.stage { position: relative; aspect-ratio: 1400 / 800; margin-inline: clamp(-38px, -3vw, -14px); }
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage .ink { fill: none; stroke: #3a3531; stroke-linecap: round; stroke-linejoin: round; }

.stage .slate-n.hot { fill: #f6dc7f; }
.stage .plus { font: 400 22px var(--font-hand); fill: #c4604f; }
.stage.compact .labels { display: none; }

.steps { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.steps .seg { display: flex; flex-wrap: wrap; gap: 8px; }
.steps button {
  font: inherit; font-size: 19px; letter-spacing: .05em; cursor: pointer; color: var(--text);
  background: var(--panel); border: 1.5px solid var(--rule); border-radius: 999px; padding: 5px 16px 6px;
}

.steps #play { background: var(--accent); color: var(--on-accent); border-color: var(--accent); min-width: 92px; }
.story { margin: 0; font-size: 23px; line-height: 1.35; max-width: 62ch; text-wrap: pretty; }
.foot { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px 20px; font-size: 17px; letter-spacing: .04em; color: var(--muted); }

.foot a { color: inherit; }

</style>

<body>
<div class="page">
  <div class="sheet">
    <div class="head">
      <header>
        <div class="eyebrow">Stream stories · 02</div>
        <h1>The tally board</h1>
        <p class="sub">count while it moves · one card at a time</p>

  </div>

  <div class="foot"><span class="links"><a href="story-01-candy-line.html">← 01 The candy line</a><a href="02-aggregation.html">For engineers: Streaming aggregation</a><a href="story-03-two-lines.html">03 The recipe sheet →</a></span></div>
</div>
<script>
/* Stream Stories, shared kit: one hand-drawn sheet in plain SVG, no libraries.
   Everything is drawn twice, the way a marker sketch is made: a soft wash of colour with paper tooth in it,
   then a thin ink line that bows a little and runs past its corners. The scene is isometric but flat:
   P(x, y, z) turns a place in the room into a point on the sheet. People are small paper dolls that face the reader.
   An episode supplies scenes, init(kit, scene) and tick(dt, now); the story runs until the reader presses Pause. */
const Story = (() => {
  const NS = "http://www.w3.org/2000/svg";
  const W = 1400, H = 800;
  const INK = "#3a3531";
  const PAL = {
    paper: "#faf5ea", floor: "#f1e7d2", wall: "#f6eedd", wood: "#dcbd90", woodDark: "#c19f72", base: "#c9aa7f",
    steel: "#c3c8c9", belt: "#8f8881", dark: "#4f4944", glass: "#bfd6d8", white: "#fefbf3",
    a: "#e59a62", b: "#72bbb0", c: "#ac92d6", red: "#d67c6c", yellow: "#ecc96e", blue: "#86a3c6", green: "#9dbb88", pink: "#efb9b3",
    skin: ["#f3ceac", "#dca97f", "#b07a57"], hair: ["#3f332d", "#7d4d2e", "#a59e95"],
  };
  const BASE = 12 * 3600;
  const hms = (t) => {
    const d = Math.floor(BASE + t + 1e-6);
    return [Math.floor(d / 3600), Math.floor((d % 3600) / 60), d % 60].map((n) => String(n).padStart(2, "0")).join(":");
  };
  function rng(seed) {
    let a = seed >>> 0;
    return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  let rand = rng(1);
  const f = (n) => Math.round(n * 10) / 10;
  function mix(a, b, t) {
    const p = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16)), A = p(a), B = p(b);
    return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, "0")).join("");
  }
  const lighter = (c, t = 0.4) => mix(c, "#fffaf0", t), darker = (c, t = 0.2) => mix(c, "#7a6753", t);

  /* ----- the isometric room: x runs down and right, y down and left, z up ----- */
  const CS = Math.cos(Math.PI / 6), SN = 0.5, U = 52, OX = 551, OY = 236;
  const P = (x, y, z = 0) => [OX + (x - y) * CS * U, OY + (x + y) * SN * U - z * U];

  /* ----- ink: every straight edge is ruled by hand, so it bows a little and overshoots ----- */
  function stroke(a, b, o = {}) {
    const over = o.over ?? 2.4, amp = o.amp ?? 0.9, dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
    const o1 = over * rand(), o2 = over * rand(), bow = (rand() - 0.5) * 2 * amp * Math.min(1, L / 70);
    const A = [a[0] - ux * o1, a[1] - uy * o1], B = [b[0] + ux * o2, b[1] + uy * o2];
    return `M${f(A[0])} ${f(A[1])}Q${f((A[0] + B[0]) / 2 - uy * bow)} ${f((A[1] + B[1]) / 2 + ux * bow)} ${f(B[0])} ${f(B[1])}`;
  }
  const attr = (o) => ` stroke-width="${o.w ?? 1.25}"${o.col ? ` style="stroke:${o.col}"` : ""}${o.op ? ` opacity="${o.op}"` : ""}`;
  const edges = (pairs, o = {}) => `<path class="ink" d="${pairs.map(([a, b]) => stroke(a, b, o)).join("")}"${attr(o)}/>`;
  const loop = (pts, o) => edges(pts.map((p, i) => [p, pts[(i + 1) % pts.length]]), o);
  /* a smooth line through points, for round things and leader lines */
  function curve(pts, closed = false) {
    const n = pts.length, g = (i) => (closed ? pts[(i + n) % n] : pts[Math.max(0, Math.min(n - 1, i))]);
    let d = `M${f(pts[0][0])} ${f(pts[0][1])}`;
    for (let i = 0; i < (closed ? n : n - 1); i++) {
      const p0 = g(i - 1), p1 = g(i), p2 = g(i + 1), p3 = g(i + 2);
      d += `C${f(p1[0] + (p2[0] - p0[0]) / 6)} ${f(p1[1] + (p2[1] - p0[1]) / 6)} ${f(p2[0] - (p3[0] - p1[0]) / 6)} ${f(p2[1] - (p3[1] - p1[1]) / 6)} ${f(p2[0])} ${f(p2[1])}`;
    }
    return d + (closed ? "Z" : "");
  }
  /* ----- wash: flat colour laid a touch off the line, with the paper showing through ----- */
  const tooth = (d) => `<path d="${d}" fill="url(#tooth)"/>`;
  function wash(pts, col, o = {}) {
    const j = o.j ?? 0.9, dx = (rand() - 0.5) * 1.4, dy = (rand() - 0.5) * 1.4;
    const d = "M" + pts.map((p) => f(p[0] + dx + (rand() - 0.5) * j) + " " + f(p[1] + dy + (rand() - 0.5) * j)).join("L") + "Z";
    return `<path d="${d}" fill="${col}"/>` + tooth(d);
  }
  /* a shape given as path data: washed, then inked */
  const shape = (d, col, w = 1.4) => `<path d="${d}" fill="${col}"/>${tooth(d)}<path class="ink" d="${d}" stroke-width="${w}"/>`;
  const dot = (x, y, r, col, w = 1.2) => `<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="${col}"${w ? ` class="ink-f" stroke-width="${w}"` : ""}/>`;
  const shadow = (pts, op = 0.13) => `<path d="M${pts.map((p) => f(p[0]) + " " + f(p[1])).join("L")}Z" fill="#5c5247" opacity="${op}"/>`;

  /* ----- solids ----- */
  /* A box standing at (x, y, z), w along x, d along y, h high. col is the face that looks down and right. */
  function box(x, y, z, w, d, h, col, o = {}) {
    const t = [P(x, y, z + h), P(x + w, y, z + h), P(x + w, y + d, z + h), P(x, y + d, z + h)], b1 = P(x + w, y, z), b2 = P(x + w, y + d, z), b3 = P(x, y + d, z);
    return wash(t, o.top ?? lighter(col)) + wash([t[1], t[2], b2, b1], col) + wash([t[3], t[2], b2, b3], o.side ?? darker(col))
      + edges([[t[0], t[1]], [t[1], t[2]], [t[2], t[3]], [t[3], t[0]], [t[1], b1], [t[2], b2], [t[3], b3], [b1, b2], [b2, b3]], { w: o.w });
  }
  /* An open box you can drop things into. under goes behind what falls in, over goes in front of it. */
  function crate(x, y, z, w, d, h, col) {
    const T = (px, py) => P(px, py, z + h), B = (px, py) => P(px, py, z), in1 = darker(col, 0.45), in2 = darker(col, 0.6);
    const under = wash([B(x, y), B(x + w, y), B(x + w, y + d), B(x, y + d)], darker(col, 0.75)) + wash([T(x, y), T(x, y + d), B(x, y + d), B(x, y)], in1) + wash([T(x, y), T(x + w, y), B(x + w, y), B(x, y)], in2)
      + edges([[T(x, y), T(x + w, y)], [T(x, y), T(x, y + d)], [T(x, y), B(x, y)]], { w: 1.1 });
    const over = wash([T(x + w, y), T(x + w, y + d), B(x + w, y + d), B(x + w, y)], col) + wash([T(x, y + d), T(x + w, y + d), B(x + w, y + d), B(x, y + d)], darker(col))
      + edges([[T(x + w, y), T(x + w, y + d)], [T(x + w, y + d), T(x, y + d)], [T(x + w, y), B(x + w, y)], [T(x + w, y + d), B(x + w, y + d)], [T(x, y + d), B(x, y + d)], [B(x + w, y), B(x + w, y + d)], [B(x + w, y + d), B(x, y + d)]]);
    return { under, over };
  }
  /* An upright cylinder: a can, a jar, a roll. */
  function cyl(x, y, z, r, h, col, o = {}) {
    const c0 = P(x, y, z), c1 = P(x, y, z + h), rx = f(Math.SQRT2 * CS * r * U), ry = f(Math.SQRT2 * SN * r * U);
    const body = `M${f(c1[0] - rx)} ${f(c1[1])}L${f(c0[0] - rx)} ${f(c0[1])}A${rx} ${ry} 0 0 0 ${f(c0[0] + rx)} ${f(c0[1])}L${f(c1[0] + rx)} ${f(c1[1])}A${rx} ${ry} 0 0 1 ${f(c1[0] - rx)} ${f(c1[1])}Z`;
    const top = `M${f(c1[0] - rx)} ${f(c1[1])}A${rx} ${ry} 0 1 0 ${f(c1[0] + rx)} ${f(c1[1])}A${rx} ${ry} 0 1 0 ${f(c1[0] - rx)} ${f(c1[1])}Z`;
    return shape(body, col, o.w ?? 1.2) + shape(top, o.top ?? lighter(col), o.w ?? 1.2);
  }

  /* ----- people: flat paper dolls, feet at (0, 0), about 86 tall with the hat. The hips are at y = -12, the neck at y = -46. ----- */
  function doll(o = {}) {
    const look = o.look ?? 0, skin = PAL.skin[look], hair = PAL.hair[look], coat = o.coat ?? PAL.blue;
    let h = `<ellipse cx="0" cy="1.5" rx="20" ry="6.5" fill="#8097b8" opacity=".5"/>`;
    [-1, 1].forEach((s) => {
      h += shape(`M${s * 6 - 3.2} -13L${s * 6 - 3.2} -3L${s * 6 + 3.2} -3L${s * 6 + 3.2} -13Z`, "#66738c", 1.2);
      h += shape(`M${s * 6 - 4.4} -3.4Q${s * 6 - 5} 0.8 ${s * 6} 0.8Q${s * 6 + 5} 0.8 ${s * 6 + 4.4} -3.4Z`, "#9a6b4c", 1.2);
    });
    h += `<g class="top">`;          // everything above the hips, so that a worker can bend at the waist
    h += shape("M-8.5 -45C-13.5 -45 -15 -40 -16 -34L-20 -15C-21.5 -9 -17 -8.5 -12 -8.5L12 -8.5C17 -8.5 21.5 -9 20 -15L16 -34C15 -40 13.5 -45 8.5 -45Z", coat, 1.5);
    if (o.apron !== false) h += shape("M-6.5 -39L6.5 -39L10.5 -11.5L-10.5 -11.5Z", PAL.white, 1.1);
    h += `<g class="head">`;         // the head can tilt, and the eyes can look at the work
    h += shape("M-13.6 -57A13.6 13.6 0 1 0 13.6 -57A13.6 13.6 0 1 0 -13.6 -57Z", skin, 1.5);
    h += `<path d="M-13.4 -59C-14 -66 -8 -70.5 0 -70.5C8 -70.5 14 -66 13.4 -59C9 -62.5 4 -63.5 0 -63.5C-4 -63.5 -9 -62.5 -13.4 -59Z" fill="${hair}"/>`;
    h += `<g class="eyes">${dot(-5, -55.5, 1.7, INK, 0) + dot(5, -55.5, 1.7, INK, 0)}</g>`;
    h += `<circle cx="-8.6" cy="-51.4" r="3.1" fill="#ee9f97" opacity=".6"/><circle cx="8.6" cy="-51.4" r="3.1" fill="#ee9f97" opacity=".6"/>`;
    h += `<path class="ink" d="M-3 -50.2Q0 -47.6 3 -50.2" stroke-width="1.2"/>`;
    if (o.hat !== false) {
      h += shape("M-10.5 -67C-17.5 -70 -16 -82.5 -6.5 -80.5C-4 -87 6 -87 8 -80.5C16.5 -82.5 17.5 -70 10.5 -67Z", PAL.white, 1.4);
      h += shape("M-11 -70L11 -70L11 -64.5L-11 -64.5Z", PAL.white, 1.2);
    }
    return h + "</g></g>";
  }
  /* One arm, hanging from (0, 0). The episode turns it about the shoulder. tool: "paddle" for a small wooden pusher. */
  function arm(o = {}) {
    let h = "";
    if (o.tool === "paddle") h += `<path class="ink" d="M0 22L0 41" stroke-width="2.2" style="stroke:#8a6a48"/>` + shape("M-6.5 38L6.5 38L6.5 48L-6.5 48Z", PAL.wood, 1.2);
    h += shape("M-3.8 0L-3.8 20A3.8 3.8 0 0 0 3.8 20L3.8 0A3.8 3.8 0 0 0 -3.8 0Z", o.coat ?? PAL.blue, 1.3);
    return h + dot(0, 23, 4.1, PAL.skin[o.look ?? 0], 1.2);
  }
  const SHOULDER = [[-13, -39], [13, -39]];   // where the arms hang from, before the doll is scaled

  /* ----- the sheet ----- */
  let stageEl, back, live, labelLayer = null, labels = [], tight = null;
  /* Paper tooth: a small tile of soft noise, made once. Some patches dry lighter and some pool darker, as marker does on paper. */
  function toothTile() {
    const n = 256, c = document.createElement("canvas"); c.width = c.height = n;
    const g = c.getContext("2d"), img = g.createImageData(n, n), r = rng(11);
    const lattice = (m) => {
      const a = new Float32Array(m * m).map(() => r()), v = (i, j) => a[(((j % m) + m) % m) * m + (((i % m) + m) % m)];
      return (x, y) => { const fx = (x / n) * m, fy = (y / n) * m, x0 = Math.floor(fx), y0 = Math.floor(fy), tx = fx - x0, ty = fy - y0, sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty); return (v(x0, y0) * (1 - sx) + v(x0 + 1, y0) * sx) * (1 - sy) + (v(x0, y0 + 1) * (1 - sx) + v(x0 + 1, y0 + 1) * sx) * sy; };
    };
    const n1 = lattice(5), n2 = lattice(12), n3 = lattice(40);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const v = 0.5 * n1(x, y) + 0.3 * n2(x, y) + 0.2 * n3(x, y), grain = r(), i = (y * n + x) * 4, pale = v < 0.44;

<script>
/* Story 02, The tally board. It follows lab 02, streaming aggregation, tab by tab.
   Counting needs memory: the slate at the worker's side is the worker's state, and the cards that leave are the results.
   Everything is done by hand and within reach. The worker sees a candy go by, then chalks it up on the slate.
   A card is written on the pad at the head of the card line and pushed onto the line. A column whose time slot is over
   is wiped by hand. The right hand does one thing at a time, so jobs wait their turn.
   Scenes: a card on a timer, a card for every change, a column per time slot, a late candy, and waiting a little. */
(() => {
  const BY = 3.9, WX = 3.9;                   // the lines run along y = BY; the worker stands at WX
  const SEE = WX - 0.45, GRAB = WX - 0.1, IN1 = WX + 0.2;        // where a candy is read, where a late one is taken off, where the candy line ends
  const PLATE = WX + 1.04, PAD = WX + 1.28, OUT0 = WX + 1.42, PUT = WX + 1.54, OUT1 = 10.6;   // the pad of blank cards stands on a plate at the head of the card line
  const VC = 1.8;                             // the card line runs a little faster, so cards do not crowd
  const SLOT = 5, PERIOD = 2;                 // seconds in a time slot; seconds between cards on a timer
  const CLOCK = [2.1, 2.85, 0.6];
  const GRIP = [2, -38];                      // where the hand holds a card, measured from the card's foot

  const SCENES = [
    { id: "tally", label: "Keep a tally", emit: "timer",
      story: "Counting needs memory. The worker sees each candy go by and chalks one more next to its flavor on the board. The line never ends, so the tally is never final. Instead, every two seconds the worker copies the board onto cards, one for each flavor with its total so far, changed or not, and sends them down the card line. Engineers call the board state, and the counting an aggregation." },
    { id: "change", label: "Every change", emit: "change",
      story: "The same tally, a different habit. The worker does not wait for the clock. Each candy changes one number, and the worker writes a card with that new number at once. One candy in, one card out." },
    { id: "slots", label: "Time slots", win: true, delay: 0,
      story: "A time slot gives the count an end. Every candy carries a stamp with the second it was made, and the board has one column for each five-second slot. When the first candy of the next slot shows up, the old slot is complete: the worker writes its counts on cards, one for each flavor, and then wipes its column. Engineers call the slot a window." },
    { id: "late", label: "A late candy", win: true, delay: 0, disorder: true,
      story: "Some candies get stuck on the way and arrive late. Their stamp is red. A late candy still counts as long as its slot is open. If the slot on the stamp is already closed, its cards are on their way, so the worker takes the candy off the line and throws it in the bin." },
    { id: "wait", label: "Wait a little", win: true, delay: 2, disorder: true,
      story: "The same candies, with more patience. The worker keeps each slot open two seconds longer before writing its cards, so fewer late candies end up in the bin. The price is that every card goes out two seconds later." },
  ];

  let k, F, P, U, PAL, rnd, sc, L, lineIn, lineOut, hopper, ship, lateBin, who, hands, bd, chalk;

  const later = (t, fn) => F.later(t, fn);

  /* The board is a slate on two legs at the worker's side, close enough to write on. One line for each flavor, with the

  function drawSlate() {
    const [fx, fy] = who.foot, x0 = fx + 19, x1 = x0 + 50, y0 = fy - 124, y1 = fy - 38;
    bd = { x0, x1, y0, dot: x0 + 41, col: sc.win ? [x0 + 9, x0 + 26] : [x0 + 17], row: (j) => fy - 78 + j * 16 };
    k.node(L.board, `<ellipse cx="${k.f((x0 + x1) / 2)}" cy="${k.f(fy + 1)}" rx="30" ry="5" fill="#5c5247" opacity=".13"/>`
      + k.edges([[[x0 + 8, y1], [x0 + 5, fy + 1]], [[x1 - 8, y1], [x1 - 5, fy + 1]]], { w: 2.2, over: 0 })
      + k.shape(`M${x0 - 3} ${y0 - 3}L${x1 + 3} ${y0 - 3}L${x1 + 3} ${y1 + 3}L${x0 - 3} ${y1 + 3}Z`, PAL.wood, 1.5)

  const writeJob = (r, fl) => ({ kind: "write", col: r.col, run(t0) {
    const spot = numAt(r.col, F.FLAVORS.indexOf(fl)), pen = [spot[0] - 7, spot[1] + 4];

    const n = r[of][fl], base = P(PAD, BY, F.TOP), at = plus(base, GRIP);
    if (!n) return t0;
    if (r.closing) { r.dim = true; drawBoard(t0); }

    later(t0 + 0.1, () => { cur.eye = [base[0], base[1] - 24]; });
    later(t0 + 0.16, (t) => who.go(1, scribble([at[0], at[1] + 10], t), t, 0.05));

      const c = F.card(L.cards, { head: sc.win ? sec(r.ws) : "NOW", parts: [{ flavor: fl, n }] });

    const x = bd.col[q.col] - 7;
    cur.eye = [x, bd.row(1)]; who.go(1, [x, bd.row(0) - 4], t0, 0.2);
    later(t0 + 0.2, () => { q.wipe = true; who.go(1, [x, bd.row(2) + 5], t0 + 0.2, 0.18); });
    later(t0 + 0.38, (t) => { rows.delete(q.ws); drawBoard(t); });

  /* the worker has read the candy: count it, or find that it is too late */

    if (it.et < wm) { it.late = true; counts.late++; return; }

    maxEt = Math.max(maxEt, it.et); wm = Math.max(wm, Math.floor((maxEt - sc.delay) / SLOT) * SLOT);
    [...rows.values()].filter((q) => !q.closing && q.ws + SLOT <= wm).sort((a, b) => a.ws - b.ws).forEach((q) => {      // these slots are complete
      q.closing = true; counts.closed++;
      F.FLAVORS.forEach((f2) => { if (q.n[f2] > 0) enqueue(cardJob(q, "n", f2), now); });
      enqueue(wipeJob(q), now);
    });
    enqueue(writeJob(r, fl), now);
  }
  /* A candy is read as it goes by. One that is too late is taken off the line with the left hand and thrown in the bin. */
  function see(it, now) {
    it.seen = true; it.read = now + 0.3;
    decide(it, now);
    if (!it.late) return;
    const tp = it.born + GRAB / F.V, g0 = F.grasp(0, it.r * U), [fx, fy] = who.foot;
    cur.toss = it;
    who.go(0, () => it.pos && plus(mid(it), g0), now, Math.max(0.12, tp - now));
    later(tp, () => { it.state = "hand"; F.give(it, who, 0); who.go(0, [fx - 31, fy - 27], tp, 0.2); });
    later(tp + 0.2, (t) => { it.hand = null; it.state = "out"; F.drop(it, it.pos, lateBin, t); who.go(0, null, t, 0.36); });
    later(tp + 0.5, () => { if (cur.toss === it) cur.toss = null; });
  }
  /* the eyes: on a candy while it is read, else on the work of the right hand, else on the next candy */
  function attend(now) {
    const near = cur.toss || items.find((c) => c.state === "line" && c.pos && (c.read > now || (!c.seen && F.V * (now - c.born) > SEE - 0.5)));
    const next = near || items.find((c) => c.state === "line" && c.pos && !c.seen);
    who.look(near ? () => (near.pos ? mid(near) : null) : cur.eye || (next ? () => (next.pos ? mid(next) : null) : null));
  }

  /* ----- the candies. With time slots they follow a fixed pattern, so each slot shows what the scene is about. ----- */
  function flavor() {
    let fl = F.FLAVORS[Math.floor(rnd() * 3)];
    if (fl === lastFlavor && rnd() < 0.6) fl = F.FLAVORS[(F.FLAVORS.indexOf(fl) + 1) % 3];
    return (lastFlavor = fl);
  }
  function fillSlot(B) {
    const t1 = B + 0.15 + rnd() * 0.1, t2 = t1 + 1.2 + rnd() * 0.04, t3 = t2 + 1.2 + rnd() * 0.04, t4 = t3 + 1.2 + rnd() * 0.04;
    const stuck = sc.disorder && B >= 5, veryStuck = sc.disorder && !sc.delay && B >= 10 && (B / SLOT) % 2 === 0;
    queue.push({ born: t1, et: t1 });
    queue.push(stuck ? { born: t2, et: B - 0.4 - rnd() * 0.9, warn: true } : { born: t2, et: t2 });      // stuck since the slot before
    queue.push({ born: t3, et: t3 });
    queue.push(veryStuck ? { born: t4, et: B - 0.3 - rnd() * 0.6, warn: true } : sc.disorder ? { born: t4, et: t4 - 1.5, warn: true } : { born: t4, et: t4 });   // late, but its slot is still open
  }
  function nextCandy() {
    if (sc.win) {
      while (!queue.length) { fillSlot(slotAt); slotAt += SLOT; }
      return queue.shift();
    }
    const born = nextBorn; nextBorn += rnd() < 0.18 ? 1.25 + rnd() * 0.15 : 1.5 + rnd() * 1.9;
    return { born };
  }
  let ahead = null;
  function spawn(now) {
    for (;;) {
      if (!ahead) ahead = nextCandy();
      if (ahead.born > now) return;
      if (ahead.born > -SEE / F.V + 0.15) {
        const it = F.thing(L.candy, { flavor: flavor(), flag: sc.win ? sec(ahead.et) : null, warn: ahead.warn });
        it.born = ahead.born; it.et = ahead.et; it.state = "line"; items.push(it);
      } else flavor();
      ahead = null;
    }
  }

  function labels() {
    const head = [who.foot[0] - 14 * F.MAN, who.foot[1] - 62 * F.MAN];
    const list = [
      { title: "KITCHEN", note: sc.win ? "each candy gets a time stamp" : "candies come out one by one", x: 56, y: 150, side: "start", to: P(0, BY + 0.3, 1.7) },
      { title: "TALLY BOARD", note: sc.win ? "one column for each time slot" : "the worker's memory, in chalk", x: 1344, y: 150, side: "end", to: [bd.x1 - 3, bd.y0 + 5] },
      { title: "COUNTER", note: "sees a candy, chalks it up, writes the cards", x: 56, y: 520, side: "start", to: head },
      { title: "CARDS", note: sc.win ? "one per flavor for each finished slot" : sc.emit === "timer" ? "every flavor's total, every 2 seconds" : "one for every change", x: 1344, y: 650, side: "end", to: P(OUT1 - 0.6, BY + 0.45, F.TOP) },
    ];
    if (lateBin) list.push({ title: "TOO LATE", note: "its slot is already closed", x: 56, y: 680, side: "start", to: P(lateBin.x - 0.45, lateBin.y + 0.5, 0.45) });
    k.setLabels(list);
  }

  function init(kit, scene) {
    k = kit; F = Factory(kit); P = kit.P; U = kit.U; PAL = kit.PAL; sc = scene; rnd = kit.rng(19); F.reset();
    items = []; cards = []; rows = new Map(); queue = []; ahead = null; lastFlavor = null; lateBin = null; jobs = []; busy = false; held = null;
    counts = { counted: 0, cards: 0, closed: 0, late: 0, saved: 0 };
    wm = -Infinity; maxEt = -Infinity; nextEmit = PERIOD; cur = { eye: null, toss: null }; boardUntil = 0;
    slotAt = -SLOT; nextBorn = -SEE / F.V + 0.3;
    F.room({ clock: CLOCK, door: 11.2 });
    // the moving part of the sheet, back to front
    L = { clock: k.layer(), board: k.layer(), dolls: k.layer(), belt: k.layer(), under: k.layer(), candy: k.layer(), over: k.layer(), pad: k.layer(), cards: k.layer(), arms: k.layer(), front: k.layer() };
    hands = F.clockHands(L.clock, CLOCK);
    lineIn = F.belt(L.belt, 0, IN1, BY); lineOut = F.belt(L.belt, OUT0, OUT1, BY, VC);
    k.node(L.belt, k.box(PLATE, BY - F.BW / 2, F.TOP - 0.28, OUT0 - PLATE, F.BW, 0.28, PAL.wood));
    who = F.worker(L, { x: WX, y: BY - F.GAP, look: 1, coat: PAL.green });
    drawSlate();
    hopper = F.bin(L, WX + 0.22, BY - 0.5, 0.78, 1.0, 0.7, PAL.wood);
    ship = F.bin({ under: L.under, over: L.front }, OUT1 + 0.4, BY - 0.7, 1.5, 1.4, 0.75, PAL.wood);
    if (sc.disorder) lateBin = F.bin(L, WX - 1.5, BY + 1.3, 1.2, 1.0, 0.7, PAL.red);
    // the pad: blank cards, one behind the other
    { const [x, y] = P(PAD, BY, F.TOP), sheet = (d) => k.shape(`M${x - 22 + d} ${y - 48 - d}L${x + 22 + d} ${y - 48 - d}L${x + 22 + d} ${y - 4 - d}L${x - 22 + d} ${y - 4 - d}Z`, PAL.white, 1.2);
      k.node(L.pad, sheet(4) + sheet(2) + sheet(0)); }
    if (!sc.win) row(0);
    k.labelLayer(); labels();
    k.focus([246, 24, 908, 760]);
    drawBoard(0); tick(0, 0);
  }

  function tick(dt, now) {
    spawn(now);
    F.run(now);
    if (sc.emit === "timer" && now >= nextEmit) { F.FLAVORS.forEach((fl) => enqueue(cardJob(rows.get(0), "shown", fl), now)); nextEmit += PERIOD; }
    items.forEach((it) => {
      if (it.state !== "line") return;
      const x = F.V * (now - it.born);
      if (!it.seen && x >= SEE) see(it, now);
      if (x >= IN1) {                                             // off the end of the line, into the box
        it.state = "out"; it.el.classList.add("air");
        F.fly(it.el, P(IN1, BY, F.TOP), hopper.floor, now, 0.34, { arc: 7, it, done: () => it.el.remove() });
        return;
      }
      F.put(it, P(x, BY, F.TOP), { busy: it.read > now, low: it.seen });      // near the worker its stamp hangs low, clear of the worker's face it.el.style.opacity = Math.max(0, Math.min(1, (x - 0.05) / 0.3));
    });
    attend(now); who.pose(now, dt);
    items.forEach((it) => { if (it.state === "hand") F.put(it, F.carried(it), { air: true, low: true }); });
    items = items.filter((it) => it.state !== "out");
    if (held) { const h = who.at(1); F.put(held, [h[0] - GRIP[0], h[1] - GRIP[1]]); }
    { const h = who.shown(1), d = `M${k.f(h[0] + 2)} ${k.f(h[1] - 3)}L${k.f(h[0] + 6)} ${k.f(h[1] - 9)}`; chalk.children[0].setAttribute("d", d); chalk.children[1].setAttribute("d", d); }     // the chalk in the right hand
    cards = cards.filter((c) => {
      const x = OUT0 + VC * (now - c.t0);
      if (x >= OUT1) { F.drop(c, P(OUT1, BY, F.TOP), ship, now); return false; }
      F.put(c, P(x, BY, F.TOP)); return true;
    });
    if ((boardUntil && now > boardUntil) || [...rows.values()].some((q) => q.wipe)) { if (now > boardUntil) boardUntil = 0; drawBoard(now); }
    lineIn.update(now); lineOut.update(now); hands(now);
  }

  function status() {
    const n = (v, one, many) => `${v} ${v === 1 ? one : many}`;
    if (!sc.win) return `${n(counts.counted, "candy", "candies")} counted · ${n(counts.cards, "card", "cards")} sent`;
    if (sc.id === "slots") return `${n(counts.closed, "slot", "slots")} finished`;
    return `${counts.saved} late but counted · ${counts.late} too late`;
  }

  Story.start({ scenes: SCENES, init, tick, status });
})();

</script>
