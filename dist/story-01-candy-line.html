<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Candy Line</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A small candy factory shows what a stream is and what a worker on it does: filter and transform, one candy at a time.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Young+Serif&display=swap">
<style>
/* Stream Stories: the same ideas as the Stream Lab, told as a small factory for readers who are not engineers.
   Layout: one sheet of cream paper lies on the page and holds the title, the clock time and the drawing; the buttons and the caption sit under it. */
:root {
  /* the page around the sheet follows the reader's theme */
  --page: #E8DFCE; --text: #2B2826; --muted: #6A6257; --rule: #8C8377; --panel: #FBF7EE; --accent: #C4604F; --on-accent: #FFFDF7; --pressed: #2B2826; --on-pressed: #FAF5EA;
  /* the sheet is paper: it looks the same in light and dark */
  --paper: #FAF5EA; --ink: #2B2826; --pencil: #6F675C; --lead: #8C8377; --sheet-accent: #C4604F;
  --font-title: "Young Serif", Georgia, "Times New Roman", serif;
  --font-hand: "Patrick Hand", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #1F1C19; --text: #F3ECDF; --muted: #B5AC9D; --rule: #8C8377; --panel: #2A2622; --accent: #E0806E; --on-accent: #1F1C19; --pressed: #F3ECDF; --on-pressed: #1F1C19; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #1F1C19; --text: #F3ECDF; --muted: #B5AC9D; --rule: #8C8377; --panel: #2A2622; --accent: #E0806E; --on-accent: #1F1C19; --pressed: #F3ECDF; --on-pressed: #1F1C19; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--page); color: var(--text); font-family: var(--font-hand); font-size: 19px; line-height: 1.35; }
.page {
  max-width: 1240px; margin: 0 auto; padding-block: 22px 34px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 12px;
}
.sheet { background: var(--paper); color: var(--ink); box-shadow: 3px 4px 0 rgba(60, 48, 36, 0.16); display: grid; gap: 0; padding: clamp(14px, 3vw, 34px) clamp(14px, 3vw, 38px) 12px; min-width: 0; }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 10px 28px; }
.eyebrow { font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--sheet-accent); }
h1 { font: 400 clamp(34px, 6vw, 60px)/1 var(--font-title); margin: 2px 0 6px; letter-spacing: -0.02em; text-wrap: balance; }
.sub { margin: 0; font-size: 21px; letter-spacing: .06em; }
.now { text-align: right; display: grid; gap: 0; justify-items: end; margin-left: auto; }
.now .time { font-size: 34px; letter-spacing: .08em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.now .status { font-size: 19px; letter-spacing: .05em; }
.note { font-size: 16px; letter-spacing: .04em; color: var(--pencil); margin: 0; }

.stage { position: relative; aspect-ratio: 1400 / 800; margin-inline: clamp(-38px, -3vw, -14px); }
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage .ink { fill: none; stroke: #3a3531; stroke-linecap: round; stroke-linejoin: round; }
.stage .ink-f { stroke: #3a3531; }
.stage .ink.thin { vector-effect: non-scaling-stroke; stroke-width: 1px; }
.stage line.ink.thin { stroke-width: inherit; }
.stage .lab-t { font: 400 23px var(--font-hand); letter-spacing: .13em; fill: var(--ink); }
.stage .lab-n { font: 400 18.5px var(--font-hand); letter-spacing: .05em; fill: var(--pencil); }
.stage .sign { font: 400 21px var(--font-hand); letter-spacing: .16em; fill: var(--ink); }
.stage .lead { fill: none; stroke: var(--lead); stroke-width: 1; }
.stage .ring { fill: var(--paper); stroke: var(--lead); stroke-width: 1; }
.stage .air .cs { display: none; }
.stage .spark { display: none; }
.stage .busy .spark { display: inline; }
.stage .tag-down, .stage .low .tag-up { display: none; }
.stage .low .tag-down { display: inline; }
.stage .flag-t { font: 400 14px var(--font-hand); letter-spacing: .03em; fill: var(--ink); }
.stage .flag-t.warn { fill: #b14a3a; }
.stage .card-n { font: 400 18px var(--font-hand); fill: var(--ink); }
.stage .card-h { font: 400 13.5px var(--font-hand); letter-spacing: .04em; fill: var(--pencil); }
.stage .board-t { font: 400 19px var(--font-hand); letter-spacing: .14em; fill: var(--pencil); }
.stage .board-r { font: 400 21px var(--font-hand); letter-spacing: .05em; fill: var(--ink); }
.stage .board-n { font: 400 27px var(--font-hand); fill: var(--ink); }
.stage .sheet-r { font: 400 16px var(--font-hand); letter-spacing: .05em; fill: var(--ink); }
.stage .board-n.hot, .stage .hot .board-r, .stage .hot .sheet-r { fill: #c4604f; }
.stage .halo { fill: none; stroke: #c4604f; stroke-width: 2.4; }
.stage .banner { font: 400 30px var(--font-hand); letter-spacing: .12em; fill: #b14a3a; }
.stage .plus { font: 400 22px var(--font-hand); fill: #c4604f; }
.stage.compact .labels { display: none; }

.steps { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.steps .seg { display: flex; flex-wrap: wrap; gap: 8px; }
.steps button {
  font: inherit; font-size: 19px; letter-spacing: .05em; cursor: pointer; color: var(--text);
  background: var(--panel); border: 1.5px solid var(--rule); border-radius: 999px; padding: 5px 16px 6px;
}
.steps button i { font-style: normal; color: var(--muted); margin-right: 6px; }
.steps button[aria-pressed="true"] { background: var(--pressed); color: var(--on-pressed); border-color: var(--pressed); }
.steps button[aria-pressed="true"] i { color: inherit; opacity: .6; }
.steps button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.steps .spacer { flex: 1; }
.steps #play { background: var(--accent); color: var(--on-accent); border-color: var(--accent); min-width: 92px; }
.story { margin: 0; font-size: 23px; line-height: 1.35; max-width: 62ch; text-wrap: pretty; }
.foot { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px 20px; font-size: 17px; letter-spacing: .04em; color: var(--muted); }
.foot .links { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px 22px; }
.foot a { color: inherit; }

</style>
</head>
<body>
<div class="page">
  <div class="sheet">
    <div class="head">
      <header>
        <div class="eyebrow">Stream stories · 01</div>
        <h1>The candy line</h1>
        <p class="sub">one line · one clock · no last candy</p>
      </header>
      <div class="now" aria-live="off">
        <div class="time" id="time">12:00:00</div>
        <div class="status" id="status"></div>
      </div>
    </div>
    <div class="stage" id="stage"></div>
    <p class="note">Illustrative: a made-up factory.</p>
  </div>
  <div class="steps">
    <div class="seg" id="scenes" role="group" aria-label="Story steps"></div>
    <span class="spacer"></span>
    <button id="play" type="button">Pause</button>
  </div>
  <p class="story" id="story"></p>
  <div class="foot"><span class="links"><a href="01-transform.html">For engineers: Stateless transform</a><a href="story-02-tally-board.html">02 The tally board →</a></span></div>
</div>
<script>
/* Stream Stories, shared kit: one hand-drawn sheet in plain SVG, no libraries.
   Everything is drawn twice, the way a marker sketch is made: a soft wash of colour with paper tooth in it,
   then a thin ink line that bows a little and runs past its corners. The scene is isometric but flat:
   P(x, y, z) turns a place in the room into a point on the sheet. People are small paper dolls that face the reader.
   An episode supplies scenes, init(kit, scene) and tick(dt, now); the story runs until the reader presses Pause. */
const Story = (() => {
  const NS = "http://www.w3.org/2000/svg";
  const W = 1400, H = 800;
  const INK = "#3a3531";
  const PAL = {
    paper: "#faf5ea", floor: "#f1e7d2", wall: "#f6eedd", wood: "#dcbd90", woodDark: "#c19f72", base: "#c9aa7f",
    steel: "#c3c8c9", belt: "#8f8881", dark: "#4f4944", glass: "#bfd6d8", white: "#fefbf3",
    a: "#e59a62", b: "#72bbb0", c: "#ac92d6", red: "#d67c6c", yellow: "#ecc96e", blue: "#86a3c6", green: "#9dbb88", pink: "#efb9b3",
    skin: ["#f3ceac", "#dca97f", "#b07a57"], hair: ["#3f332d", "#7d4d2e", "#a59e95"],
  };
  const BASE = 12 * 3600;
  const hms = (t) => {
    const d = Math.floor(BASE + t + 1e-6);
    return [Math.floor(d / 3600), Math.floor((d % 3600) / 60), d % 60].map((n) => String(n).padStart(2, "0")).join(":");
  };
  function rng(seed) {
    let a = seed >>> 0;
    return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  let rand = rng(1);
  const f = (n) => Math.round(n * 10) / 10;
  function mix(a, b, t) {
    const p = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16)), A = p(a), B = p(b);
    return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, "0")).join("");
  }
  const lighter = (c, t = 0.4) => mix(c, "#fffaf0", t), darker = (c, t = 0.2) => mix(c, "#7a6753", t);

  /* ----- the isometric room: x runs down and right, y down and left, z up ----- */
  const CS = Math.cos(Math.PI / 6), SN = 0.5, U = 52, OX = 551, OY = 236;
  const P = (x, y, z = 0) => [OX + (x - y) * CS * U, OY + (x + y) * SN * U - z * U];

  /* ----- ink: every straight edge is ruled by hand, so it bows a little and overshoots ----- */
  function stroke(a, b, o = {}) {
    const over = o.over ?? 2.4, amp = o.amp ?? 0.9, dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
    const o1 = over * rand(), o2 = over * rand(), bow = (rand() - 0.5) * 2 * amp * Math.min(1, L / 70);
    const A = [a[0] - ux * o1, a[1] - uy * o1], B = [b[0] + ux * o2, b[1] + uy * o2];
    return `M${f(A[0])} ${f(A[1])}Q${f((A[0] + B[0]) / 2 - uy * bow)} ${f((A[1] + B[1]) / 2 + ux * bow)} ${f(B[0])} ${f(B[1])}`;
  }
  const attr = (o) => ` stroke-width="${o.w ?? 1.25}"${o.col ? ` style="stroke:${o.col}"` : ""}${o.op ? ` opacity="${o.op}"` : ""}`;
  const edges = (pairs, o = {}) => `<path class="ink" d="${pairs.map(([a, b]) => stroke(a, b, o)).join("")}"${attr(o)}/>`;
  const loop = (pts, o) => edges(pts.map((p, i) => [p, pts[(i + 1) % pts.length]]), o);
  /* a smooth line through points, for round things and leader lines */
  function curve(pts, closed = false) {
    const n = pts.length, g = (i) => (closed ? pts[(i + n) % n] : pts[Math.max(0, Math.min(n - 1, i))]);
    let d = `M${f(pts[0][0])} ${f(pts[0][1])}`;
    for (let i = 0; i < (closed ? n : n - 1); i++) {
      const p0 = g(i - 1), p1 = g(i), p2 = g(i + 1), p3 = g(i + 2);
      d += `C${f(p1[0] + (p2[0] - p0[0]) / 6)} ${f(p1[1] + (p2[1] - p0[1]) / 6)} ${f(p2[0] - (p3[0] - p1[0]) / 6)} ${f(p2[1] - (p3[1] - p1[1]) / 6)} ${f(p2[0])} ${f(p2[1])}`;
    }
    return d + (closed ? "Z" : "");
  }
  /* ----- wash: flat colour laid a touch off the line, with the paper showing through ----- */
  const tooth = (d) => `<path d="${d}" fill="url(#tooth)"/>`;
  function wash(pts, col, o = {}) {
    const j = o.j ?? 0.9, dx = (rand() - 0.5) * 1.4, dy = (rand() - 0.5) * 1.4;
    const d = "M" + pts.map((p) => f(p[0] + dx + (rand() - 0.5) * j) + " " + f(p[1] + dy + (rand() - 0.5) * j)).join("L") + "Z";
    return `<path d="${d}" fill="${col}"/>` + tooth(d);
  }
  /* a shape given as path data: washed, then inked */
  const shape = (d, col, w = 1.4) => `<path d="${d}" fill="${col}"/>${tooth(d)}<path class="ink" d="${d}" stroke-width="${w}"/>`;
  const dot = (x, y, r, col, w = 1.2) => `<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="${col}"${w ? ` class="ink-f" stroke-width="${w}"` : ""}/>`;
  const shadow = (pts, op = 0.13) => `<path d="M${pts.map((p) => f(p[0]) + " " + f(p[1])).join("L")}Z" fill="#5c5247" opacity="${op}"/>`;

  /* ----- solids ----- */
  /* A box standing at (x, y, z), w along x, d along y, h high. col is the face that looks down and right. */
  function box(x, y, z, w, d, h, col, o = {}) {
    const t = [P(x, y, z + h), P(x + w, y, z + h), P(x + w, y + d, z + h), P(x, y + d, z + h)], b1 = P(x + w, y, z), b2 = P(x + w, y + d, z), b3 = P(x, y + d, z);
    return wash(t, o.top ?? lighter(col)) + wash([t[1], t[2], b2, b1], col) + wash([t[3], t[2], b2, b3], o.side ?? darker(col))
      + edges([[t[0], t[1]], [t[1], t[2]], [t[2], t[3]], [t[3], t[0]], [t[1], b1], [t[2], b2], [t[3], b3], [b1, b2], [b2, b3]], { w: o.w });
  }
  /* An open box you can drop things into. under goes behind what falls in, over goes in front of it. */
  function crate(x, y, z, w, d, h, col) {
    const T = (px, py) => P(px, py, z + h), B = (px, py) => P(px, py, z), in1 = darker(col, 0.45), in2 = darker(col, 0.6);
    const under = wash([B(x, y), B(x + w, y), B(x + w, y + d), B(x, y + d)], darker(col, 0.75)) + wash([T(x, y), T(x, y + d), B(x, y + d), B(x, y)], in1) + wash([T(x, y), T(x + w, y), B(x + w, y), B(x, y)], in2)
      + edges([[T(x, y), T(x + w, y)], [T(x, y), T(x, y + d)], [T(x, y), B(x, y)]], { w: 1.1 });
    const over = wash([T(x + w, y), T(x + w, y + d), B(x + w, y + d), B(x + w, y)], col) + wash([T(x, y + d), T(x + w, y + d), B(x + w, y + d), B(x, y + d)], darker(col))
      + edges([[T(x + w, y), T(x + w, y + d)], [T(x + w, y + d), T(x, y + d)], [T(x + w, y), B(x + w, y)], [T(x + w, y + d), B(x + w, y + d)], [T(x, y + d), B(x, y + d)], [B(x + w, y), B(x + w, y + d)], [B(x + w, y + d), B(x, y + d)]]);
    return { under, over };
  }
  /* An upright cylinder: a can, a jar, a roll. */
  function cyl(x, y, z, r, h, col, o = {}) {
    const c0 = P(x, y, z), c1 = P(x, y, z + h), rx = f(Math.SQRT2 * CS * r * U), ry = f(Math.SQRT2 * SN * r * U);
    const body = `M${f(c1[0] - rx)} ${f(c1[1])}L${f(c0[0] - rx)} ${f(c0[1])}A${rx} ${ry} 0 0 0 ${f(c0[0] + rx)} ${f(c0[1])}L${f(c1[0] + rx)} ${f(c1[1])}A${rx} ${ry} 0 0 1 ${f(c1[0] - rx)} ${f(c1[1])}Z`;
    const top = `M${f(c1[0] - rx)} ${f(c1[1])}A${rx} ${ry} 0 1 0 ${f(c1[0] + rx)} ${f(c1[1])}A${rx} ${ry} 0 1 0 ${f(c1[0] - rx)} ${f(c1[1])}Z`;
    return shape(body, col, o.w ?? 1.2) + shape(top, o.top ?? lighter(col), o.w ?? 1.2);
  }

  /* ----- people: flat paper dolls, feet at (0, 0), about 86 tall with the hat ----- */
  function doll(o = {}) {
    const look = o.look ?? 0, skin = PAL.skin[look], hair = PAL.hair[look], coat = o.coat ?? PAL.blue;
    let h = `<ellipse cx="0" cy="1.5" rx="20" ry="6.5" fill="#8097b8" opacity=".5"/>`;
    [-1, 1].forEach((s) => {
      h += shape(`M${s * 6 - 3.2} -13L${s * 6 - 3.2} -3L${s * 6 + 3.2} -3L${s * 6 + 3.2} -13Z`, "#66738c", 1.2);
      h += shape(`M${s * 6 - 4.4} -3.4Q${s * 6 - 5} 0.8 ${s * 6} 0.8Q${s * 6 + 5} 0.8 ${s * 6 + 4.4} -3.4Z`, "#9a6b4c", 1.2);
    });
    h += shape("M-8.5 -45C-13.5 -45 -15 -40 -16 -34L-20 -15C-21.5 -9 -17 -8.5 -12 -8.5L12 -8.5C17 -8.5 21.5 -9 20 -15L16 -34C15 -40 13.5 -45 8.5 -45Z", coat, 1.5);
    if (o.apron !== false) h += shape("M-6.5 -39L6.5 -39L10.5 -11.5L-10.5 -11.5Z", PAL.white, 1.1);
    h += shape("M-13.6 -57A13.6 13.6 0 1 0 13.6 -57A13.6 13.6 0 1 0 -13.6 -57Z", skin, 1.5);
    h += `<path d="M-13.4 -59C-14 -66 -8 -70.5 0 -70.5C8 -70.5 14 -66 13.4 -59C9 -62.5 4 -63.5 0 -63.5C-4 -63.5 -9 -62.5 -13.4 -59Z" fill="${hair}"/>`;
    h += dot(-5, -55.5, 1.7, INK, 0) + dot(5, -55.5, 1.7, INK, 0);
    h += `<circle cx="-8.6" cy="-51.4" r="3.1" fill="#ee9f97" opacity=".6"/><circle cx="8.6" cy="-51.4" r="3.1" fill="#ee9f97" opacity=".6"/>`;
    h += `<path class="ink" d="M-3 -50.2Q0 -47.6 3 -50.2" stroke-width="1.2"/>`;
    if (o.hat !== false) {
      h += shape("M-10.5 -67C-17.5 -70 -16 -82.5 -6.5 -80.5C-4 -87 6 -87 8 -80.5C16.5 -82.5 17.5 -70 10.5 -67Z", PAL.white, 1.4);
      h += shape("M-11 -70L11 -70L11 -64.5L-11 -64.5Z", PAL.white, 1.2);
    }
    return h;
  }
  /* One arm, hanging from (0, 0). The episode turns it about the shoulder. tool: "paddle" for a small wooden pusher. */
  function arm(o = {}) {
    let h = "";
    if (o.tool === "paddle") h += `<path class="ink" d="M0 22L0 41" stroke-width="2.2" style="stroke:#8a6a48"/>` + shape("M-6.5 38L6.5 38L6.5 48L-6.5 48Z", PAL.wood, 1.2);
    h += shape("M-3.8 0L-3.8 20A3.8 3.8 0 0 0 3.8 20L3.8 0A3.8 3.8 0 0 0 -3.8 0Z", o.coat ?? PAL.blue, 1.3);
    return h + dot(0, 23, 4.1, PAL.skin[o.look ?? 0], 1.2);
  }
  const SHOULDER = [[-13, -39], [13, -39]];   // where the arms hang from, before the doll is scaled

  /* ----- the sheet ----- */
  let stageEl, back, live, labelLayer = null, labels = [], tight = null;
  /* Paper tooth: a small tile of soft noise, made once. Some patches dry lighter and some pool darker, as marker does on paper. */
  function toothTile() {
    const n = 256, c = document.createElement("canvas"); c.width = c.height = n;
    const g = c.getContext("2d"), img = g.createImageData(n, n), r = rng(11);
    const lattice = (m) => {
      const a = new Float32Array(m * m).map(() => r()), v = (i, j) => a[(((j % m) + m) % m) * m + (((i % m) + m) % m)];
      return (x, y) => { const fx = (x / n) * m, fy = (y / n) * m, x0 = Math.floor(fx), y0 = Math.floor(fy), tx = fx - x0, ty = fy - y0, sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty); return (v(x0, y0) * (1 - sx) + v(x0 + 1, y0) * sx) * (1 - sy) + (v(x0, y0 + 1) * (1 - sx) + v(x0 + 1, y0 + 1) * sx) * sy; };
    };
    const n1 = lattice(5), n2 = lattice(12), n3 = lattice(40);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const v = 0.5 * n1(x, y) + 0.3 * n2(x, y) + 0.2 * n3(x, y), grain = r(), i = (y * n + x) * 4, pale = v < 0.44;
      const a = pale ? (0.44 - v) * 0.75 : (v - 0.52) * 0.42;
      img.data[i] = pale ? 255 : 96; img.data[i + 1] = pale ? 250 : 76; img.data[i + 2] = pale ? 238 : 60;
      img.data[i + 3] = Math.max(0, Math.min(1, a + (grain > 0.92 ? 0.035 : 0))) * 255;
    }
    g.putImageData(img, 0, 0);
    return c.toDataURL("image/png");
  }
  function setup(el) {
    stageEl = el;
    const mk = (cls) => { const s = document.createElementNS(NS, "svg"); s.setAttribute("class", cls); s.setAttribute("viewBox", `0 0 ${W} ${H}`); el.appendChild(s); return s; };
    back = mk("back"); live = mk("live");

  function candyArt(it) {
    const r = it.r * U, col = it.grey ? "#cfc8bd" : PAL[it.flavor], pts = [];
    for (let i = 0; i < 14; i++) { const a = (i / 14) * Math.PI * 2, q = r * (1 + 0.03 * Math.sin(i * 2.4 + it.id)); pts.push([Math.cos(a) * q, Math.sin(a) * q]); }
    const ball = k.curve(pts, true);
    let h = `<ellipse class="cs" cx="${f(r * 0.25)}" cy="${f(r * 1.02)}" rx="${f(r * 1.05)}" ry="${f(r * 0.42)}" fill="#3d3631" opacity=".28"/>`;
    if (it.wrapped) {
      const tw = (s) => k.shape(`M${f(s * r * 0.8)} 0L${f(s * r * 1.85)} ${f(-r * 0.68)}L${f(s * r * 1.6)} 0L${f(s * r * 1.85)} ${f(r * 0.68)}Z`, k.lighter(col, 0.3), 1.2);
      const band = `M${f(-r * 0.34)} ${f(-r * 0.93)}Q${f(-r * 0.05)} 0 ${f(-r * 0.34)} ${f(r * 0.93)}`, band2 = `${f(r * 0.34)} ${f(r * 0.93)}Q${f(r * 0.63)} 0 ${f(r * 0.34)} ${f(-r * 0.93)}`;
      h += `<g transform="rotate(30)">${tw(-1)}${tw(1)}${k.shape(ball, col, 1.4)}<path d="${band}L${band2}Z" fill="${PAL.white}" opacity=".9"/><path class="ink" d="${band}M${band2}" stroke-width="1"/></g>`;
    } else {
      h += k.shape(ball, col, 1.4);
      h += `<path d="M${f(-r * 0.55)} ${f(-r * 0.25)}Q${f(-r * 0.5)} ${f(-r * 0.62)} ${f(-r * 0.12)} ${f(-r * 0.66)}" stroke="#fffaf0" stroke-width="${f(r * 0.2)}" stroke-linecap="round" fill="none" opacity=".75"/>`;
    }
    return `<g transform="translate(0 ${f(-r)})">${h}${spark(r)}</g>` + tags(it, -2 * r - 1, 0);
  }
  /* a paper cup, about as big as a candy */
  function cupArt(it) {
    const col = it.grey ? "#cfc8bd" : PAL[it.flavor], t = 14.5, b = 9.5, hgt = 21;
    let h = `<ellipse class="cs" cx="3" cy="1" rx="13" ry="5" fill="#3d3631" opacity=".28"/>`;
    h += k.shape(`M${-t} ${-hgt}L${-b} -2Q0 3 ${b} -2L${t} ${-hgt}Z`, col, 1.4);
    h += `<path class="ink" d="M-5.5 ${-hgt + 4}L-3.6 -1M5.5 ${-hgt + 4}L3.6 -1M0 ${-hgt + 5}L0 0" stroke-width=".9" opacity=".6"/>`;
    h += k.shape(`M${-t} ${-hgt}A${t} 5 0 1 0 ${t} ${-hgt}A${t} 5 0 1 0 ${-t} ${-hgt}Z`, k.darker(col, 0.35), 1.3);
    return h + `<g transform="translate(0 -10)">${spark(13)}</g>` + tags(it, -hgt - 6, 2);
  }
  const artOf = (it) => (it.kind === "cup" ? cupArt(it) : candyArt(it));
  /* make a candy or a cup. o: { kind, flavor, small, flag: text on a tag, warn: a red tag, note: text on a sticky note, grey: no longer of use } */
  function thing(layer, o) {
    const it = { id: ++uid, kind: "candy", wrapped: false, ...o }; it.r = it.small ? R_SMALL : R;
    it.el = k.node(layer, artOf(it));
    return it;
  }
  const redraw = (it) => { it.el.innerHTML = artOf(it); };
  /* put a thing at a sheet point. o: { s: scale, rot: degrees, air: off the line, busy: being worked on, low: its tags hang below it } */
  function put(it, p, o = {}) {
    it.pos = p;
    it.el.setAttribute("transform", `translate(${f(p[0])} ${f(p[1])})${o.rot ? ` rotate(${o.rot.toFixed(1)})` : ""}${o.s != null && o.s !== 1 ? ` scale(${o.s.toFixed(3)})` : ""}`);
    if (!!o.air !== !!it.air) { it.air = !!o.air; it.el.classList.toggle("air", it.air); }
    if (!!o.busy !== !!it.busy) { it.busy = !!o.busy; it.el.classList.toggle("busy", it.busy); }
    if (!!o.low !== !!it.low) { it.low = !!o.low; it.el.classList.toggle("low", it.low); }
  }
  /* A report card: a piece of paper that stands up and faces the reader.
     o.head: a first line of small text; o.parts: [{ flavor, n }]; o.pair: a flavor, drawn as a candy in its cup */
  function cardArt(o) {
    const parts = o.parts ?? [], w = Math.max(o.head ? o.head.length * 7.6 + 16 : 0, parts.length * 35 + 9, o.pair ? 40 : 0), h = (o.head ? 17 : 0) + (o.pair ? 36 : 27);
    let s = `<ellipse class="cs" cx="3" cy="1.5" rx="${f(w * 0.46)}" ry="4.5" fill="#3d3631" opacity=".22"/><path class="ink" d="M${f(-w * 0.28)} -4L${f(-w * 0.28 - 3)} 1.5M${f(w * 0.28)} -4L${f(w * 0.28 + 3)} 1.5" stroke-width="1.5"/>`;
    s += k.shape(`M${f(-w / 2)} ${-h - 4}L${f(w / 2)} ${-h - 4}L${f(w / 2)} -4L${f(-w / 2)} -4Z`, PAL.white, 1.3);
    if (o.head) s += `<text class="card-h" x="0" y="${-h + 9.5}" text-anchor="middle">${o.head}</text>`;
    parts.forEach((c, i) => { const x = -((parts.length - 1) * 35) / 2 + i * 35; s += k.dot(x - 8, -17.5, 6.5, PAL[c.flavor], 1.1) + `<text class="card-n" x="${f(x + 1.5)}" y="-12">${c.n}</text>`; });
    if (o.pair) { const col = PAL[o.pair]; s += k.shape("M-11 -26L-7 -9Q0 -6 7 -9L11 -26Z", k.lighter(col, 0.15), 1.2) + k.shape("M-8.5 -27A8.5 8.5 0 1 1 8.5 -27Z", col, 1.2); }
    return s;
  }
  const card = (layer, o) => { const c = { id: ++uid, ...o }; c.el = k.node(layer, cardArt(o)); return c; };

  /* ----- small moves: an element travels from one sheet point to another, on an arc if wanted ----- */
  function fly(el, a, b, t0, dur, o = {}) { const t = { el, a, b, t0, dur, ...o }; tweens.push(t); return t; }
  function run(now) {
    const cur = tweens; tweens = [];          // a move that ends may start the next one, so new moves collect in a fresh list
    const keep = cur.filter((t) => {
      const u = (now - t.t0) / t.dur; if (u < 0) return true;
      const e = u >= 1 ? 1 : u * u * (3 - 2 * u), x = t.a[0] + (t.b[0] - t.a[0]) * e, y = t.a[1] + (t.b[1] - t.a[1]) * e - (t.arc ?? 0) * Math.sin(Math.PI * e);
      t.el.style.display = "";
      t.el.setAttribute("transform", `translate(${f(x)} ${f(y)})${t.scale ? ` scale(${(t.scale[0] + (t.scale[1] - t.scale[0]) * e).toFixed(3)})` : ""}`);
      if (t.it) t.it.pos = [x, y];
      if (u >= 1) { if (t.done) t.done(); return false; }
      return true;
    });
    tweens = keep.concat(tweens);
  }
  const reset = () => { tweens = []; };
  /* fall into a bin: over its edge, then down out of sight, then gone */
  function drop(it, from, b, now, done) {
    it.el.classList.add("air");
    fly(it.el, from, b.mouth, now, 0.42, { arc: 26, it, done: () => fly(it.el, b.mouth, b.floor, now + 0.42, 0.22, { it, done: () => { it.el.remove(); if (done) done(); } }) });
  }

  return { FX, FY, WH, TOP, BW, V, MAN, R, R_SMALL, FLAVORS, NAMES, GAP, path, onLeft, onBack, panel, room, clockHands, belt, rack, bin, worker, grip,
    thing, redraw, put, card, cardArt, flagArt, noteArt, fly, run, reset, drop };
};

</script>
<script>
/* Story 01, The candy line. It follows lab 01, stateless transform, tab by tab.
   A stream is a line that never ends. An event is one candy: its flavor is the key, the weight on its tag is the value,
   and the clock tells its time. An operator is a worker who handles one candy at a time and remembers nothing.
   The same candies come out of the kitchen in every scene; only the workers change. */
(() => {
  const X1 = 10.6, BY = 3.9;                 // the line ends at X1 and runs along y = BY
  const HOLD = 0.8;                          // seconds a worker has a candy in hand
  const LIMIT = 30, RATE = 2;                // the filter keeps candies heavier than LIMIT grams; the price is RATE cents a gram
  const CLOCK = [5.9, 2.85, 0.6];

  const SCENES = [
    { id: "line", label: "The line", stations: [{ kind: "watch", x: 4.6 }],
      story: "A stream is like this candy line. It has no last candy. Each candy is one event: it has a flavor, a weight on its tag, and the moment it rolled out of the kitchen, which the clock on the wall keeps. Candies come when they come, so the gaps are uneven. Nobody waits for the batch to be finished, because it never is: every candy goes out the moment it arrives." },
    { id: "inspector", label: "The inspector", stations: [{ kind: "filter", x: 4.6 }],
      story: `The worker picks up one candy at a time and decides on the spot. Heavier than ${LIMIT} grams goes back on the line, unchanged. ${LIMIT} grams or less goes in the bin. Nothing is remembered from one candy to the next. Engineers call this a filter.` },
    { id: "pricer", label: "The price", stations: [{ kind: "price", x: 4.6 }],
      story: `One candy in, one candy out. The worker wraps each candy and works out a new number from the old one: ${RATE} cents for every gram. The flavor and the time stay the same, and again nothing is remembered. Engineers call this a transform.` },
    { id: "both", label: "The whole line", stations: [{ kind: "filter", x: 2.9 }, { kind: "price", x: 6.9 }],
      story: "Workers stand in a row and each one does a small job: the first takes out the light candies, the second wraps and prices the rest. Every candy is still handled on its own. That is why this line can stop and start again at any candy, with nothing to remember. Engineers call such work stateless." },
  ];

  let k, F, P, U, rnd, sc, L, line, ship, hands, items, stations, nextBorn, lightRun, lastFlavor, counts;
  const ease = (u) => { const v = Math.max(0, Math.min(1, u)); return v * v * (3 - 2 * v); };

  function station(def, i) {
    const PAL = k.PAL, look = { watch: 0, filter: 1, price: 2 }[def.kind], coat = { watch: PAL.green, filter: PAL.blue, price: PAL.red }[def.kind];
    const st = { ...def, who: F.worker(L, { x: def.x, y: BY - F.GAP, look, coat, phase: i * 1.7 }), cur: null, pick: def.x - 0.1 };
    if (def.kind === "filter") st.bin = F.bin(L, def.x + 0.1, BY + 1.2, 1.2, 1.0, 0.7, PAL.red);
    return st;
  }

  function newCandy(born) {
    let light = rnd() < 0.3;
    if (light && lightRun >= 2) light = false;
    lightRun = light ? lightRun + 1 : 0;
    const grams = light ? 22 + Math.floor(rnd() * 9) : 31 + Math.floor(rnd() * 9);      // 22 to 30, or 31 to 39
    let fl = F.FLAVORS[Math.floor(rnd() * 3)];
    if (fl === lastFlavor && rnd() < 0.6) fl = F.FLAVORS[(F.FLAVORS.indexOf(fl) + 1) % 3];
    lastFlavor = fl;
    const it = F.thing(L.candy, { flavor: fl, small: light, flag: grams + " g" }); it.grams = grams; it.born = born; it.state = "line"; it.done = 0;
    items.push(it);
    return it;
  }
  const gap = () => (rnd() < 0.2 ? 0.95 + rnd() * 0.2 : 1.4 + rnd() * 2.1);    // candies come unevenly, sometimes two close together

  /* what a worker does to the candy in hand */
  function work(it, st, now, quiet) {
    if (st.kind === "watch") { if (!quiet) counts.seen++; return; }
    if (st.kind === "price") { it.wrapped = true; it.flag = it.grams * RATE + "¢"; F.redraw(it); if (!quiet) counts.priced++; return; }
    if (it.grams > LIMIT) { if (!quiet) counts.passed++; return; }
    it.state = "out";
    if (quiet) it.el.remove(); else { it.el.classList.remove("busy"); F.drop(it, it.pos, st.bin, now); st.toss = it; st.let = now; counts.light++; }
  }

  function place(it, now) {
    if (it.state !== "line") return;
    const x = F.V * (now - it.born), next = stations[it.done];
    if (!it.act && next && x >= next.pick) { it.act = { st: next, t0: now, did: false }; next.cur = it; it.done++; }
    let p = P(x, BY, F.TOP), o = {};
    if (it.act) {
      const a = it.act, u = (now - a.t0) / HOLD;
      if (a.st.kind !== "watch") {
        // off the line and up to the chest, worked on there, then down again a little further along, where the line has moved to meanwhile
        const from = P(a.st.pick, BY, F.TOP), to = P(a.st.pick + F.V * HOLD, BY, F.TOP), c = a.st.who.chest(it.r * U);
        const up = ease(u / 0.3), down = ease((u - 0.7) / 0.3), q = u < 0.5 ? [from[0] + (c[0] - from[0]) * up, from[1] + (c[1] - from[1]) * up] : [c[0] + (to[0] - c[0]) * down, c[1] + (to[1] - c[1]) * down];
        p = [q[0], q[1] - 5 * Math.sin(Math.PI * (u < 0.5 ? up : down))];
        it.clear = a.st.pick + F.V * HOLD + 0.75;
        o = { air: u > 0.06 && u < 0.94, low: u > 0.06, busy: u > 0.3 && u < 0.7, rot: a.st.kind === "price" && u > 0.3 && u < 0.7 ? 10 * Math.sin((u - 0.3) * Math.PI * 7.5) : 0 };
      }
      if (u >= 0.5 && !a.did) { a.did = true; work(it, a.st, now, false); if (it.state !== "line") { a.st.cur = null; return; } }
      if (u >= 1) { it.act = null; if (a.st.cur === it) a.st.cur = null; p = P(x, BY, F.TOP); o = {}; }
    }
    if (!it.act && it.clear) { if (x < it.clear) o.low = true; else it.clear = null; }     // its tag stays low until it is clear of the worker
    if (x >= X1) { it.state = "out"; F.drop(it, P(X1, BY, F.TOP), ship, now); return; }
    F.put(it, p, o);
    it.el.style.opacity = Math.max(0, Math.min(1, (x - 0.05) / 0.3));
  }

  function workers(now, dt) {
    stations.forEach((st) => {
      let h = [null, null];
      const it = st.cur || items.find((c) => c.state === "line" && c.done === stations.indexOf(st) && F.V * (now - c.born) > st.pick - 0.3);    // the next candy is reached for a moment before it is taken
      if (it && it.pos) { const mid = [it.pos[0], it.pos[1] - it.r * U]; h = st.kind === "watch" ? [[mid[0], mid[1] - it.r * U], null] : F.grip(mid, it.r * U * 0.85); }
      else if (st.toss && now - st.let < 0.16 && st.toss.pos) h = [[st.toss.pos[0], st.toss.pos[1] - 12], null];     // the hand follows a candy it throws away
      st.who.pose(now, dt, h);
    });
  }

  /* labels: each scene names only what it is about */
  function labels() {
    const first = stations[0], last = stations[stations.length - 1], head = (st) => [st.who.foot[0] + 15 * F.MAN, st.who.foot[1] - 60 * F.MAN];
    const list = [
      { title: "KITCHEN", note: "candies come out one by one", x: 56, y: 150, side: "start", to: P(0, BY + 0.3, 1.6) },
      { title: "CANDY", note: "its flavor, and its weight on a tag", x: 56, y: 486, side: "start", to: P(1.5, BY + 0.5, F.TOP) },
      { title: "CLOCK", note: "every candy has its moment", x: 1344, y: 130, side: "end", to: P(CLOCK[0] + 0.45, 0, CLOCK[1] + 0.2) },
      { title: "SHIPPING", note: "out as soon as it is ready", x: 1344, y: 650, side: "end", to: P(X1 + 1.9, BY + 0.2, 0.55) },
    ];
    const who = (st, title, note, y) => list.push({ title, note, x: 1344, y, side: "end", to: head(st) });
    if (sc.id === "line") who(first, "WORKER", "lets every candy pass as it is", 300);
    if (sc.id === "inspector") who(first, "INSPECTOR", `keeps what is heavier than ${LIMIT} g`, 300);
    if (sc.id === "pricer") who(first, "PRICER", `wraps it and writes ${RATE}¢ a gram`, 300);
    if (sc.id === "both") { who(first, "INSPECTOR", "first job: pick", 250); who(last, "PRICER", "second job: wrap and price", 380); }
    const fl = stations.find((s) => s.bin);
    if (fl) list.push({ title: "TOO LIGHT", note: `${LIMIT} g or less: off the line`, x: 56, y: 660, side: "start", to: P(fl.bin.x - 0.45, fl.bin.y + 0.5, 0.45) });
    k.setLabels(list);
  }

  function init(kit, scene) {
    k = kit; F = Factory(kit); P = kit.P; U = kit.U; sc = scene; rnd = kit.rng(7); F.reset();
    items = []; lightRun = 0; lastFlavor = null; counts = { seen: 0, passed: 0, light: 0, priced: 0 };
    F.room({ window: [1.2, 3.3], clock: CLOCK, door: 11.2 });
    // the moving part of the sheet, back to front
    L = { clock: k.layer(), dolls: k.layer(), belt: k.layer(), under: k.layer(), candy: k.layer(), arms: k.layer(), over: k.layer() };
    hands = F.clockHands(L.clock, CLOCK);
    line = F.belt(L.belt, 0, X1, BY);
    stations = scene.stations.map(station);
    ship = F.bin(L, X1 + 0.4, BY - 0.7, 1.5, 1.4, 0.75, k.PAL.wood);
    k.labelLayer(); labels();
    k.focus([246, 24, 908, 760]);
    // the line is already running when the story opens: candies made in the last seconds are on their way
    nextBorn = -X1 / F.V + 0.4;
    while (nextBorn <= 0) {
      const it = newCandy(nextBorn), x = -F.V * it.born;
      while (it.state === "line" && it.done < stations.length && x >= stations[it.done].pick) work(it, stations[it.done++], 0, true);
      nextBorn += gap();
    }
    tick(0, 0);
  }

  function tick(dt, now) {
    while (nextBorn <= now) { newCandy(nextBorn); nextBorn += gap(); }
    items.forEach((it) => place(it, now));
    items = items.filter((it) => it.state === "line");
    F.run(now);
    workers(now, dt);
    line.update(now); hands(now);
  }

  function status() {
    const n = (v, one, many) => `${v} ${v === 1 ? one : many}`;
    if (sc.id === "line") return n(counts.seen, "candy", "candies") + " so far";
    if (sc.id === "inspector") return `${counts.passed} passed · ${counts.light} too light`;
    if (sc.id === "pricer") return `${counts.priced} priced`;
    return `${counts.priced} priced · ${counts.light} too light`;
  }

  Story.start({ scenes: SCENES, init, tick, status });
})();

</script>
