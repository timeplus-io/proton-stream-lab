<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Candy Line</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A small candy factory shows what a stream is and what a worker on it does: filter and transform, one candy at a time.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Young+Serif&display=swap">
<style>
/* Stream Stories: the same ideas as the Stream Lab, told as a small factory for readers who are not engineers.
   A paper page, a hand-lettered voice and one diorama. */
:root {
  --paper: #F9F5EC; --grid: rgba(70, 62, 50, 0.06); --ink: #2B2826; --soft: #6F675C; --line: #8C8377;
  --panel: #FFFDF7; --accent: #C4604F; --on-accent: #FFFDF7; --rail: #E7D7AC;
  --font-title: "Young Serif", Georgia, "Times New Roman", serif;
  --font-hand: "Patrick Hand", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1D1B18; --grid: rgba(240, 230, 210, 0.05); --ink: #F3ECDF; --soft: #B5AC9D; --line: #8C8377;
    --panel: #26231F; --accent: #E0806E; --on-accent: #1D1B18; --rail: #5A5140; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1D1B18; --grid: rgba(240, 230, 210, 0.05); --ink: #F3ECDF; --soft: #B5AC9D; --line: #8C8377;
  --panel: #26231F; --accent: #E0806E; --on-accent: #1D1B18; --rail: #5A5140; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background-color: var(--paper); color: var(--ink); font-family: var(--font-hand); font-size: 19px; line-height: 1.35;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 44px 44px;
}
.page {
  max-width: 1240px; margin: 0 auto; padding-block: 30px 36px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 10px;
}
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px 28px; }
.eyebrow { font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
h1 { font: 400 clamp(34px, 6vw, 60px)/1 var(--font-title); margin: 2px 0 6px; letter-spacing: -0.02em; text-wrap: balance; }
.sub { margin: 0; font-size: 21px; letter-spacing: .06em; color: var(--ink); }
.now { text-align: right; display: grid; gap: 0; justify-items: end; margin-left: auto; }
.now .time { font-size: 34px; letter-spacing: .08em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.now .status { font-size: 19px; letter-spacing: .05em; color: var(--ink); }

.stage { position: relative; }
.stage.compact .tag, .stage.compact svg.leaders { display: none; }
.stage canvas { display: block; width: 100%; }
.stage svg.leaders { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.leaders path { fill: none; stroke: var(--line); stroke-width: 1; }
.leaders circle { fill: var(--paper); stroke: var(--line); stroke-width: 1; }
.tag { position: absolute; max-width: 17.5%; pointer-events: none; }
.tag.right { text-align: right; }
.tag b { display: block; font-weight: 400; font-size: 22px; letter-spacing: .12em; text-transform: uppercase; line-height: 1.15; }
.tag span { display: block; font-size: 18px; letter-spacing: .05em; color: var(--soft); line-height: 1.2; }
.nogl { padding: 60px 20px; text-align: center; color: var(--soft); }

.steps { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.steps .seg { display: flex; flex-wrap: wrap; gap: 8px; }
.steps button {
  font: inherit; font-size: 19px; letter-spacing: .05em; cursor: pointer; color: var(--ink);
  background: var(--panel); border: 1.5px solid var(--line); border-radius: 999px; padding: 5px 16px 6px;
}
.steps button i { font-style: normal; color: var(--soft); margin-right: 6px; }
.steps button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.steps button[aria-pressed="true"] i { color: var(--rail); }
.steps button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.steps .spacer { flex: 1; }
.steps #play { background: var(--accent); color: var(--on-accent); border-color: var(--accent); min-width: 92px; }
.story { margin: 4px 0 0; font-size: 23px; line-height: 1.35; max-width: 62ch; text-wrap: pretty; }
.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 20px; font-size: 17px; letter-spacing: .04em; color: var(--soft); margin-top: 6px; }
.foot a { color: inherit; }

</style>
</head>
<body>
<div class="page">
  <div class="head">
    <header>
      <div class="eyebrow">Stream stories · 01</div>
      <h1>The candy line</h1>
      <p class="sub">one line · one clock · no last candy</p>
    </header>
    <div class="now" aria-live="off">
      <div class="time" id="time">12:00:00</div>
      <div class="status" id="status"></div>
    </div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="steps">
    <div class="seg" id="scenes" role="group" aria-label="Story steps"></div>
    <span class="spacer"></span>
    <button id="play" type="button">Pause</button>
  </div>
  <p class="story" id="story"></p>
  <div class="foot"><span>Illustrative: a made-up factory.</span><span class="links"><a href="01-transform.html">For engineers: Stateless transform</a></span></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* Stream Stories, shared kit (needs three.js r128 as the global THREE).
   One diorama seen from a fixed isometric camera: flat colors, thin ink outlines, soft shadows.
   An episode supplies scenes, init(kit, scene) and tick(dt, now); the story runs until the reader presses Pause. */
const Story = (() => {
  const INK = 0x3b3632;
  const C = {
    floor: 0xe9e1d0, base: 0xb9a07a, wall: 0xf5f0e6, belt: 0x5f5b58, slat: 0x77726d, frame: 0xa9b1b5, leg: 0x7c858b,
    wood: 0xd3ab78, woodDark: 0xb58c5a, white: 0xfbf8f1, dark: 0x4a4541, glass: 0xbfd6dc,
    a: 0xd9793b, b: 0x4ba39b, c: 0x9270c4, red: 0xc4604f, yellow: 0xe3b64f, blue: 0x5e7fa8, green: 0x7fa56b,
    skin: [0xe9b994, 0xc98f6b, 0x8e5b3f], hair: [0x2e2622, 0x5a3a26, 0x8f8a84],
  };
  const BASE = 12 * 3600;
  const hms = (t) => {
    const d = Math.floor(BASE + t + 1e-6);
    return [Math.floor(d / 3600), Math.floor((d % 3600) / 60), d % 60].map((n) => String(n).padStart(2, "0")).join(":");
  };
  function rng(seed) {
    let a = seed >>> 0;
    return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  /* ----- drawing: every solid is a flat color with an ink outline ----- */
  const mats = new Map();
  const mat = (color) => { if (!mats.has(color)) mats.set(color, new THREE.MeshLambertMaterial({ color })); return mats.get(color); };
  const inkMat = new THREE.LineBasicMaterial({ color: INK });
  function solid(geo, color, o = {}) {
    const m = new THREE.Mesh(geo, mat(color));
    m.castShadow = o.cast !== false; m.receiveShadow = true;
    if (o.ink !== false) m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, o.angle ?? 30), inkMat));
    return m;
  }
  /* a box that stands on y = 0 */
  function box(w, h, d, color, o) { const g = new THREE.BoxGeometry(w, h, d); g.translate(0, h / 2, 0); return solid(g, color, o); }
  /* a cylinder (or cone) that stands on y = 0 */
  /* Round things get their outline from a slightly larger ink shell seen from behind. */
  const hullMat = new THREE.MeshBasicMaterial({ color: INK, side: THREE.BackSide });
  const LINE = 0.022;
  function cyl(rt, rb, h, color, o = {}) {
    const g = new THREE.CylinderGeometry(rt, rb, h, o.seg ?? 14); g.translate(0, h / 2, 0);
    const m = solid(g, color, o);
    if (o.ink !== false) { const hg = new THREE.CylinderGeometry(rt + LINE, rb + LINE, h + LINE * 2, o.seg ?? 14); hg.translate(0, h / 2, 0); m.add(new THREE.Mesh(hg, hullMat)); }
    return m;
  }
  function ball(r, color, o = {}) {
    const m = solid(new THREE.SphereGeometry(r, o.seg ?? 18, o.rings ?? 12), color, { ...o, ink: false });
    if (o.ink !== false) m.add(new THREE.Mesh(new THREE.SphereGeometry(r + LINE, o.seg ?? 18, o.rings ?? 12), hullMat));
    return m;
  }
  const at = (obj, x, y, z) => { obj.position.set(x, y, z); return obj; };
  function group(...kids) { const g = new THREE.Group(); kids.forEach((k) => g.add(k)); return g; }

  /* ----- props ----- */
  /* The floor slab: a light top on a darker base, like a slice cut out of a building. Its top is y = 0. */
  function slab(w, d) {
    return group(at(box(w, 0.3, d, C.floor), 0, -0.3, 0), at(box(w, 0.55, d, C.base), 0, -0.85, 0));
  }
  /* Two walls of a cut-away room: the back wall and the left wall, with an opening where a line comes through. */
  function walls(w, d, h, hatch) {
    const t = 0.28, g = new THREE.Group();
    g.add(at(box(w + t, h, t, C.wall), -t / 2, 0, -d / 2 - t / 2));
    const x = -w / 2 - t / 2;
    if (!hatch) g.add(at(box(t, h, d, C.wall), x, 0, 0));
    else {
      const z0 = hatch.z - hatch.w / 2, z1 = hatch.z + hatch.w / 2;
      g.add(at(box(t, h, z0 + d / 2, C.wall), x, 0, (z0 - d / 2) / 2));
      g.add(at(box(t, h, d / 2 - z1, C.wall), x, 0, (z1 + d / 2) / 2));
      g.add(at(box(t, hatch.y0, hatch.w, C.wall), x, 0, hatch.z));
      g.add(at(box(t, h - hatch.y1, hatch.w, C.wall), x, hatch.y1, hatch.z));
      g.add(at(box(0.9, hatch.y1 - hatch.y0 + 0.5, hatch.w + 0.5, C.dark, { ink: false }), x - 0.6, hatch.y0 - 0.25, hatch.z));   // the dark room behind
    }
    return g;
  }
  /* A conveyor from x0 to x1 at depth z. Its slats move with the items, so the line visibly runs. */
  function belt(x0, x1, z, speed, o = {}) {
    const top = o.top ?? 1.05, w = o.w ?? 1.15, L = x1 - x0, g = new THREE.Group();
    g.add(at(box(L, 0.2, w + 0.16, C.frame), (x0 + x1) / 2, top - 0.26, z));
    g.add(at(box(L, 0.06, w, C.belt, { ink: false }), (x0 + x1) / 2, top - 0.06, z));
    for (let x = x0 + 0.7; x < x1; x += 2.2) [-1, 1].forEach((s) => g.add(at(box(0.14, top - 0.26, 0.14, C.leg), x, 0, z + s * (w / 2 - 0.05))));
    g.add(at(cyl(0.16, 0.16, w + 0.16, C.leg, { seg: 10 }), x1, top - 0.16, z - (w + 0.16) / 2).rotateX(Math.PI / 2));
    const gap = 0.55, slats = [];
    for (let i = 0; i < Math.floor(L / gap); i++) { const s = box(0.05, 0.012, w - 0.1, C.slat, { ink: false, cast: false }); s.position.set(0, top, z); g.add(s); slats.push(s); }
    const n = slats.length;
    return { group: g, top, z, x0, x1, update(now) { slats.forEach((s, i) => { s.position.x = x0 + (((i * gap + now * speed) % (n * gap)) + n * gap) % (n * gap); }); } };
  }
  /* A small person. look: 0..2 picks skin and hair; coat is the color of the work coat. */
  function person(o = {}) {
    const look = o.look ?? 0, g = new THREE.Group(), body = new THREE.Group();
    body.add(cyl(0.2, 0.31, 0.78, o.coat ?? C.blue));
    body.add(at(cyl(0.32, 0.32, 0.06, C.dark, { ink: false }), 0, 0, 0));
    const head = at(ball(0.2, C.skin[look]), 0, 0.98, 0);
    const hair = new THREE.Mesh(new THREE.SphereGeometry(0.215, 14, 8, 0, Math.PI * 2, 0, Math.PI * 0.45), mat(C.hair[look]));
    hair.position.set(0, 0.99, -0.02); hair.rotation.x = -0.5;
    const hat = at(cyl(0.17, 0.15, 0.2, C.white), 0, 1.13, 0);
    const eyes = [-1, 1].map((s) => at(ball(0.022, C.dark, { ink: false, cast: false }), s * 0.075, 1.0, 0.185));
    const arms = [-1, 1].map((s) => { const a = new THREE.Group(); a.position.set(s * 0.25, 0.7, 0); a.add(at(box(0.1, 0.36, 0.1, o.coat ?? C.blue), 0, -0.36, 0)); a.add(at(ball(0.065, C.skin[look], { ink: false }), 0, -0.4, 0)); body.add(a); return a; });
    body.add(head, hair, ...eyes); if (o.hat !== false) body.add(hat);
    g.add(body);
    return { group: g, body, head, arms };
  }
  /* A wall clock that faces +z. Its long hand goes round once a minute. */
  function clock(r = 0.62) {
    const g = new THREE.Group();
    const face = cyl(r, r, 0.08, C.white, { seg: 28 }); face.rotation.x = Math.PI / 2; g.add(face);
    const rim = new THREE.Mesh(new THREE.TorusGeometry(r, 0.05, 8, 28), mat(C.dark)); rim.position.z = 0.08; g.add(rim);
    for (let i = 0; i < 12; i++) { const a = (i / 12) * Math.PI * 2, t = at(box(0.03, i % 3 === 0 ? 0.12 : 0.06, 0.01, C.dark, { ink: false, cast: false }), 0, 0, 0); t.position.set(Math.sin(a) * r * 0.8, Math.cos(a) * r * 0.8 - (i % 3 === 0 ? 0.06 : 0.03), 0.09); g.add(t); }
    const hand = (len, w, color) => { const p = new THREE.Group(); p.position.z = 0.1; p.add(box(w, len, 0.012, color, { ink: false, cast: false })); g.add(p); return p; };
    const minute = hand(r * 0.5, 0.05, C.dark), second = hand(r * 0.78, 0.03, C.red);
    g.add(at(ball(0.045, C.dark, { ink: false, cast: false }), 0, 0, 0.11));
    return { group: g, update(now) { second.rotation.z = -(now % 60) / 60 * Math.PI * 2; minute.rotation.z = -((now / 60) % 60) / 60 * Math.PI * 2; } };
  }
  /* An open wooden crate: a floor and four low sides. */
  function crate(w, h, d, color = C.wood) {
    const t = 0.07, g = new THREE.Group();
    g.add(box(w, t, d, C.woodDark));
    [[0, -d / 2 + t / 2, w, t], [0, d / 2 - t / 2, w, t], [-w / 2 + t / 2, 0, t, d], [w / 2 - t / 2, 0, t, d]].forEach(([x, z, sw, sd]) => g.add(at(box(sw, h, sd, color), x, 0, z)));
    return g;
  }

  /* ----- the stage: renderer, camera, labels ----- */
  let renderer, scene, camera, world, stageEl, leaders, tags = [], fit = null, raw = null;
  const AZ = Math.PI / 4, EL = (30 * Math.PI) / 180;
  const DIR = new THREE.Vector3(Math.cos(EL) * Math.sin(AZ), Math.sin(EL), Math.cos(EL) * Math.cos(AZ));

  function setup(el) {
    stageEl = el;
    try { renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); } catch (e) { renderer = null; }
    if (!renderer) { el.innerHTML = '<p class="nogl">This story needs WebGL, which is not available in this browser.</p>'; return false; }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    el.appendChild(renderer.domElement);
    renderer.domElement.setAttribute("role", "img");
    renderer.domElement.setAttribute("aria-label", "Animated factory diorama");
    leaders = document.createElementNS("http://www.w3.org/2000/svg", "svg"); leaders.setAttribute("class", "leaders"); el.appendChild(leaders);
    scene = new THREE.Scene();
    scene.add(new THREE.AmbientLight(0xffffff, 0.36));
    scene.add(new THREE.HemisphereLight(0xffffff, 0xd9cdb6, 0.45));
    const sun = new THREE.DirectionalLight(0xfff4e0, 0.34);
    sun.position.set(6, 14, 9); sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { left: -13, right: 13, top: 10, bottom: -10, near: 1, far: 40 });
    sun.shadow.bias = -0.0015; sun.shadow.radius = 3;
    scene.add(sun);
    camera = new THREE.OrthographicCamera(-10, 10, 6, -6, 0.1, 100);
    world = new THREE.Group(); scene.add(world);
    window.addEventListener("resize", layout);
    return true;
  }
  /* Frame the diorama: box = [x0, x1, y0, y1, z0, z1] in world units, padX = empty paper left and right for the labels. */
  function frame(box, padX = 0.24, padY = 0.05) {
    const [x0, x1, y0, y1, z0, z1] = box, c = new THREE.Vector3((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
    camera.position.copy(c).addScaledVector(DIR, 40); camera.up.set(0, 1, 0); camera.lookAt(c); camera.updateMatrixWorld();
    const inv = camera.matrixWorldInverse; let l = Infinity, r = -Infinity, b = Infinity, t = -Infinity;
    [x0, x1].forEach((x) => [y0, y1].forEach((y) => [z0, z1].forEach((z) => { const v = new THREE.Vector3(x, y, z).applyMatrix4(inv); l = Math.min(l, v.x); r = Math.max(r, v.x); b = Math.min(b, v.y); t = Math.max(t, v.y); })));
    raw = { l, r, b, t, padX, padY };
    layout();
  }
  /* On a wide page the diorama leaves paper on both sides for the labels. On a phone it fills the width and the labels step aside. */
  function layout() {
    if (!renderer || !raw) return;
    const compact = stageEl.clientWidth < 720, w0 = raw.r - raw.l, h0 = raw.t - raw.b, px = compact ? 0.02 : raw.padX;
    stageEl.classList.toggle("compact", compact);
    fit = { l: raw.l - w0 * px, r: raw.r + w0 * px, b: raw.b - h0 * raw.padY, t: raw.t + h0 * raw.padY };
    Object.assign(camera, { left: fit.l, right: fit.r, top: fit.t, bottom: fit.b }); camera.updateProjectionMatrix();
    const w = stageEl.clientWidth, h = Math.round(w * (fit.t - fit.b) / (fit.r - fit.l));
    renderer.setSize(w, h, false); renderer.domElement.style.height = h + "px";
    placeTags();
    if (scene) renderer.render(scene, camera);
  }
  const toScreen = (p) => { const v = new THREE.Vector3(p[0], p[1], p[2]).project(camera), el = renderer.domElement; return [(v.x + 1) / 2 * el.clientWidth, (1 - v.y) / 2 * el.clientHeight]; };
  /* Labels in the paper margin, each tied by a thin line to the thing it names.
     list = [{ title, sub, at: [x, y, z], side: "left" | "right", y: fraction of the stage height }] */
  function setTags(list) {
    tags.forEach((t) => t.el.remove());
    tags = list.map((t) => {
      const el = document.createElement("div"); el.className = "tag " + t.side;
      el.innerHTML = `<b>${t.title}</b><span>${t.sub}</span>`; stageEl.appendChild(el);
      return { ...t, el };
    });
    placeTags();
  }
  function placeTags() {
    if (!renderer) return;
    const W = renderer.domElement.clientWidth, H = renderer.domElement.clientHeight; let d = "";
    tags.forEach((t) => {
      t.el.style.top = t.y * H + "px";
      if (t.side === "left") { t.el.style.left = "4px"; t.el.style.right = ""; } else { t.el.style.right = "4px"; t.el.style.left = ""; }
      const bw = t.el.querySelector("b").getBoundingClientRect().width, r0 = stageEl.getBoundingClientRect(), rb = t.el.querySelector("b").getBoundingClientRect();
      const sy = rb.top - r0.top + rb.height / 2, sx = t.side === "left" ? rb.left - r0.left + bw + 12 : rb.left - r0.left - 12;
      const [ax, ay] = toScreen(t.at), ex = sx + (t.side === "left" ? 26 : -26);
      d += `<path d="M${sx},${sy} H${ex} L${ax},${ay}"/><circle cx="${sx}" cy="${sy}" r="2.6"/><circle cx="${ax}" cy="${ay}" r="2.2"/>`;
    });
    leaders.innerHTML = d;
  }

  /* Take an object off the stage and free what it drew with. */
  function drop(obj) {
    obj.traverse((n) => { if (n.geometry) n.geometry.dispose(); });
    if (obj.parent) obj.parent.remove(obj);
  }

  function start(ep) {
    if (!setup(document.querySelector("#stage"))) return;
    let sceneDef = ep.scenes[0], paused = false, now = 0, last = null;
    const playBtn = document.querySelector("#play"), timeEl = document.querySelector("#time"), statusEl = document.querySelector("#status");
    const kit = { THREE, C, world, box, cyl, ball, at, group, solid, drop, slab, walls, belt, person, clock, crate, frame, setTags, rng };
    function load(s) {
      sceneDef = s; now = 0;
      document.querySelectorAll("#scenes button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.id === s.id ? "true" : "false"));
      document.querySelector("#story").innerHTML = s.story;
      while (world.children.length) drop(world.children[0]);
      ep.init(kit, s);
      draw();
    }
    function draw() {
      timeEl.textContent = hms(now);
      if (ep.status) statusEl.textContent = ep.status();
      renderer.render(scene, camera);
    }
    const seg = document.querySelector("#scenes");
    ep.scenes.forEach((s, i) => {
      const b = document.createElement("button");
      b.type = "button"; b.dataset.id = s.id; b.innerHTML = `<i>${i + 1}</i>${s.label}`;
      b.addEventListener("click", () => load(s)); seg.appendChild(b);
    });
    const setPaused = (p) => { paused = p; playBtn.textContent = p ? "Play" : "Pause"; };
    playBtn.addEventListener("click", () => setPaused(!paused));
    document.addEventListener("keydown", (e) => { if (e.code === "Space" && !e.target.closest("button,input,select")) { e.preventDefault(); setPaused(!paused); } });
    document.addEventListener("visibilitychange", () => { last = null; });
    load(sceneDef);
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) setPaused(true);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeTags);
    function loop(t) {
      requestAnimationFrame(loop);
      if (last == null) { last = t; return; }
      const dt = Math.min(0.05, (t - last) / 1000); last = t;
      if (paused) return;
      now += dt; ep.tick(dt, now); draw();
    }
    requestAnimationFrame(loop);
  }

  return { start, C, hms, rng };
})();

</script>
<script>
/* Story 01, The candy line.
   A stream is a line that never ends, an event is one candy, an operator is a worker on the line.
   The same candies come out of the kitchen in every scene; only the workers change. */
(() => {
  const V = 1.3;                         // belt speed, floor units per second
  const X0 = -7, X1 = 4.9, BZ = 0.8, TOP = 0.9, BW = 0.95;   // the belt: from the hatch to the shipping box
  const R = 0.3, R_SMALL = 0.17, MAN = 1.75, BACK = 1.12;   // candy sizes, worker size, how far behind the line a worker stands
  const FLAVORS = ["a", "b", "c"];
  const PUSH = 0.55, FALL = 0.42, POP = 0.4;
  const CLOCK = [0.4, 3.25];              // where the clock hangs on the back wall

  const SCENES = [
    { id: "line", label: "The line", stations: [{ kind: "watch", x: -1.4 }],
      story: "A stream is like this candy line. It has no last candy. Each one rolls out of the kitchen at its own moment, and the clock on the wall keeps the time. Nobody waits for the batch to be finished, because it never is." },
    { id: "inspector", label: "The inspector", stations: [{ kind: "filter", x: -1.4 }],
      story: "A worker on the line looks at one candy at a time and decides on the spot. Big enough stays on the line. Too small goes in the bin. The worker needs no memory of the candies before. Engineers call this a filter." },
    { id: "wrapper", label: "The wrapper", stations: [{ kind: "wrap", x: -1.4 }],
      story: "This worker changes every candy. One raw candy comes in, one wrapped candy goes out, and the line never stops for it. Engineers call this a transform." },
    { id: "both", label: "The whole line", stations: [{ kind: "filter", x: -3.4 }, { kind: "wrap", x: 1.0 }],
      story: "Workers stand in a row and each one does a small job. Raw candy goes in on the left and finished candy comes out on the right, a moment after it arrived. That is stream processing: the work happens while things move." },
  ];

  let k, C, rnd, sc, belt, wallClock, items, stations, nextBorn, smallRun, lastFlavor, counts;

  /* ----- the room ----- */
  function room() {
    const w = k.world;
    w.add(k.slab(14, 7));
    w.add(k.walls(14, 7, 4.2, { z: BZ, w: 1.7, y0: 0.55, y1: 2.0 }));
    belt = k.belt(X0 - 0.3, X1, BZ, V, { top: TOP, w: BW }); w.add(belt.group);
    wallClock = k.clock(0.66); k.at(wallClock.group, CLOCK[0], CLOCK[1], -3.49); w.add(wallClock.group);
    // on the back wall: a window, a shelf of jars and a door
    w.add(k.at(k.box(2.5, 1.4, 0.05, C.glass), -4.6, 2.1, -3.48));
    w.add(k.at(k.box(0.07, 1.4, 0.07, C.white), -4.6, 2.1, -3.47));
    w.add(k.at(k.box(2.5, 0.07, 0.07, C.white), -4.6, 2.77, -3.47));
    w.add(k.at(k.box(2.3, 0.08, 0.5, C.wood), -1.75, 2.75, -3.24));
    FLAVORS.forEach((f, i) => {
      w.add(k.at(k.cyl(0.2, 0.2, 0.46, C[f]), -2.5 + i * 0.75, 2.83, -3.24));
      w.add(k.at(k.cyl(0.21, 0.21, 0.08, C.white), -2.5 + i * 0.75, 3.29, -3.24));
    });
    w.add(k.at(k.box(1.25, 2.5, 0.06, C.blue), 5.6, 0, -3.47));
    w.add(k.at(k.ball(0.07, C.yellow), 5.15, 1.2, -3.4));
    // spare boxes against the back wall
    w.add(k.at(k.box(1.1, 0.8, 1.0, C.wood), 3.6, 0, -2.85));
    w.add(k.at(k.box(0.85, 0.65, 0.85, C.woodDark), 3.55, 0.8, -2.9).rotateY(0.3));
    // the shipping box at the end of the line
    w.add(holeBox(1.5, 0.62, 1.35, C.wood, X1 + 1.05, BZ));
  }
  /* A box you can drop things into: the dark top reads as an opening. */
  function holeBox(bw, h, d, color, x, z) {
    return k.at(k.group(k.box(bw, h, d, color), k.at(k.box(bw - 0.2, 0.012, d - 0.2, C.dark, { ink: false, cast: false }), 0, h, 0)), x, 0, z);
  }

  function station(def, i) {
    const coat = { watch: C.green, filter: C.blue, wrap: C.red }[def.kind];
    const p = k.person({ look: def.kind === "wrap" ? 2 : def.kind === "filter" ? 1 : 0, coat });
    p.group.scale.setScalar(MAN);
    k.at(p.group, def.x, 0.04, BZ - BACK);
    k.world.add(p.group);
    k.world.add(k.at(k.box(1.5, 0.04, 1.05, C.yellow, { cast: false }), def.x, 0, BZ - BACK));    // the worker's mat
    if (def.kind === "filter") {
      const paddle = k.group(k.at(k.box(0.05, 0.24, 0.05, C.woodDark), 0, -0.62, 0), k.at(k.box(0.2, 0.1, 0.05, C.wood), 0, -0.7, 0));
      p.arms[1].add(paddle);
      k.world.add(holeBox(1.05, 0.6, 1.05, C.red, def.x + 0.6, BZ + 1.75));
    }
    if (def.kind === "wrap") {      // a side table with a roll of wrapping paper
      k.world.add(k.at(k.box(0.9, 0.75, 0.7, C.wood), def.x + 1.45, 0, BZ - BACK - 0.1));
      k.world.add(k.at(k.cyl(0.2, 0.2, 0.6, C.white, { seg: 16 }), def.x + 1.15, 0.97, BZ - BACK - 0.1).rotateZ(-Math.PI / 2));
    }
    return { ...def, p, act: -9, phase: i * 1.7 };
  }

  /* ----- candies ----- */
  function candy(flavor, small) {
    const r = small ? R_SMALL : R;
    return { flavor, small, r, obj: k.group(k.ball(r, C[flavor])), state: "belt", done: 0, wrapped: false, pop: -9 };
  }
  function wrap(it) {
    const r = it.r, col = C[it.flavor];
    [-1, 1].forEach((s) => it.obj.add(k.at(k.cyl(r * 0.62, 0.02, r * 0.75, col, { seg: 10 }), s * r * 0.82, 0, 0).rotateZ(-s * Math.PI / 2)));
    it.obj.add(k.at(k.cyl(r * 1.04, r * 1.04, r * 0.5, C.white, { ink: false, seg: 18 }), -r * 0.25, 0, 0).rotateZ(-Math.PI / 2));
    it.wrapped = true;
  }
  function newCandy(born) {
    let small = rnd() < 0.34;
    if (small && smallRun >= 2) small = false;
    smallRun = small ? smallRun + 1 : 0;
    let f = FLAVORS[Math.floor(rnd() * 3)];
    if (f === lastFlavor && rnd() < 0.6) f = FLAVORS[(FLAVORS.indexOf(f) + 1) % 3];
    lastFlavor = f;
    const it = candy(f, small); it.born = born;
    k.world.add(it.obj); items.push(it);
    return it;
  }
  const gap = () => (rnd() < 0.22 ? 0.8 + rnd() * 0.25 : 1.3 + rnd() * 2.1);    // candies come unevenly, sometimes two close together

  /* A candy meets every worker it has reached. quiet = before the story starts, so nothing is counted or animated. */
  function meet(it, x, now, quiet) {
    while (it.state === "belt" && it.done < stations.length && x >= stations[it.done].x) {
      const st = stations[it.done++];
      if (st.kind === "watch") { if (!quiet) counts.seen++; }
      else if (st.kind === "filter") {
        if (it.small) {
          if (quiet) { it.state = "gone"; } else { it.state = "push"; it.t0 = now; it.from = x; it.to = st.x + 0.6; st.act = now; counts.small++; }
        } else if (!quiet) counts.passed++;
      } else if (st.kind === "wrap") {
        wrap(it);
        if (!quiet) { it.pop = now; st.act = now; counts.wrapped++; }
      }
    }
  }

  function place(it, now) {
    const o = it.obj, x = X0 + V * (now - it.born), y = TOP + it.r;
    if (it.state === "belt") {
      meet(it, x, now, false);
      if (it.state === "belt") {
        if (x >= X1) { it.state = "fall"; it.t0 = now; }
        o.position.set(x, y, BZ);
        const u = (now - it.pop) / POP;
        o.scale.setScalar(u >= 0 && u < 1 ? 1 + 0.4 * Math.sin(Math.PI * u) : 1);
        o.visible = x > X0 - 0.2;
        return;
      }
    }
    if (it.state === "push") {              // off the line, over the edge and into the bin
      const u = (now - it.t0) / PUSH;
      if (u >= 1.3) { it.state = "gone"; return; }
      const e = Math.min(1, u), drop = Math.max(0, u - 1) / 0.3;
      o.position.set(it.from + (it.to - it.from) * e, y + (0.6 + it.r - y) * e * e + 0.5 * Math.sin(Math.PI * e) - drop * 0.5, BZ + 1.75 * e);
      return;
    }
    if (it.state === "fall") {              // off the end of the line, into the shipping box
      const u = (now - it.t0) / FALL;
      if (u >= 1.35) { it.state = "gone"; return; }
      o.position.set(X1 + 1.0 * Math.min(1, u), y - (y - 0.4) * u * u, BZ);
    }
  }

  function workers(now) {
    stations.forEach((st) => {
      // the candy this worker is dealing with: the nearest one that has not gone past yet
      let near = 9;
      items.forEach((it) => { if (it.state !== "belt") return; const d = st.x - (X0 + V * (now - it.born)); if (d > -0.5 && Math.abs(d) < Math.abs(near)) near = d; });
      const busy = Math.max(0, 1 - (now - st.act) / 0.5);
      const ready = st.kind === "watch" ? 0 : Math.max(0, 1 - Math.abs(near) / 0.9) * 0.55;
      const reach = Math.max(busy, ready);
      const b = st.p.body;
      b.position.y = Math.sin(now * 2.2 + st.phase) * 0.012;
      b.rotation.y = Math.max(-0.6, Math.min(0.6, -near * 0.3));
      b.rotation.x = 0.06 + 0.2 * reach;
      st.p.arms[0].rotation.x = -0.3 - (st.kind === "wrap" ? 1.0 : 0.25) * reach;
      st.p.arms[1].rotation.x = -0.3 - 1.0 * reach - (st.kind === "filter" ? 0.5 * busy : 0);
    });
  }

  /* ----- labels: each scene names only what it is about ----- */
  function tags() {
    const first = stations[0], last = stations[stations.length - 1];
    const list = [
      { title: "Kitchen", sub: "candies come out one by one", at: [X0, 1.5, BZ], side: "left", y: 0.2 },
      { title: "The line", sub: "never stops, never ends", at: [X0 + 2.2, TOP, BZ + 0.3], side: "left", y: 0.5 },
      { title: "Clock", sub: "every candy has its moment", at: [CLOCK[0], CLOCK[1], -3.4], side: "right", y: 0.12 },
      { title: "Shipping", sub: "out as soon as it is ready", at: [X1 + 1.5, 0.62, BZ + 0.3], side: "right", y: 0.8 },
    ];
    const who = (st, title, sub, y) => list.push({ title, sub, at: [st.x + 0.25, 1.75, BZ - BACK], side: "right", y });
    if (sc.id === "line") who(first, "Worker", "sees each candy as it passes", 0.4);
    if (sc.id === "inspector") who(first, "Inspector", "one look, one decision", 0.4);
    if (sc.id === "wrapper") who(first, "Wrapper", "one in, one out, changed", 0.4);
    if (sc.id === "both") { who(first, "Inspector", "first job: pick", 0.33); who(last, "Wrapper", "second job: wrap", 0.55); }
    const bin = stations.find((s) => s.kind === "filter");
    if (bin) list.push({ title: "Too small", sub: "off the line, for good", at: [bin.x + 0.3, 0.62, BZ + 2.2], side: "left", y: 0.8 });
    k.setTags(list);
  }

  function init(kit, scene) {
    k = kit; C = kit.C; sc = scene; rnd = kit.rng(7);
    items = []; smallRun = 0; lastFlavor = null; counts = { seen: 0, passed: 0, small: 0, wrapped: 0 };
    room();
    stations = scene.stations.map(station);
    // the line is already running when the story opens: candies made in the last seconds are on their way
    nextBorn = -(X1 - X0) / V + 0.4;
    while (nextBorn <= 0) { const it = newCandy(nextBorn); meet(it, X0 + V * (0 - it.born), 0, true); nextBorn += gap(); }
    k.frame([-7.3, 7, -0.85, 4.2, -3.8, 3.5], 0.3, 0.04);
    tags();
    tick(0, 0);
  }

  function tick(dt, now) {
    while (nextBorn <= now) { newCandy(nextBorn); nextBorn += gap(); }
    items.forEach((it) => place(it, now));
    items = items.filter((it) => { if (it.state === "gone") k.drop(it.obj); return it.state !== "gone"; });
    workers(now);
    belt.update(now); wallClock.update(now);
  }

  function status() {
    const n = (v, one, many) => `${v} ${v === 1 ? one : many}`;
    if (sc.id === "line") return n(counts.seen, "candy", "candies") + " so far";
    if (sc.id === "inspector") return `${counts.passed} passed · ${counts.small} too small`;
    if (sc.id === "wrapper") return `${counts.wrapped} wrapped`;
    return `${counts.wrapped} wrapped · ${counts.small} too small`;
  }

  Story.start({ scenes: SCENES, init, tick, status });
})();

</script>
