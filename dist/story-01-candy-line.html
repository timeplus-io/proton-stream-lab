<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Candy Line</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A small candy factory shows what a stream is and what a worker on it does: filter and transform, one candy at a time.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Young+Serif&display=swap">
<style>
/* Stream Stories: the same ideas as the Stream Lab, told as a small factory for readers who are not engineers.
   Layout: one sheet of cream paper lies on the page and holds the title, the clock time and the drawing; the buttons and the caption sit under it. */
:root {
  /* the page around the sheet follows the reader's theme */
  --page: #E8DFCE; --text: #2B2826; --muted: #6A6257; --rule: #8C8377; --panel: #FBF7EE; --accent: #C4604F; --on-accent: #FFFDF7; --pressed: #2B2826; --on-pressed: #FAF5EA;
  /* the sheet is paper: it looks the same in light and dark */
  --paper: #FAF5EA; --ink: #2B2826; --pencil: #6F675C; --lead: #8C8377; --sheet-accent: #C4604F;
  --font-title: "Young Serif", Georgia, "Times New Roman", serif;
  --font-hand: "Patrick Hand", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #1F1C19; --text: #F3ECDF; --muted: #B5AC9D; --rule: #8C8377; --panel: #2A2622; --accent: #E0806E; --on-accent: #1F1C19; --pressed: #F3ECDF; --on-pressed: #1F1C19; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #1F1C19; --text: #F3ECDF; --muted: #B5AC9D; --rule: #8C8377; --panel: #2A2622; --accent: #E0806E; --on-accent: #1F1C19; --pressed: #F3ECDF; --on-pressed: #1F1C19; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--page); color: var(--text); font-family: var(--font-hand); font-size: 19px; line-height: 1.35; }
.page {
  max-width: 1240px; margin: 0 auto; padding-block: 22px 34px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 12px;
}
.sheet { background: var(--paper); color: var(--ink); box-shadow: 3px 4px 0 rgba(60, 48, 36, 0.16); display: grid; gap: 0; padding: clamp(14px, 3vw, 34px) clamp(14px, 3vw, 38px) 12px; min-width: 0; }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 10px 28px; }
.eyebrow { font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--sheet-accent); }
h1 { font: 400 clamp(34px, 6vw, 60px)/1 var(--font-title); margin: 2px 0 6px; letter-spacing: -0.02em; text-wrap: balance; }
.sub { margin: 0; font-size: 21px; letter-spacing: .06em; }
.now { text-align: right; display: grid; gap: 0; justify-items: end; margin-left: auto; }
.now .time { font-size: 34px; letter-spacing: .08em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.now .status { font-size: 19px; letter-spacing: .05em; }
.note { font-size: 16px; letter-spacing: .04em; color: var(--pencil); margin: 0; }

.stage { position: relative; aspect-ratio: 1400 / 800; margin-inline: clamp(-38px, -3vw, -14px); }
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage .ink { fill: none; stroke: #3a3531; stroke-linecap: round; stroke-linejoin: round; }
.stage .ink-f { stroke: #3a3531; }
.stage .ink.thin { vector-effect: non-scaling-stroke; stroke-width: 1px; }
.stage line.ink.thin { stroke-width: inherit; }
.stage .lab-t { font: 400 23px var(--font-hand); letter-spacing: .13em; fill: var(--ink); }
.stage .lab-n { font: 400 18.5px var(--font-hand); letter-spacing: .05em; fill: var(--pencil); }
.stage .sign { font: 400 21px var(--font-hand); letter-spacing: .16em; fill: var(--ink); }
.stage .lead { fill: none; stroke: var(--lead); stroke-width: 1; }
.stage .ring { fill: var(--paper); stroke: var(--lead); stroke-width: 1; }
.stage .air .cs { display: none; }
.stage.compact .labels { display: none; }

.steps { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.steps .seg { display: flex; flex-wrap: wrap; gap: 8px; }
.steps button {
  font: inherit; font-size: 19px; letter-spacing: .05em; cursor: pointer; color: var(--text);
  background: var(--panel); border: 1.5px solid var(--rule); border-radius: 999px; padding: 5px 16px 6px;
}
.steps button i { font-style: normal; color: var(--muted); margin-right: 6px; }
.steps button[aria-pressed="true"] { background: var(--pressed); color: var(--on-pressed); border-color: var(--pressed); }
.steps button[aria-pressed="true"] i { color: inherit; opacity: .6; }
.steps button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.steps .spacer { flex: 1; }
.steps #play { background: var(--accent); color: var(--on-accent); border-color: var(--accent); min-width: 92px; }
.story { margin: 0; font-size: 23px; line-height: 1.35; max-width: 62ch; text-wrap: pretty; }
.foot { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px 20px; font-size: 17px; letter-spacing: .04em; color: var(--muted); }
.foot a { color: inherit; }

</style>
</head>
<body>
<div class="page">
  <div class="sheet">
    <div class="head">
      <header>
        <div class="eyebrow">Stream stories · 01</div>
        <h1>The candy line</h1>
        <p class="sub">one line · one clock · no last candy</p>
      </header>
      <div class="now" aria-live="off">
        <div class="time" id="time">12:00:00</div>
        <div class="status" id="status"></div>
      </div>
    </div>
    <div class="stage" id="stage"></div>
    <p class="note">Illustrative: a made-up factory.</p>
  </div>
  <div class="steps">
    <div class="seg" id="scenes" role="group" aria-label="Story steps"></div>
    <span class="spacer"></span>
    <button id="play" type="button">Pause</button>
  </div>
  <p class="story" id="story"></p>
  <div class="foot"><span class="links"><a href="01-transform.html">For engineers: Stateless transform</a></span></div>
</div>
<script>
/* Stream Stories, shared kit: one hand-drawn sheet in plain SVG, no libraries.
   Everything is drawn twice, the way a marker sketch is made: a soft wash of colour with paper tooth in it,
   then a thin ink line that bows a little and runs past its corners. The scene is isometric but flat:
   P(x, y, z) turns a place in the room into a point on the sheet. People are small paper dolls that face the reader.
   An episode supplies scenes, init(kit, scene) and tick(dt, now); the story runs until the reader presses Pause. */
const Story = (() => {
  const NS = "http://www.w3.org/2000/svg";
  const W = 1400, H = 800;
  const INK = "#3a3531";
  const PAL = {
    paper: "#faf5ea", floor: "#f1e7d2", wall: "#f6eedd", wood: "#dcbd90", woodDark: "#c19f72", base: "#c9aa7f",
    steel: "#c3c8c9", belt: "#8f8881", dark: "#4f4944", glass: "#bfd6d8", white: "#fefbf3",
    a: "#e59a62", b: "#72bbb0", c: "#ac92d6", red: "#d67c6c", yellow: "#ecc96e", blue: "#86a3c6", green: "#9dbb88", pink: "#efb9b3",
    skin: ["#f3ceac", "#dca97f", "#b07a57"], hair: ["#3f332d", "#7d4d2e", "#a59e95"],
  };
  const BASE = 12 * 3600;
  const hms = (t) => {
    const d = Math.floor(BASE + t + 1e-6);
    return [Math.floor(d / 3600), Math.floor((d % 3600) / 60), d % 60].map((n) => String(n).padStart(2, "0")).join(":");
  };
  function rng(seed) {
    let a = seed >>> 0;
    return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  let rand = rng(1);
  const f = (n) => Math.round(n * 10) / 10;
  function mix(a, b, t) {
    const p = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16)), A = p(a), B = p(b);
    return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, "0")).join("");
  }
  const lighter = (c, t = 0.4) => mix(c, "#fffaf0", t), darker = (c, t = 0.2) => mix(c, "#7a6753", t);

  /* ----- the isometric room: x runs down and right, y down and left, z up ----- */
  const CS = Math.cos(Math.PI / 6), SN = 0.5, U = 52, OX = 551, OY = 236;
  const P = (x, y, z = 0) => [OX + (x - y) * CS * U, OY + (x + y) * SN * U - z * U];

  /* ----- ink: every straight edge is ruled by hand, so it bows a little and overshoots ----- */
  function stroke(a, b, o = {}) {
    const over = o.over ?? 2.4, amp = o.amp ?? 0.9, dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
    const o1 = over * rand(), o2 = over * rand(), bow = (rand() - 0.5) * 2 * amp * Math.min(1, L / 70);
    const A = [a[0] - ux * o1, a[1] - uy * o1], B = [b[0] + ux * o2, b[1] + uy * o2];
    return `M${f(A[0])} ${f(A[1])}Q${f((A[0] + B[0]) / 2 - uy * bow)} ${f((A[1] + B[1]) / 2 + ux * bow)} ${f(B[0])} ${f(B[1])}`;
  }
  const attr = (o) => ` stroke-width="${o.w ?? 1.25}"${o.col ? ` style="stroke:${o.col}"` : ""}${o.op ? ` opacity="${o.op}"` : ""}`;
  const edges = (pairs, o = {}) => `<path class="ink" d="${pairs.map(([a, b]) => stroke(a, b, o)).join("")}"${attr(o)}/>`;
  const loop = (pts, o) => edges(pts.map((p, i) => [p, pts[(i + 1) % pts.length]]), o);
  /* a smooth line through points, for round things and leader lines */
  function curve(pts, closed = false) {
    const n = pts.length, g = (i) => (closed ? pts[(i + n) % n] : pts[Math.max(0, Math.min(n - 1, i))]);
    let d = `M${f(pts[0][0])} ${f(pts[0][1])}`;
    for (let i = 0; i < (closed ? n : n - 1); i++) {
      const p0 = g(i - 1), p1 = g(i), p2 = g(i + 1), p3 = g(i + 2);
      d += `C${f(p1[0] + (p2[0] - p0[0]) / 6)} ${f(p1[1] + (p2[1] - p0[1]) / 6)} ${f(p2[0] - (p3[0] - p1[0]) / 6)} ${f(p2[1] - (p3[1] - p1[1]) / 6)} ${f(p2[0])} ${f(p2[1])}`;
    }
    return d + (closed ? "Z" : "");
  }
  /* ----- wash: flat colour laid a touch off the line, with the paper showing through ----- */
  const tooth = (d) => `<path d="${d}" fill="url(#tooth)"/>`;
  function wash(pts, col, o = {}) {
    const j = o.j ?? 0.9, dx = (rand() - 0.5) * 1.4, dy = (rand() - 0.5) * 1.4;
    const d = "M" + pts.map((p) => f(p[0] + dx + (rand() - 0.5) * j) + " " + f(p[1] + dy + (rand() - 0.5) * j)).join("L") + "Z";
    return `<path d="${d}" fill="${col}"/>` + tooth(d);
  }
  /* a shape given as path data: washed, then inked */
  const shape = (d, col, w = 1.4) => `<path d="${d}" fill="${col}"/>${tooth(d)}<path class="ink" d="${d}" stroke-width="${w}"/>`;
  const dot = (x, y, r, col, w = 1.2) => `<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="${col}"${w ? ` class="ink-f" stroke-width="${w}"` : ""}/>`;
  const shadow = (pts, op = 0.13) => `<path d="M${pts.map((p) => f(p[0]) + " " + f(p[1])).join("L")}Z" fill="#5c5247" opacity="${op}"/>`;

  /* ----- solids ----- */
  /* A box standing at (x, y, z), w along x, d along y, h high. col is the face that looks down and right. */
  function box(x, y, z, w, d, h, col, o = {}) {
    const t = [P(x, y, z + h), P(x + w, y, z + h), P(x + w, y + d, z + h), P(x, y + d, z + h)], b1 = P(x + w, y, z), b2 = P(x + w, y + d, z), b3 = P(x, y + d, z);
    return wash(t, o.top ?? lighter(col)) + wash([t[1], t[2], b2, b1], col) + wash([t[3], t[2], b2, b3], o.side ?? darker(col))
      + edges([[t[0], t[1]], [t[1], t[2]], [t[2], t[3]], [t[3], t[0]], [t[1], b1], [t[2], b2], [t[3], b3], [b1, b2], [b2, b3]], { w: o.w });
  }
  /* An open box you can drop things into. under goes behind what falls in, over goes in front of it. */
  function crate(x, y, z, w, d, h, col) {
    const T = (px, py) => P(px, py, z + h), B = (px, py) => P(px, py, z), in1 = darker(col, 0.45), in2 = darker(col, 0.6);
    const under = wash([B(x, y), B(x + w, y), B(x + w, y + d), B(x, y + d)], darker(col, 0.75)) + wash([T(x, y), T(x, y + d), B(x, y + d), B(x, y)], in1) + wash([T(x, y), T(x + w, y), B(x + w, y), B(x, y)], in2)
      + edges([[T(x, y), T(x + w, y)], [T(x, y), T(x, y + d)], [T(x, y), B(x, y)]], { w: 1.1 });
    const over = wash([T(x + w, y), T(x + w, y + d), B(x + w, y + d), B(x + w, y)], col) + wash([T(x, y + d), T(x + w, y + d), B(x + w, y + d), B(x, y + d)], darker(col))
      + edges([[T(x + w, y), T(x + w, y + d)], [T(x + w, y + d), T(x, y + d)], [T(x + w, y), B(x + w, y)], [T(x + w, y + d), B(x + w, y + d)], [T(x, y + d), B(x, y + d)], [B(x + w, y), B(x + w, y + d)], [B(x + w, y + d), B(x, y + d)]]);
    return { under, over };
  }
  /* An upright cylinder: a can, a jar, a roll. */
  function cyl(x, y, z, r, h, col, o = {}) {
    const c0 = P(x, y, z), c1 = P(x, y, z + h), rx = f(Math.SQRT2 * CS * r * U), ry = f(Math.SQRT2 * SN * r * U);
    const body = `M${f(c1[0] - rx)} ${f(c1[1])}L${f(c0[0] - rx)} ${f(c0[1])}A${rx} ${ry} 0 0 0 ${f(c0[0] + rx)} ${f(c0[1])}L${f(c1[0] + rx)} ${f(c1[1])}A${rx} ${ry} 0 0 1 ${f(c1[0] - rx)} ${f(c1[1])}Z`;
    const top = `M${f(c1[0] - rx)} ${f(c1[1])}A${rx} ${ry} 0 1 0 ${f(c1[0] + rx)} ${f(c1[1])}A${rx} ${ry} 0 1 0 ${f(c1[0] - rx)} ${f(c1[1])}Z`;
    return shape(body, col, o.w ?? 1.2) + shape(top, o.top ?? lighter(col), o.w ?? 1.2);
  }

  /* ----- people: flat paper dolls, feet at (0, 0), about 86 tall with the hat ----- */
  function doll(o = {}) {
    const look = o.look ?? 0, skin = PAL.skin[look], hair = PAL.hair[look], coat = o.coat ?? PAL.blue;
    let h = `<ellipse cx="0" cy="1.5" rx="20" ry="6.5" fill="#8097b8" opacity=".5"/>`;
    [-1, 1].forEach((s) => {
      h += shape(`M${s * 6 - 3.2} -13L${s * 6 - 3.2} -3L${s * 6 + 3.2} -3L${s * 6 + 3.2} -13Z`, "#66738c", 1.2);
      h += shape(`M${s * 6 - 4.4} -3.4Q${s * 6 - 5} 0.8 ${s * 6} 0.8Q${s * 6 + 5} 0.8 ${s * 6 + 4.4} -3.4Z`, "#9a6b4c", 1.2);
    });
    h += shape("M-8.5 -45C-13.5 -45 -15 -40 -16 -34L-20 -15C-21.5 -9 -17 -8.5 -12 -8.5L12 -8.5C17 -8.5 21.5 -9 20 -15L16 -34C15 -40 13.5 -45 8.5 -45Z", coat, 1.5);
    if (o.apron !== false) h += shape("M-6.5 -39L6.5 -39L10.5 -11.5L-10.5 -11.5Z", PAL.white, 1.1);
    h += shape("M-13.6 -57A13.6 13.6 0 1 0 13.6 -57A13.6 13.6 0 1 0 -13.6 -57Z", skin, 1.5);
    h += `<path d="M-13.4 -59C-14 -66 -8 -70.5 0 -70.5C8 -70.5 14 -66 13.4 -59C9 -62.5 4 -63.5 0 -63.5C-4 -63.5 -9 -62.5 -13.4 -59Z" fill="${hair}"/>`;
    h += dot(-5, -55.5, 1.7, INK, 0) + dot(5, -55.5, 1.7, INK, 0);
    h += `<circle cx="-8.6" cy="-51.4" r="3.1" fill="#ee9f97" opacity=".6"/><circle cx="8.6" cy="-51.4" r="3.1" fill="#ee9f97" opacity=".6"/>`;
    h += `<path class="ink" d="M-3 -50.2Q0 -47.6 3 -50.2" stroke-width="1.2"/>`;
    if (o.hat !== false) {
      h += shape("M-10.5 -67C-17.5 -70 -16 -82.5 -6.5 -80.5C-4 -87 6 -87 8 -80.5C16.5 -82.5 17.5 -70 10.5 -67Z", PAL.white, 1.4);
      h += shape("M-11 -70L11 -70L11 -64.5L-11 -64.5Z", PAL.white, 1.2);
    }
    return h;
  }
  /* One arm, hanging from (0, 0). The episode turns it about the shoulder. tool: "paddle" for a small wooden pusher. */
  function arm(o = {}) {
    let h = "";
    if (o.tool === "paddle") h += `<path class="ink" d="M0 22L0 41" stroke-width="2.2" style="stroke:#8a6a48"/>` + shape("M-6.5 38L6.5 38L6.5 48L-6.5 48Z", PAL.wood, 1.2);
    h += shape("M-3.8 0L-3.8 20A3.8 3.8 0 0 0 3.8 20L3.8 0A3.8 3.8 0 0 0 -3.8 0Z", o.coat ?? PAL.blue, 1.3);
    return h + dot(0, 23, 4.1, PAL.skin[o.look ?? 0], 1.2);
  }
  const SHOULDER = [[-13, -39], [13, -39]];   // where the arms hang from, before the doll is scaled

  /* ----- the sheet ----- */
  let stageEl, back, live, labelLayer = null, labels = [], tight = null;
  /* Paper tooth: a small tile of soft noise, made once. Some patches dry lighter and some pool darker, as marker does on paper. */
  function toothTile() {
    const n = 256, c = document.createElement("canvas"); c.width = c.height = n;
    const g = c.getContext("2d"), img = g.createImageData(n, n), r = rng(11);
    const lattice = (m) => {
      const a = new Float32Array(m * m).map(() => r()), v = (i, j) => a[(((j % m) + m) % m) * m + (((i % m) + m) % m)];
      return (x, y) => { const fx = (x / n) * m, fy = (y / n) * m, x0 = Math.floor(fx), y0 = Math.floor(fy), tx = fx - x0, ty = fy - y0, sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty); return (v(x0, y0) * (1 - sx) + v(x0 + 1, y0) * sx) * (1 - sy) + (v(x0, y0 + 1) * (1 - sx) + v(x0 + 1, y0 + 1) * sx) * sy; };
    };
    const n1 = lattice(5), n2 = lattice(12), n3 = lattice(40);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const v = 0.5 * n1(x, y) + 0.3 * n2(x, y) + 0.2 * n3(x, y), grain = r(), i = (y * n + x) * 4, pale = v < 0.44;
      const a = pale ? (0.44 - v) * 0.75 : (v - 0.52) * 0.42;
      img.data[i] = pale ? 255 : 96; img.data[i + 1] = pale ? 250 : 76; img.data[i + 2] = pale ? 238 : 60;
      img.data[i + 3] = Math.max(0, Math.min(1, a + (grain > 0.92 ? 0.035 : 0))) * 255;
    }
    g.putImageData(img, 0, 0);
    return c.toDataURL("image/png");
  }
  function setup(el) {
    stageEl = el;
    const mk = (cls) => { const s = document.createElementNS(NS, "svg"); s.setAttribute("class", cls); s.setAttribute("viewBox", `0 0 ${W} ${H}`); el.appendChild(s); return s; };
    back = mk("back"); live = mk("live");
    back.setAttribute("role", "img"); back.setAttribute("aria-label", "Hand-drawn factory scene");
    window.addEventListener("resize", layout);
  }
  /* On a wide page the whole sheet shows, labels in the margins. On a phone the sheet closes in on the room and the labels step aside. */
  function layout() {
    const compact = stageEl.clientWidth < 720 && tight, v = compact ? tight : [0, 0, W, H];
    stageEl.classList.toggle("compact", !!compact);
    [back, live].forEach((s) => s.setAttribute("viewBox", v.join(" ")));
    stageEl.style.aspectRatio = `${v[2]} / ${v[3]}`;
  }
  const g = (parent, html = "", attrs = "") => { parent.insertAdjacentHTML("beforeend", `<g ${attrs}>${html}</g>`); return parent.lastElementChild; };
  /* the paper: a faint isometric grid and a few pencil crosses */
  function paper() {
    let d = "";
    for (let k = -30; k <= 60; k++) { const a = P(k * 2, -40), b = P(k * 2, 60), c = P(-40, k * 2), e = P(60, k * 2); d += `M${f(a[0])} ${f(a[1])}L${f(b[0])} ${f(b[1])}M${f(c[0])} ${f(c[1])}L${f(e[0])} ${f(e[1])}`; }
    let h = `<path d="${d}" stroke="${INK}" stroke-width=".7" opacity=".055" fill="none"/>`;
    [[120, 560], [1296, 500], [236, 742], [1160, 70], [1040, 770], [300, 84]].forEach(([x, y]) => { h += `<path class="ink" d="M${x - 6} ${y}L${x + 6} ${y}M${x} ${y - 6}L${x} ${y + 6}" stroke-width=".9" opacity=".55"/>`; });
    return h;
  }
  /* Margin notes. list = [{ title, note, x, y, side: "start" | "end", to: [sheet x, sheet y] }] */
  function setLabels(list) {
    labels = list; if (!labelLayer) return;
    labelLayer.innerHTML = list.map((l, i) => `<text class="lab-t" data-i="${i}" x="${l.x}" y="${l.y}" text-anchor="${l.side}">${l.title}</text><text class="lab-n" x="${l.x}" y="${l.y + 22}" text-anchor="${l.side}">${l.note}</text>`).join("");
    let h = ""; rand = rng(5);
    labelLayer.querySelectorAll(".lab-t").forEach((t) => {
      const l = list[+t.dataset.i], w = t.getComputedTextLength(), wn = t.nextElementSibling.getComputedTextLength(), s = l.side === "start" ? 1 : -1;
      const a = [l.x + s * (w + 13), l.y - 7], b = [a[0] + s * Math.max(30, wn - w + 8), a[1] + (rand() - 0.5) * 2], m = [(b[0] + l.to[0]) / 2 + (rand() - 0.5) * 5, (b[1] + l.to[1]) / 2 + (rand() - 0.5) * 5];
      h += `<path class="lead" d="M${f(a[0])} ${f(a[1])}L${f(b[0])} ${f(b[1])}Q${f(m[0])} ${f(m[1])} ${f(l.to[0])} ${f(l.to[1])}"/>`;
      h += `<circle class="ring" cx="${f(a[0])}" cy="${f(a[1])}" r="3"/><circle class="ring" cx="${f(l.to[0])}" cy="${f(l.to[1])}" r="2.6"/>`;
    });
    labelLayer.insertAdjacentHTML("afterbegin", h);
  }

  function start(ep) {
    setup(document.querySelector("#stage"));
    let sceneDef = ep.scenes[0], paused = false, now = 0, last = null;
    const playBtn = document.querySelector("#play"), timeEl = document.querySelector("#time"), statusEl = document.querySelector("#status");
    const tile = toothTile();
    const kit = {
      PAL, INK, P, U, CS, SN, rng, mix, lighter, darker, f,
      edges, loop, curve, wash, shape, dot, shadow, box, crate, cyl, doll, arm, SHOULDER, setLabels,
      /* draw into the still part of the sheet, behind everything that moves */
      still: (html) => back.insertAdjacentHTML("beforeend", html),
      /* a new layer in the moving part of the sheet; layers stack in the order they are made */
      layer: (html = "", attrs = "") => g(live, html, attrs),
      node: g,
      labelLayer: () => { labelLayer = g(live, "", 'class="labels"'); setLabels(labels); return labelLayer; },
      seed: (s) => { rand = rng(s); },
      /* the part of the sheet a phone shows: [x, y, w, h] */
      focus: (v) => { tight = v; layout(); },
    };
    function load(s) {
      sceneDef = s; now = 0; labelLayer = null; labels = []; rand = rng(3);
      document.querySelectorAll("#scenes button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.id === s.id ? "true" : "false"));
      document.querySelector("#story").innerHTML = s.story;
      back.innerHTML = `<defs><pattern id="tooth" patternUnits="userSpaceOnUse" width="256" height="256"><image href="${tile}" width="256" height="256"/></pattern></defs>` + paper();
      live.innerHTML = "";
      ep.init(kit, s);
      layout(); draw();
    }
    function draw() {
      timeEl.textContent = hms(now);
      if (ep.status) statusEl.textContent = ep.status();
    }
    const seg = document.querySelector("#scenes");
    ep.scenes.forEach((s, i) => {
      const b = document.createElement("button");
      b.type = "button"; b.dataset.id = s.id; b.innerHTML = `<i>${i + 1}</i>${s.label}`;
      b.addEventListener("click", () => load(s)); seg.appendChild(b);
    });
    const setPaused = (p) => { paused = p; playBtn.textContent = p ? "Play" : "Pause"; };
    playBtn.addEventListener("click", () => setPaused(!paused));
    document.addEventListener("keydown", (e) => { if (e.code === "Space" && !e.target.closest("button,input,select")) { e.preventDefault(); setPaused(!paused); } });
    document.addEventListener("visibilitychange", () => { last = null; });
    load(sceneDef);
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) setPaused(true);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => setLabels(labels));
    function frame(t) {
      requestAnimationFrame(frame);
      if (last == null) { last = t; return; }
      const dt = Math.min(0.05, (t - last) / 1000); last = t;
      if (paused) return;
      now += dt; ep.tick(dt, now); draw();
    }
    requestAnimationFrame(frame);
  }

  return { start, PAL, hms, rng };
})();

</script>
<script>
/* Story 01, The candy line.
   A stream is a line that never ends, an event is one candy, an operator is a worker on the line.
   The same candies come out of the kitchen in every scene; only the workers change. */
(() => {
  const V = 1.3;                                   // belt speed, room units per second
  const FX = 13, FY = 6.4, WH = 3.7;              // the room: floor size and wall height
  const X1 = 10.6, BY = 3.9, BW = 1.0, TOP = 0.9;  // the belt: from the hatch at x = 0 to X1, centred on y = BY
  const WY = 2.95, MAN = 1.15;                     // workers stand just behind the belt; MAN is their size
  const R = 0.3, R_SMALL = 0.18;
  const FLAVORS = ["a", "b", "c"];
  const PUSH = 0.6, FALL = 0.45, POP = 0.4, SLAT = 0.6;
  const CLOCK = [5.9, 2.85, 0.6];                  // on the back wall: x, height, radius

  const SCENES = [
    { id: "line", label: "The line", stations: [{ kind: "watch", x: 5.2 }],
      story: "A stream is like this candy line. It has no last candy. Each one rolls out of the kitchen at its own moment, and the clock on the wall keeps the time. Nobody waits for the batch to be finished, because it never is." },
    { id: "inspector", label: "The inspector", stations: [{ kind: "filter", x: 5.2 }],
      story: "A worker on the line looks at one candy at a time and decides on the spot. Big enough stays on the line. Too small goes in the bin. The worker needs no memory of the candies before. Engineers call this a filter." },
    { id: "wrapper", label: "The wrapper", stations: [{ kind: "wrap", x: 5.2 }],
      story: "This worker changes every candy. One raw candy comes in, one wrapped candy goes out, and the line never stops for it. Engineers call this a transform." },
    { id: "both", label: "The whole line", stations: [{ kind: "filter", x: 3.4 }, { kind: "wrap", x: 7.4 }],
      story: "Workers stand in a row and each one does a small job. Raw candy goes in on the left and finished candy comes out on the right, a moment after it arrived. That is stream processing: the work happens while things move." },
  ];

  let k, PAL, P, U, rnd, sc, L, items, stations, nextBorn, smallRun, lastFlavor, counts, serial, slats, hands;

  /* ----- the room, drawn once ----- */
  function room() {
    const wallP = (y, z) => P(0, y, z), backP = (x, z) => P(x, 0, z);
    let h = "";
    h += k.box(-0.3, -0.3, -0.55, FX + 0.3, FY + 0.3, 0.37, PAL.base);
    h += k.box(-0.3, -0.3, -0.18, FX + 0.3, FY + 0.3, 0.18, k.darker(PAL.floor, 0.12), { top: PAL.floor });
    const joints = [];
    for (let x = 1; x < FX; x++) joints.push([P(x, 0), P(x, FY)]);
    for (let y = 1; y < FY; y++) joints.push([P(0, y), P(FX, y)]);
    h += k.edges(joints, { w: 0.7, op: 0.22, over: 0, amp: 0.5 });
    // two walls of a room cut open: the kitchen wall on the left, the back wall on the right
    h += k.box(-0.3, -0.3, 0, 0.3, FY + 0.3, WH, PAL.wall);
    h += k.box(0, -0.3, 0, FX, 0.3, WH, PAL.wall, { side: k.darker(PAL.wall, 0.09) });
    // the hatch the line comes through, with its sill and jamb
    const hy0 = BY - 0.72, hy1 = BY + 0.72, hz0 = 0.5, hz1 = 1.95;
    h += k.wash([wallP(hy0, hz0), wallP(hy1, hz0), wallP(hy1, hz1), wallP(hy0, hz1)], PAL.dark);
    h += k.wash([P(0, hy0, hz0), P(0, hy1, hz0), P(-0.3, hy1, hz0), P(-0.3, hy0, hz0)], k.darker(PAL.wall, 0.3));
    h += k.wash([P(0, hy0, hz0), P(0, hy0, hz1), P(-0.3, hy0, hz1), P(-0.3, hy0, hz0)], k.darker(PAL.wall, 0.45));
    h += k.loop([wallP(hy0, hz0), wallP(hy1, hz0), wallP(hy1, hz1), wallP(hy0, hz1)], { w: 1.4 });
    h += k.shape("M" + [wallP(BY + 1.2, 2.2), wallP(BY - 1.2, 2.2), wallP(BY - 1.2, 2.8), wallP(BY + 1.2, 2.8)].map((p) => k.f(p[0]) + " " + k.f(p[1])).join("L") + "Z", PAL.white, 1.2);
    const s0 = wallP(BY + 1.03, 2.34);
    h += `<text class="sign" transform="matrix(${k.CS} ${-k.SN} 0 1 ${k.f(s0[0])} ${k.f(s0[1])})">KITCHEN</text>`;
    // on the back wall: a window, the clock face, a shelf of jars, a door
    h += k.wash([backP(1.2, 1.6), backP(3.3, 1.6), backP(3.3, 3.0), backP(1.2, 3.0)], PAL.glass);
    h += k.loop([backP(1.2, 1.6), backP(3.3, 1.6), backP(3.3, 3.0), backP(1.2, 3.0)], { w: 1.5 });
    h += k.edges([[backP(2.25, 1.6), backP(2.25, 3.0)], [backP(1.2, 2.4), backP(3.3, 2.4)]], { w: 1.1 });
    h += k.edges([[backP(1.5, 1.85), backP(1.9, 2.2)], [backP(1.55, 2.05), backP(1.75, 2.22)], [backP(2.6, 2.6), backP(3.0, 2.85)]], { w: 0.8, op: 0.5, over: 0 });
    const c0 = P(CLOCK[0], 0, CLOCK[1]), m = `matrix(${k.f(k.CS * U)} ${k.f(k.SN * U)} 0 ${-U} ${k.f(c0[0])} ${k.f(c0[1])})`;
    let ticks = "";
    for (let i = 0; i < 12; i++) { const a = (i / 12) * Math.PI * 2, r0 = CLOCK[2] * (i % 3 ? 0.84 : 0.74), r1 = CLOCK[2] * 0.92; ticks += `M${(Math.sin(a) * r0).toFixed(3)} ${(Math.cos(a) * r0).toFixed(3)}L${(Math.sin(a) * r1).toFixed(3)} ${(Math.cos(a) * r1).toFixed(3)}`; }
    h += `<g transform="${m}"><circle r="${CLOCK[2] + 0.07}" fill="${PAL.dark}"/><circle r="${CLOCK[2]}" fill="${PAL.white}"/><path class="ink thin" d="${ticks}"/></g>`;
    h += k.box(3.62, 0, 1.95, 1.56, 0.42, 0.08, PAL.wood);
    FLAVORS.forEach((fl, i) => { h += k.cyl(3.92 + i * 0.48, 0.21, 2.03, 0.15, 0.36, PAL[fl]) + k.cyl(3.92 + i * 0.48, 0.21, 2.39, 0.16, 0.06, PAL.white); });
    h += k.wash([backP(11.2, 0), backP(12.4, 0), backP(12.4, 2.5), backP(11.2, 2.5)], PAL.blue);
    h += k.loop([backP(11.2, 0), backP(12.4, 0), backP(12.4, 2.5), backP(11.2, 2.5)], { w: 1.4 });
    h += k.loop([backP(11.4, 1.4), backP(12.2, 1.4), backP(12.2, 2.3), backP(11.4, 2.3)], { w: 0.9, op: 0.7, over: 0.5 });
    h += k.dot(...backP(12.2, 1.15), 2.6, PAL.yellow, 1.1);
    // spare boxes against the back wall
    h += k.shadow([P(8.6, 1.5), P(10.85, 1.5), P(10.85, 1.85), P(8.6, 1.85)]);
    h += k.box(8.6, 0.5, 0, 1.1, 1.0, 0.8, PAL.wood) + k.box(8.75, 0.6, 0.8, 0.8, 0.8, 0.6, PAL.woodDark) + k.box(9.95, 0.45, 0, 0.9, 0.9, 0.7, PAL.wood);
    // what the belt and the boxes throw on the floor
    h += k.shadow([P(0, BY + 0.5), P(X1, BY + 0.5), P(X1, BY + 0.95), P(0, BY + 0.95)], 0.12);
    k.still(h);
  }

  function beltParts() {
    const y0 = BY - BW / 2, y1 = BY + BW / 2, top = [P(0, y0 + 0.08, TOP), P(X1, y0 + 0.08, TOP), P(X1, y1 - 0.08, TOP), P(0, y1 - 0.08, TOP)];
    const legX = [1.2, 3.6, 6.0, 8.4, 10.3];
    let h = legX.map((x) => k.box(x, y0 + 0.06, 0, 0.12, 0.12, 0.62, PAL.steel)).join("");
    h += k.box(0, y0, 0.62, X1, BW, TOP - 0.62, PAL.steel);
    h += k.wash(top, PAL.belt) + k.loop(top, { w: 1 });
    h += legX.map((x) => k.box(x, y1 - 0.18, 0, 0.12, 0.12, 0.62, PAL.steel)).join("");
    const d = "M" + top.map((p) => k.f(p[0]) + " " + k.f(p[1])).join("L") + "Z";
    let lines = "";
    for (let i = -1; i * SLAT < X1; i++) { const a = P(i * SLAT, y0 + 0.12, TOP), b = P(i * SLAT, y1 - 0.12, TOP); lines += `M${k.f(a[0])} ${k.f(a[1])}L${k.f(b[0])} ${k.f(b[1])}`; }
    h += `<defs><clipPath id="belt-top"><path d="${d}"/></clipPath></defs><g clip-path="url(#belt-top)"><g id="slats"><path d="${lines}" stroke="#c9c2b8" stroke-width="1.3" opacity=".75" fill="none"/></g></g>`;
    return h;
  }

  function station(def, i) {
    const look = { watch: 0, filter: 1, wrap: 2 }[def.kind], coat = { watch: PAL.green, filter: PAL.blue, wrap: PAL.red }[def.kind];
    const foot = P(def.x, WY, 0), st = { ...def, foot, act: -9, phase: i * 1.7 };
    if (def.kind === "wrap") {              // a side table with a roll of wrapping paper
      k.node(L.dolls, k.box(def.x + 0.75, WY - 0.75, 0, 0.9, 0.7, 0.8, PAL.wood) + k.cyl(def.x + 1.2, WY - 0.4, 0.8, 0.2, 0.45, PAL.white));
    }
    st.body = k.node(L.dolls, `<g transform="scale(${MAN})">${k.doll({ look, coat })}</g>`);
    st.arms = k.SHOULDER.map((s, a) => k.node(L.arms, `<g transform="scale(${MAN})">${k.arm({ look, coat, tool: def.kind === "filter" && a === 0 ? "paddle" : null })}</g>`));
    if (def.kind === "filter") {
      st.bin = [def.x + 0.15, BY + 1.3, 1.2, 1.0, 0.7];
      const c = k.crate(st.bin[0], st.bin[1], 0, st.bin[2], st.bin[3], st.bin[4], PAL.red);
      k.node(L.under, k.shadow([P(st.bin[0], st.bin[1] + st.bin[3]), P(st.bin[0] + st.bin[2], st.bin[1] + st.bin[3]), P(st.bin[0] + st.bin[2], st.bin[1] + st.bin[3] + 0.35), P(st.bin[0], st.bin[1] + st.bin[3] + 0.35)]) + c.under);
      k.node(L.over, c.over);
    }
    return st;
  }

  /* ----- candies ----- */
  function candyArt(it) {
    const r = it.r * U, col = PAL[it.flavor], pts = [];
    for (let i = 0; i < 12; i++) { const a = (i / 12) * Math.PI * 2, q = r * (1 + 0.035 * Math.sin(i * 2.4 + it.id)); pts.push([Math.cos(a) * q, Math.sin(a) * q]); }
    const ball = k.curve(pts, true);
    let h = `<ellipse class="cs" cx="${k.f(r * 0.25)}" cy="${k.f(r * 1.02)}" rx="${k.f(r * 1.05)}" ry="${k.f(r * 0.42)}" fill="#3d3631" opacity=".28"/>`;
    if (it.wrapped) {
      const tw = (s) => k.shape(`M${k.f(s * r * 0.8)} 0L${k.f(s * r * 1.85)} ${k.f(-r * 0.68)}L${k.f(s * r * 1.6)} 0L${k.f(s * r * 1.85)} ${k.f(r * 0.68)}Z`, k.lighter(col, 0.3), 1.2);
      h += `<g transform="rotate(30)">${tw(-1)}${tw(1)}${k.shape(ball, col, 1.4)}`;
      h += `<path d="M${k.f(-r * 0.34)} ${k.f(-r * 0.93)}Q${k.f(-r * 0.05)} 0 ${k.f(-r * 0.34)} ${k.f(r * 0.93)}L${k.f(r * 0.34)} ${k.f(r * 0.93)}Q${k.f(r * 0.63)} 0 ${k.f(r * 0.34)} ${k.f(-r * 0.93)}Z" fill="${PAL.white}" opacity=".9"/>`;
      h += `<path class="ink" d="M${k.f(-r * 0.34)} ${k.f(-r * 0.93)}Q${k.f(-r * 0.05)} 0 ${k.f(-r * 0.34)} ${k.f(r * 0.93)}M${k.f(r * 0.34)} ${k.f(-r * 0.93)}Q${k.f(r * 0.63)} 0 ${k.f(r * 0.34)} ${k.f(r * 0.93)}" stroke-width="1"/></g>`;
    } else {
      h += k.shape(ball, col, 1.4);
      h += `<path d="M${k.f(-r * 0.55)} ${k.f(-r * 0.25)}Q${k.f(-r * 0.5)} ${k.f(-r * 0.62)} ${k.f(-r * 0.12)} ${k.f(-r * 0.66)}" stroke="#fffaf0" stroke-width="${k.f(r * 0.2)}" stroke-linecap="round" fill="none" opacity=".75"/>`;
    }
    return `<g transform="translate(0 ${k.f(-r)})">${h}</g>`;
  }
  function wrap(it) { it.wrapped = true; it.el.innerHTML = candyArt(it); }
  function newCandy(born) {
    let small = rnd() < 0.34;
    if (small && smallRun >= 2) small = false;
    smallRun = small ? smallRun + 1 : 0;
    let fl = FLAVORS[Math.floor(rnd() * 3)];
    if (fl === lastFlavor && rnd() < 0.6) fl = FLAVORS[(FLAVORS.indexOf(fl) + 1) % 3];
    lastFlavor = fl;
    const it = { id: serial++, flavor: fl, small, r: small ? R_SMALL : R, state: "belt", done: 0, wrapped: false, pop: -9, born };
    it.el = k.node(L.candy, ""); it.el.innerHTML = candyArt(it);
    items.push(it);
    return it;
  }
  const gap = () => (rnd() < 0.22 ? 0.8 + rnd() * 0.25 : 1.3 + rnd() * 2.1);    // candies come unevenly, sometimes two close together

  /* A candy meets every worker it has reached. quiet = before the story starts, so nothing is counted or animated. */
  function meet(it, x, now, quiet) {
    while (it.state === "belt" && it.done < stations.length && x >= stations[it.done].x) {
      const st = stations[it.done++];
      if (st.kind === "watch") { if (!quiet) counts.seen++; }
      else if (st.kind === "filter") {
        if (it.small) {
          if (quiet) it.state = "gone";
          else { it.state = "push"; it.t0 = now; it.from = x; it.bin = st.bin; st.act = now; counts.small++; }
        } else if (!quiet) counts.passed++;
      } else if (st.kind === "wrap") {
        wrap(it);
        if (!quiet) { it.pop = now; st.act = now; counts.wrapped++; }
      }
    }
  }

  function place(it, now) {
    const x = V * (now - it.born);
    let p, s = 1, air = false;
    if (it.state === "belt") {
      meet(it, x, now, false);
      if (it.state === "belt" && x >= X1) { it.state = "fall"; it.t0 = now; }
    }
    if (it.state === "belt") {
      p = P(x, BY, TOP);
      const u = (now - it.pop) / POP;
      if (u >= 0 && u < 1) s = 1 + 0.4 * Math.sin(Math.PI * u);
      it.el.style.opacity = Math.max(0, Math.min(1, (x - 0.05) / 0.3));
    } else if (it.state === "push") {         // off the line, over the edge and into the bin
      const u = (now - it.t0) / PUSH, e = Math.min(1, u), b = it.bin, sink = Math.max(0, u - 1) / 0.35;
      if (sink >= 1) { it.state = "gone"; return; }
      p = P(it.from + (b[0] + b[2] / 2 - it.from) * e, BY + (b[1] + b[3] / 2 - BY) * e, TOP + (b[4] - 0.05 - TOP) * e + 0.75 * Math.sin(Math.PI * e) - sink * 0.55);
      air = true;
    } else if (it.state === "fall") {         // off the end of the line, into the shipping box
      const u = (now - it.t0) / FALL, e = Math.min(1, u), sink = Math.max(0, u - 1) / 0.35;
      if (sink >= 1) { it.state = "gone"; return; }
      p = P(X1 + 1.15 * e, BY, TOP + 0.25 * Math.sin(Math.PI * e) - 0.2 * e - sink * 0.5);
      air = true;
    } else return;
    it.el.setAttribute("transform", `translate(${k.f(p[0])} ${k.f(p[1])})${s !== 1 ? ` scale(${s.toFixed(3)})` : ""}`);
    if (air !== it.air) { it.air = air; it.el.classList.toggle("air", air); }
  }

  function workers(now) {
    stations.forEach((st) => {
      // the candy this worker is dealing with: the nearest one that has not gone past yet
      let near = 9;
      items.forEach((it) => { if (it.state !== "belt") return; const d = st.x - V * (now - it.born); if (d > -0.5 && Math.abs(d) < Math.abs(near)) near = d; });
      const busy = Math.max(0, 1 - (now - st.act) / 0.5);
      const ready = st.kind === "watch" ? 0 : Math.max(0, 1 - Math.abs(near) / 0.9) * 0.6;
      const reach = Math.max(busy, ready);
      const lean = -5 * reach + Math.sin(now * 1.7 + st.phase) * 0.8, bob = Math.sin(now * 2.2 + st.phase) * 0.6;
      const [fx, fy] = st.foot, a = (lean * Math.PI) / 180;
      st.body.setAttribute("transform", `translate(${k.f(fx)} ${k.f(fy + bob)}) rotate(${lean.toFixed(2)})`);
      const turn = [
        8 + 62 * reach + (st.kind === "filter" ? 12 * busy : 0),
        -8 + (st.kind === "wrap" ? 72 : st.kind === "filter" ? 30 : 0) * reach,
      ];
      k.SHOULDER.forEach(([sx, sy], i) => {
        const x = fx + MAN * (sx * Math.cos(a) - sy * Math.sin(a)), y = fy + bob + MAN * (sx * Math.sin(a) + sy * Math.cos(a));
        st.arms[i].setAttribute("transform", `translate(${k.f(x)} ${k.f(y)}) rotate(${turn[i].toFixed(1)})`);
      });
    });
  }

  /* ----- labels: each scene names only what it is about ----- */
  function labels() {
    const first = stations[0], last = stations[stations.length - 1], head = (st) => [st.foot[0] + 15 * MAN, st.foot[1] - 60 * MAN];
    const list = [
      { title: "KITCHEN", note: "candies come out one by one", x: 56, y: 150, side: "start", to: P(0, BY + 0.3, 1.7) },
      { title: "THE LINE", note: "never stops, never ends", x: 56, y: 486, side: "start", to: P(1.9, BY + 0.5, TOP) },
      { title: "CLOCK", note: "every candy has its moment", x: 1344, y: 130, side: "end", to: P(CLOCK[0] + 0.45, 0, CLOCK[1] + 0.2) },
      { title: "SHIPPING", note: "out as soon as it is ready", x: 1344, y: 650, side: "end", to: P(X1 + 1.9, BY + 0.2, 0.55) },
    ];
    const who = (st, title, note, y) => list.push({ title, note, x: 1344, y, side: "end", to: head(st) });
    if (sc.id === "line") who(first, "WORKER", "sees each candy as it passes", 300);
    if (sc.id === "inspector") who(first, "INSPECTOR", "one look, one decision", 300);
    if (sc.id === "wrapper") who(first, "WRAPPER", "one in, one out, changed", 300);
    if (sc.id === "both") { who(first, "INSPECTOR", "first job: pick", 250); who(last, "WRAPPER", "second job: wrap", 380); }
    const f = stations.find((s) => s.kind === "filter");
    if (f) list.push({ title: "TOO SMALL", note: "off the line, for good", x: 56, y: 660, side: "start", to: P(f.bin[0] + 0.15, f.bin[1] + f.bin[3], 0.45) });
    k.setLabels(list);
  }

  function init(kit, scene) {
    k = kit; PAL = kit.PAL; P = kit.P; U = kit.U; sc = scene; rnd = kit.rng(7);
    items = []; smallRun = 0; lastFlavor = null; serial = 0; counts = { seen: 0, passed: 0, small: 0, wrapped: 0 };
    room();
    // the moving part of the sheet, back to front
    L = { clock: k.layer(), dolls: k.layer(), belt: k.layer(), under: k.layer(), candy: k.layer(), arms: k.layer(), over: k.layer() };
    const c0 = P(CLOCK[0], 0, CLOCK[1]);
    hands = k.node(L.clock, `<line class="ink thin" x1="0" y1="0" stroke-width="2.2"/><line class="ink thin" x1="0" y1="0" stroke-width="1.4" style="stroke:#c4604f"/><circle r=".05" fill="${k.INK}"/>`, `transform="matrix(${k.f(k.CS * U)} ${k.f(k.SN * U)} 0 ${-U} ${k.f(c0[0])} ${k.f(c0[1])})"`).querySelectorAll("line");
    k.node(L.belt, beltParts()); slats = document.querySelector("#slats");
    stations = scene.stations.map(station);
    const ship = k.crate(X1 + 0.4, BY - 0.7, 0, 1.5, 1.4, 0.75, PAL.wood);
    k.node(L.under, k.shadow([P(X1 + 0.4, BY + 0.7), P(X1 + 1.9, BY + 0.7), P(X1 + 1.9, BY + 1.05), P(X1 + 0.4, BY + 1.05)]) + ship.under);
    k.node(L.over, ship.over);
    k.labelLayer(); labels();
    k.focus([246, 24, 908, 760]);
    // the line is already running when the story opens: candies made in the last seconds are on their way
    nextBorn = -X1 / V + 0.4;
    while (nextBorn <= 0) { const it = newCandy(nextBorn); meet(it, V * (0 - it.born), 0, true); nextBorn += gap(); }
    tick(0, 0);
  }

  function tick(dt, now) {
    while (nextBorn <= now) { newCandy(nextBorn); nextBorn += gap(); }
    items.forEach((it) => place(it, now));
    items = items.filter((it) => { if (it.state === "gone") it.el.remove(); return it.state !== "gone"; });
    workers(now);
    const ph = (V * now) % SLAT;
    slats.setAttribute("transform", `translate(${k.f(ph * k.CS * U)} ${k.f(ph * k.SN * U)})`);
    const hand = (el, turn, len) => { const a = turn * Math.PI * 2; el.setAttribute("x2", (Math.sin(a) * len).toFixed(3)); el.setAttribute("y2", (Math.cos(a) * len).toFixed(3)); };
    hand(hands[0], now / 3600, CLOCK[2] * 0.5); hand(hands[1], now / 60, CLOCK[2] * 0.8);
  }

  function status() {
    const n = (v, one, many) => `${v} ${v === 1 ? one : many}`;
    if (sc.id === "line") return n(counts.seen, "candy", "candies") + " so far";
    if (sc.id === "inspector") return `${counts.passed} passed · ${counts.small} too small`;
    if (sc.id === "wrapper") return `${counts.wrapped} wrapped`;
    return `${counts.wrapped} wrapped · ${counts.small} too small`;
  }

  Story.start({ scenes: SCENES, init, tick, status });
})();

</script>
