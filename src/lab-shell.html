<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="{{DESCRIPTION}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
{{CORE_CSS}}
</style>
<div class="page">
  <header>
    <div class="eyebrow">Proton Stream Lab · {{EP_NUM}}</div>
    <h1>{{H1}}</h1>
    <p class="lede">{{LEDE}}</p>
  </header>
  <div class="bar">
    <div class="seg" id="modes" role="group" aria-label="Operation"></div>
    <span class="spacer"></span>
    <button class="btn" id="play" type="button">Pause</button>
    <div class="seg" id="speed" role="group" aria-label="Speed">
      <button type="button" data-s="0.5" aria-pressed="false">½×</button>
      <button type="button" data-s="1" aria-pressed="true">1×</button>
      <button type="button" data-s="2" aria-pressed="false">2×</button>
    </div>
  </div>
  <div class="stage"><svg id="stage" class="sl" viewBox="0 0 1200 360" role="img" aria-label="Animated stream"></svg></div>
  <div class="caption">
    <pre class="sql" id="sql"></pre>
    <p class="note" id="note"></p>
  </div>
  <footer>{{SERIES}}</footer>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
{{CORE_JS}}
</script>
<script>
{{EP_JS}}
</script>
